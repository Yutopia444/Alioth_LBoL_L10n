MainMenu:
  Comment: "Eksperymentalna ścieżka zainspirowana \"Gensokyo Millenium\". Kompozycja\
    \ akcentuje kontrast pomiędzy wstępem a refrenem, odkrywając naturę gry lekkiej\
    \ oraz pełnej akcji.\nNazwa \"The Nineteenth Form\" bierze się z faktu, że jest\
    \ to nasz dziewiętnasta próba aranżacji \"Gensokyo Millennium\". Dodatkowo, nadal\
    \ eksplorujemy różne pomysły kompozycyjne."
  Name: Menu główne
  TrackName: The Nineteenth Form of Fantasy
  Original: Gensokyo Millennium ~ History of the Moon
Stage1:
  Comment: "Motyw Lasu Bambusowego Zaginionych, pierwszego etapu gry.\nUtwór jest\
    \ przepełniony ekscytacją do walki, szybko przygotowując gracza do nadchodzących\
    \ potyczek.\nZawiera w sobie dźwięki bazujące na śpiewie ptaków, wzmacniając w\
    \ ten sposób nocną atmosferę ścieżki."
  Name: 'Akt 1: Bambusowy Las Zgubionych'
  TrackName: Night Chasers
  Original: Retribution for the Eternal Night ~ Imperishable Night
Stage2:
  Comment: "Motyw drugiego etapu gry, Wąwozu Genbu.\nŚcieżka wywołuje duże poczucie\
    \ tajemniczości i przygody w nieznane. Wykorzystywanie etnicznych instrumentów\
    \ perkusyjnych sugeruje graczom, że znajdują się w obcym miejscu."
  Name: 'Act 2: Wąwóz Genbu'
  TrackName: Discovery & Discoverer
  Original: Fall of Fall ~ Autumnal Waterfall
Stage3:
  Name: 'Akt 3: Jezioro Boga Wiatru'
  TrackName: Hermit Sought on Wind
  Original: The Primal Scene of Japan the Girl Saw
  Comment: "Motyw trzeciego etapu gry, Jeziora Boga Wiatru.\nKompozycja brzmi jakby\
    \ poszukała się wraz z wiatrem. Czy czujesz, że kurtyna z pocisków czeka przed\
    \ tobą? Niech taniec wraz z muzyką poniesie cię ku nadchodzącym potyczkom!"
Elite2:
  Name: Elitarny wróg 2
  Original: Bell of Avīci ~ Infinite Nightmare
  Comment: "Utwór odtwarzany w momencie pojawienia się elitarnego przeciwnika.\nIntensywny\
    \ rytm wyłapuje napięcie i podekscytowanie potyczką. Jeśli grający nie da z siebie\
    \ wszystkiego, zostanie on pokonany niemalże natychmiast!"
  TrackName: Standoff
Aya:
  Comment: "Motyw walki z Ayą Shameimaru.\nPowiew wiatru niesie za sobą dźwięk migawki\
    \ kamery. Prawda i nieprawda, rzeczywistość i fikcja - wszystko trafia na łamy\
    \ gazety, która zaciekawia cię w nudne popołudnie. Jeśli jednak tylko dokładnie\
    \ wczytasz się w jej zawartość, zauważysz, że większość informacji okazuje się\
    \ być niezweryfikowanymi plotkami, które zmuszają ciebie do zrezygnowanego, \"\
    typowe dziennikarskie standardy.\""
  Name: Aya Shameimaru
  TrackName: A Hasty Story
  Original: Youkai Mountain ~ Mysterious Mountain
Rin:
  Comment: "Motyw walki z Rin Kaenbyou.\nNiepożądany youkai czyhający w cieniu, czekający\
    \ na swoją szansę. Jeśli jesteś jej celem, lepiej uważaj. Gdy mściwe dusze z podziemi\
    \ zaczynają cię otaczać, nie masz wyboru. Musisz się im przeciwstawić! Może jednak\
    \ reputacja Piekielnej Kraksy jest znacząco wyolbrzymiona?"
  Name: Rin Kaenbyou
  TrackName: Spirit Channeler
  Original: Corpse Voyage ~ Be of good cheer!
Nitori:
  Comment: "Motyw walki z Nitori Kawashiro.\nMoże ujdzie ci na sucho za pierwszym\
    \ lub drugim razem, ale zawsze kończy się na trzecim razie. Następnym razem gdy\
    \ ją napotkasz, lepiej uważaj. Puszczanie baniek to tylko początek, bo zanim się\
    \ zorientujesz, twój świat zostanie postawiony do góry nogami!"
  Name: Nitori Kawashiro
  TrackName: in the blue
  Original: Akutagawa Ryuunosuke's "Kappa" ~ Candid Friend
Sanyue:
  Comment: "Motyw bitewny reprezentujący Trzy Wróżki Światła.\nWalki jeden na jednego\
    \ są już niemodne. Troje na jednego to prawdziwa definicja przyjaźni. Bezdźwięcznie\
    \ zakradnij się, nie zostawiając za sobą żadnego śladu. Niecierpliwisz się? Jasne!\
    \ Teraz możesz dumnie rozpocząć swoją pełnoskalową wojnę!"
  Name: Trzy Wróżki Światła
  TrackName: Curious & Alert & Mischievous
  Original: The Refrain of the Lovely Great War/Great Fairy Wars ~ Fairy Wars
Kokoro:
  Comment: "Motyw walki z Hata no Kokoro.\nCzy za tą maską kryje się twarz pełna uśmiechu\
    \ czy płaczu? Tysiące emocji to tysiąc różnych sposobów na ich ekspresję, gdzie\
    \ część z nich okazuje spokój, a inne ukrywają zagrożenie. Przejrzyj maskę, a\
    \ odnajdziesz jej prawdziwe uczucia, które być może okażą się kluczem do zwycięstwa."
  Name: Hata no Kokoro
  TrackName: Ǝmotioɲ
  Original: The Lost Emotion
Clownpiece:
  Comment: "Motyw walki z Clownpiece.\nPiekielny chaos jest jej prezentem dla ludzkości,\
    \ a transformacja Stolicy Księżycowej w bezładny raj również jest zadaniem niecierpiącym\
    \ zwłoki. Masz jeszcze trochę czasu, by uciec przed tym incydentem. 3, 2, 1...\
    \ Koniec czasu!"
  Name: Clownpiece
  TrackName: Chaotic paradise
  Original: Pierrot of The Star-Spangled Banner
Siji:
  Comment: "Motyw walki z Eiki Shiki.\nSąd ostateczny zaraz się rozpocznie. Wyspowiadaj\
    \ się ze swoich grzechów przez sędzią. Następnie, daj każdemu możliwość stawienia\
    \ oporu: walcz o swoją wolność albo odkup swoje występki w piekle."
  Name: Eiki Shiki
  TrackName: THe last judgment
  Original: Eastern Judgement in the Sixtieth Year ~ Fate of Sixty Years
Marisa:
  Comment: "Motyw walki z Marisą Kirisame.\nSłynna czarownica niedługo się tu zjawi,\
    \ zapowiadając oślepiający spektakl. Niebo rozjaśni się gwiazdami w momencie kiedy\
    \ magiczne działo aktywuje się, pokrywając horyzont ogniem i iskrami. Moment,\
    \ w którym światło i dźwięk złączą się w jedną całość, odbierze tobie dech w piersiach."
  Name: Marisa Kirisame
  TrackName: Form of Magic
  Original: Love-Colored Master Spark
Youmu:
  Original: Eastern Ghostly Dream ~ Ancient Temple/Hiroari Shoots a Strange Bird ~
    Till When?
  Comment: "Motyw walki z Youmu Konpaku.\nKażda nuta to ostrze przecinające niebo,\
    \ ziemię oraz wszystko inne. W momencie, kiedy pojawia się forma miecza, nie ma\
    \ już ucieczki. Niewykluczone, że to mogłaby być symfonia dla dobywania mieczy.\
    \ (śmiech)"
  Name: Youmu Konpaku
  TrackName: Swing the Blade
Sakuya:
  Comment: "Motyw walki z Sakuyą Izayoi.\nZatrzymaj chwilę! Ten świat stoi ponad czasem\
    \ i jego mistrzyni w pełni kontroluje jego ruch. Rozłóż noże w perfekcyjny układ,\
    \ kierując je prosto na przeciwnika, a następnie pstryknij palcami! Wprowadź odwróconą\
    \ czasoprzestrzeń, wywracając wszystko do góry nogami."
  Name: Sakuya Izayoi
  TrackName: Form of Stopped Time
  Original: Flowering Night
Shop:
  Name: Sklep Takane
  TrackName: A Break in the Woods
  Original: Banditry Technology
  Comment: "Utwór oddaje atmosferę relaksu i odpoczynku urlopowego.\nPrzestańcie walczyć\
    \ i wspólnie odprężcie się przy muzyce!"
Gap:
  TrackName: Nightfall Melody
  Name: Wewnątrz szczeliny
  Original: Necrofantasia
  Comment: "Utwór w stylu europejskim.\nZ pomocą eleganckiego klawesynu oraz spokojnych\
    \ dzwonków, słuchający czuję się zrelaksowany i chętnie idzie na przerwę."
Adventure1:
  Name: Wydarzenie 1
  TrackName: Set Out
  Original: Gensokyo Millennium ~ History of the Moon
  Comment: "Wesoła, przygotowana pod dialogi melodia.\nIrlandzki flecik, marimba oraz\
    \ inne instrumenty perkusyjne grają unisono. Przeplatające się melodie przywołują\
    \ na myśl poczucie zachwytu podróżnika przygotowującego się do wyruszenia w świat."
Adventure2:
  Name: Wydarzenie 2
  TrackName: Playing in the Woods
  Original: The Gensokyo the Gods Loved
  Comment: "Ten utwór przekazuje poczucie beztroski i pozytywnego myślenia.\nWprowadzenie\
    \ fortepianu oddaje atmosferę lasu, wraz z radosnymi skrzypcami służącymi za główną\
    \ melodię, tworzy wyraźny obraz wesołej zabawy wśród drzew."
Adventure3:
  Name: Wydarzenie 3
  TrackName: Left Behind
  Original: Girls' Secret Sealing Club
  Comment: "Rodzaj utworu stworzonego w sytuacji, kiedy kompozytor czuje się poruszony.\n\
    Może emotikona \"ORZ\" najlepiej oddaje tutaj emocje?"
Elite1:
  Name: Elitarny wróg 1
  TrackName: Do Not Underestimate
  Original: Eternal Transient Reign
  Comment: "Utwór odtwarzany w momencie pojawienia się elitarnego przeciwnika.\nIntensywny\
    \ rytm służy tutaj za przypomnienie o trudnej potyczce, która zaraz się rozpocznie.\
    \ Czy przeciwnik jest pewny zwycięstwa?"
Doremy:
  Name: Doremy
  TrackName: Close eyes
  Original: Eternal Spring Dream
  Comment: "Motyw walki z Doremy Sweet.\nZamknij oczy i zanurz się w świecie snów,\
    \ nie mając zamiaru się budzić. We śnie, brud będzie oczyszczony, porządek stanie\
    \ się trwały, a życie zostanie zatracone."
Reimu:
  Name: Reimu Hakurei
  TrackName: Form of Spirit Seal
  Original: Maiden's Capriccio ~ Dream Battle
  Comment: "Motyw walki z Reimu Hakurei.\nGdy twoja przygody się tylko się rozpoczyna,\
    \ ona zawsze tam czeka, gotowa na przeciwnika. Przedwieczna forma Pieczęci Duszy,\
    \ wraz z jej oderwanymi od czasu zasadami i porządkiem, tworzą barierę nie do\
    \ przebicia. Tylko przechodząc tą próbę, zyskasz jej aprobatę i będziesz gotowy\
    \ do wyruszenia w dalszą drogę."
Cirno:
  Name: Cirno
  TrackName: Form of Freezing Ice
  Original: Tomboyish Girl in Love
