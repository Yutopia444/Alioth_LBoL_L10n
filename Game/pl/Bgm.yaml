MainMenu:
  Comment: "Eksperymentalna ścieżka zainspirowana \"Gensokyo Millenium\". Kompozycja\
    \ akcentuje kontrast pomiędzy wstępem a refrenem, odkrywając naturę gry lekkiej\
    \ oraz pełnej akcji.\nNazwa \"The Nineteenth Form\" bierze się z faktu, że jest\
    \ to nasz dziewiętnasta próba aranżacji \"Gensokyo Millennium\". Dodatkowo, nadal\
    \ eksplorujemy różne pomysły kompozycyjne."
  Name: Menu Główne
  TrackName: The Nineteenth Form of Fantasy
  Original: Gensokyo Millennium ~ History of the Moon
Stage1:
  Comment: "Motyw Lasu Bambusowego Zaginionych, pierwszego etapu gry.\nUtwór jest\
    \ przepełniony ekscytacją do walki, szybko przygotowując gracza do nadchodzących\
    \ potyczek.\nZawiera w sobie dźwięki bazujące na śpiewie ptaków, wzmacniając w\
    \ ten sposób nocną atmosferę ścieżki."
  Name: 'Akt 1: Bambusowy Las Zgubionych'
  TrackName: Night Chasers
  Original: Retribution for the Eternal Night ~ Imperishable Night
Stage2:
  Comment: "Motyw drugiego etapu gry, Wąwozu Genbu.\nŚcieżka wywołuje duże poczucie\
    \ tajemniczości i przygody w nieznane. Wykorzystywanie etnicznych instrumentów\
    \ perkusyjnych sugeruje graczom, że znajdują się w obcym miejscu."
  Name: 'Act 2: Wąwóz Genbu'
  TrackName: Discovery & Discoverer
  Original: Fall of Fall ~ Autumnal Waterfall
Stage3:
  Name: 'Akt 3: Jezioro Boga Wiatru'
  TrackName: Hermit Sought on Wind
  Original: The Primal Scene of Japan the Girl Saw
