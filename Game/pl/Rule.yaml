General:
  Name: Przedmowa
  Description: "Nie musisz znać tych zaawansowanych zasad, aby czerpać przyjemność\
    \ z grania w Lost Branch of Legend.\n\nAle jeśli już grałeś przez dłuższy czas...\n\
    Jeśli czujesz, że chcesz doszlifować swoje umiejętności we wszystkim, co ta gra\
    \ ma do zaoferowania, zapraszamy Cię do dalszego czytania!"
ManaColor:
  Name: Kolory many
  Description: "Ideą gry jest połączenie postaci z Touhou z systemem kolorowej many\
    \ znanej między innymi z gier takich jak Magic: The Gathering.\nJest 7 różnych\
    \ typów many w grze.\n5 zwykłych monochromatycznych: biała, niebieska, czarna,\
    \ czerwona i zielona. Jest też bezkolorowa mana, która nie należy do żadnego koloru\
    \ oraz mana filozoficzna, która ma w sobie wszystkie kolory. Powszechna mana w\
    \ kosztach może zostać zapłacona dowolnym kolorem i jest reprezentowana liczbą.\n\
    Koszt niektórych kart wymaga w szczególności bezkolorowej many.\nWarto jest wspomnieć,\
    \ że mana filozoficzna, będąca wszystkimi kolorami naraz, może być potężniejsza\
    \ od wielokolorowych Landów z Magic: The Gathering. Na przykład, jeżeli gracz\
    \ posiada eksponat |Kamień Piwonii|, która wymaga wydawania czerwonej many, jak\
    \ i |Kostkę Lodu|, która wymaga niebieskiej, pojedyncza mana filozoficzna będzie\
    \ wpływała na obydwa efekty."
DamageType:
  Name: Rodzaje obrażeń
  Description: "Są 3 typy obrażeń: \"obrażenia od ataku\", \"bezpośrednie obrażenia\"\
    \ oraz \"utrata życia\".\nWiększość obrażeń w grze są obrażeniami od ataków, na\
    \ które mają wpływ Moc, Bezsilność, Zryw, Unik, Celność i inne mechaniki. Obrażenia\
    \ od ataku są redukowane Blokiem i Barierą. Animacje tych ataków przedstawiają\
    \ zazwyczaj pocisk albo laser.\nEfekty \"obrażeń bezpośrednich\" oraz \"utraty\
    \ życia\" są efektami, które nie wchodzą w interakcje z większością mechanik.\
    \ \"Bezpośrednie obrażenia\" można zredukować Blokiem i Barierą, ale \"utraty\
    \ życia\" już nie.\nUciążliwym, byłoby wymieniać wszystkie przypadki pierwszych\
    \ dwóch typów obrażeń, więc tekst nie będzie ich rozróżniał. Generalnie, obrażenia\
    \ niepochodzące od ataków są \"bezpośrednimi obrażeniami\"."
CardPool:
  Name: Pula kart
  Description: "Karty pojawią się w puli nagród, jeśli spełniają następujące warunki:\n\
    1. Koszt many tej karty może zostać zapłacony z aktualnej |bazy many|.\n2. Jeśli\
    \ jest to karta unikalna dla postaci, to można ją znaleźć tylko wtedy, gdy gra\
    \ się daną postacią lub posiada się jej |Lśniący eksponat|.\n3. Każdy kolor many\
    \ na tej karcie jest obecny w twojej |bazie many|. Mana filozoficzna nie jest\
    \ brana pod uwagę.\n\nDla przykładu załóżmy, że grasz jako Reimu i posiadasz |Mroczną\
    \ Księgę Czarów|, |Kamień Filozoficzny| i |Pobijak Cudów|. |d:(Wymieniłeś się\
    \ Lśniącymi eksponatami z Eirin...)|\nTwoja |baza many| posiada <sprite=\"ManaSprite\"\
    \ name=\"W\"><sprite=\"ManaSprite\" name=\"W\"><sprite=\"ManaSprite\" name=\"\
    R\"><sprite=\"ManaSprite\" name=\"R\"><sprite=\"ManaSprite\" name=\"B\"><sprite=\"\
    ManaSprite\" name=\"P\"><sprite=\"ManaSprite\" name=\"C\">. Możesz znależć karty\
    \ unikalne dla Reimu i Marisy, bo posiadasz jej |Mroczną Księgę Czarów|.\n\nW\
    \ tym wypadku możesz znaleźć czarne karty, które kosztują <sprite=\"ManaSprite\"\
    \ name=\"B\"><sprite=\"ManaSprite\" name=\"B\">, ponieważ możesz zapłacić <sprite=\"\
    ManaSprite\" name=\"B\"><sprite=\"ManaSprite\" name=\"P\"> , aby ją zagrać. Mimo\
    \ wszystko |r:nie znajdziesz| niebieskoczarnej karty, która kosztuje <sprite=\"\
    ManaSprite\" name=\"U\"><sprite=\"ManaSprite\" name=\"B\">, bo w twojej |bazie\
    \ many| nie ma <sprite=\"ManaSprite\" name=\"U\">, nawet jeśli mógłbyś zapłacić\
    \ za nią za pomocą <sprite=\"ManaSprite\" name=\"B\"><sprite=\"ManaSprite\" name=\"\
    P\">.\n\nP.S.\n|Pusta Karta|, jeden ze |Lśniących eksponatów|, pozwoli ci znaleźć\
    \ karty z |p:każdego koloru|.\nKarty o koszcie wyższym niż 5, posiadające powszechny\
    \ komponent kosztu |d:(<sprite=\"ManaSprite\" name=\"1\">, <sprite=\"ManaSprite\"\
    \ name=\"2\"> itd.)| nadal mogą być znalezione, nawet jeśli nie ma wystarczająco\
    \ many w |bazie many|, aby ją zagrać, gdyż istnieją sposoby, aby obniżyć ich cenę."
BossLoot:
  Name: Nagrody od bossów
  Description: "Pokonując bossa, zostajesz nagrodzona trzema różnymi |Lśniącymi eksponatami|\
    \ do wyboru. Te |eksponaty| mają określony schemat:\n|Eksponat| po prawej jest\
    \ zależny od bossa. W pierwszym akcie będzie to |Lśniący eksponat| unikalny dla\
    \ tego bossa, podczas gdy w następnych aktach będzie to neutralny |Lśniący eksponat|\
    \ zgodny z kolorem Bossa. (Przykładowo, Remilia będzie nagradzała czerwonym |eksponatem|.)\n\
    |Eksponat| po lewej jest zależny od twojej bazy many. Ten |eksponat| zawsze będzie\
    \ neutralnym |Lśniącym eksponatem| zapewniającym manę w kolorze w twojej bazie\
    \ many i będzie innego koloru od |eksponatu| po prawej.\n|Eksponat| pośrodku zawsze\
    \ będzie neutralnym |Lśniącym eksponatem| koloru innego od pozostałych |eksponatów|\
    \ i może być |eksponatem|, który nie dodaje żadnej many do bazy many (jak Imponujący\
    \ Obraz Olejny).\n\nJeżeli pula możliwych |eksponatów| zostanie wyczerpana, w\
    \ ich miejsce zaczną pojawiać się losowe |eksponaty| od |pospolitych| do |rzadkich|\
    \ (będzie się to głównie zdarzać po bossie aktu trzeciego dla jej prawego |eksponatu|)."
FriendCard:
  Name: Karty Wspólników
  Description: "Oto kilka dodatkowych zasad dotyczących kart Wspólników, aby wyjaśnić\
    \ szczegóły ich działania.\n1. Wygnanie jest zastąpione Eterycznością.\nGdyby\
    \ jakaś karty miałaby dać karcie Wspólnika Wygnanie, zamiast tego daje jej Eteryczność.\
    \ To samo się tyczy usuwania Wygnania.\nPonieważ karty Wspólników mają być używane\
    \ wiele razy, nadawanie im Wygnania jest bezsensowne.\n2. Gdy karta Wspólnika\
    \ z Eterycznością zostanie zagrana, traci ona Eteryczność.\nGdyby Wspólnik miałby\
    \ zachować Eteryczność po zagraniu, to aktywuje swoją Zdolność Bierną tylko w\
    \ turze, na której została przywołana, co nie jest pożądane.\nWspomina o tym Dusza\
    \ Towarzystwa, ale to się tyczy wszystkich kart Wspólników z Eterycznością, bez\
    \ względu na ich pochodzenie.\n3. Gdy podczas walki na kartę Wspólnika jest używany\
    \ efekt Kopiowania, stan przywołania oraz Wspólność nie przejdą na Kopię. Jedynie\
    \ inne atrybuty są przenoszone.\nKopie kart Wspólników zawsze są tworzone w stanie\
    \ nieprzywołanym oraz z podstawową ilością Wspólnoty.\nDzieje się tak, ponieważ\
    \ przywołani Wspólnicy są jakoś podobni do innych kart i możliwość ich kopiowania\
    \ jest przewagą samą w sobie.\nGdyby skopiowano Wspólnika, który ma zaraz użyć\
    \ Ultimate'a, aby użyć tej zdolności dwa razy, to oznaczałoby konieczność ograniczenia\
    \ siły Ultimate'ów, co byłoby wbrew cechom takich zdolności."
BattleFlow:
  Description: "Na początku każdej walki zainicjowane zostaną karty i wrogowie, po\
    \ czym zaczyna się sekwencja walki.\nW fazie \"początku walki\" większość wrogów\
    \ nałoży swoje początkowe statusy. Dodatkowo wiele innych efektów również zostanie\
    \ zaktywowanych, jak np. eksponat Chodaki Tengu.\nTa faza następuje wcześniej\
    \ niż \"pierwsza tura gracza\", co można zauważyć, gdy Eiki Shiki i ostatni boss\
    \ wykonują kilka akcji podczas tej fazy.\nNastępnie, walka odbędzie się przez\
    \ kilka wiele rund, do czasu aż jedna strona nie wygra.\nKażda runda składa się\
    \ z kilku tur, każda tura odpowiadająca konkretnej postaci (np. tura \"Reimu\"\
    , \"tura Rin Kaenbyou\").\n\nW każdej rundzie gracz ma swoją turę w \"fazie gracza\"\
    \ jako pierwsza, a następnie wrogie postacie mają swoje tury jedna po jednej w\
    \ \"fazie wrogów\".\nZazwyczaj postacie mają jedynie jedną turę, o ile nie mają\
    \ statusu \"dodatkowej tury\".\nPostacie z dodatkową turą nie przekazują tury\
    \ po zakończeniu swojej, zamiast tego zaczynają kolejną turę.\nTen efekt się powtarza\
    \ do momentu wyczerpania zapasu dodatkowych tur.\nGdy wszystkie postacie zakończą\
    \ swoje akcje, runda się zakończy i rozpocznie się kolejna.\n\nAktualnie jedynie\
    \ gracz może mieć dodatkowe tury, z wyjątkiem Skweru Inflacji.\nW tym wypadku\
    \ każdy wróg będzie wykonywał dwie akcje jedna po drugiej (pokazany zostanie jedynie\
    \ pierwszy zamiar).\nKażda strona ma swój licznik tur, który wskazuje, ile tur\
    \ rozegrała dana strona.\nZazwyczaj wrogom będzie ona równa liczbie rund, podczas\
    \ gdy gracz może mieć wyższą, dzięki dostępności do mechaniki dodatkowych tur.\n\
    \nTekst niektórych efektów odwołuje się do tur, gdy dokładniej można by je określić\
    \ rundach. Dla świeżych graczy odróżnienie rundy od tury od rundy jest trudne.\n\
    Na przykład, efekty Wrażliwości, Bezsilności i Kruchości redukują jedynie na końcu\
    \ rundy, ale też na początku dodatkowych tur (to jedynie poprzez tak skomplikowaną\
    \ demonstrację doświadczenie gracza będzie takie, jako powinno.).\n"
  Name: Sekwencja walki i tury
PlayCard:
  Description: "Aktualizacja Koishi wprowadziła mechanikę gry Kartami Reakcji. Działają\
    \ one zgodnie z poniższymi zasadami.\n\n1. Normalne zagrywanie karty oraz aktywacja\
    \ Karty Reakcji to dwie różne akcje, podobnie do naturalnych tur i dodatkowych\
    \ tur. Z reguły, Karta Reakcji będzie się zachowywała podobnie do normalnej zagranej\
    \ karty. \n2. Karty Reakcji nie aktywują efektów, które zwyczajowo są wrażliwe\
    \ na normalne zagranie karty, takich jak limit kart wrogiej Remilii, liczniki\
    \ kart \"Koniec Nieprzemijającej Nocy\", \"Pijaństwo\", \"Zachwycający Letni Lód\"\
    \ oraz liczników eksponatów takich jak \"Srebny Kieszonkowy Zegarek\". \n3. Aktywowane\
    \ Karty Reakcji będą brały za cel tego samego wroga, co wcześniej zagrana normalna\
    \ karta. Jeśli cel jest nieprawidłowy, losowy wróg zostanie wybrany. Dotyczy to\
    \ głównie kart ataku. \n4. Karty Reakcji nie zużywają many. Jednakże, jeśli istnieją\
    \ dodatkowe efekty, które normalnie zapobiegłyby zagranie karty, aktywacja nie\
    \ powiedzie się i karta zostanie umieszczona w stosie odrzuconych. (Efekty takie\
    \ jak Niegrywalna, niewystarczająca ilość złota itp.) \n5. Jeśli Karta Reakcji\
    \ ma efekt, który ma wstępne wymagania jak na karcie \"Fabrykacja Wiadomości\"\
    , ten efekt mógłby być anulowany, jeśli karta zostałaby zagrana normalnie, ale\
    \ w przypadku gry jest ona zagrana jako Karta Reakcji, anulowanie jest niemożliwe.\
    \ \n6. Karty Reakcji zawsze zostaną przerwane przez koniec walki, nawet jeśli\
    \ karta, która byłaby zagrana, miałaby efekty uleczenia zdrowia lub podobne. \n\
    7. Interakcja z kartami o koszcie X: Zagrane Karty Reakcji uznawane są za zagrane\
    \ z kosztem 0."
  Name: Używanie Kart Reakcji
PlayTwice:
  Name: Granie kat dwukrotnie
  Description: "Specjalnym przypadkiem Karty Reakcji jest \"zagranie dwukrotne\" zawarte\
    \ w efektach karty. Działania ono na poniższych zasadach.\n\n1. Ten efekt jest\
    \ aplikowany tylko do normalnych zagrań, co znaczy, że jeśli ta karta jest zagrana\
    \ jako Karta Reakcji, nie zostanie ona zagrana dwukrotnie.\n2. W szczególności:\
    \ Kiedy wykonywane jest normalne zagranie karty, która zostanie zagrana drugi\
    \ raz, jej zdjęcie jest wykonywane przed zagraniem. Po rozpatrzeniu wszystkich\
    \ efektów pierwszego zagrania zdjęcie zostanie zagrane i następnie usunięte z\
    \ walki.\n3. Zdjęcie jest czymś innym od normalnych Kopii kart. Zasady, który\
    \ odnosiłyby się do Kopii, nie są brane pod uwagę przy zdjęciach.\nPozytywy dla\
    \ gracza: Gracz może użyć Ultimate'a wspólnika dwukrotnie, użyć karty Narzędzia\
    \ dwukrotnie przy wykorzystaniu tylko jednego Limitu, oraz może użyć \"Pożerania\
    \ Historii\" dwukrotnie.\nNegatywy dla gracza: Kopia wspólnika nie może zostać\
    \ otrzymana w trakcie przywoływania wspólnika oraz Przyrost na kartach nie może\
    \ zostać aktywowany dwukrotnie.\nPowodem, dla którego jest to rozwiązane inaczej\
    \ niż w \"Slay the Spire\" są Wspólnicy. Nie chciałbyś przywołać \"Daiyousei,\
    \ Żwawej Asystentki\", tylko po to, by natychmiast użyć jej Czynną Zdolność.\n\
    4. Gracz nie może otrzymać zdjęcia. Dla przykładu, gry karta z Echo zostanie zagrana\
    \ dwukrotnie, zdjęcie nie wygeneruje kopii.\n5. Interakcja z dodatkowymi turami:\
    \ Zdjęcia \"Spaceru w Czasie\" nie będą miały efektu, a większość innych kart\
    \ z dodatkowymi turami, będzie generować dwie dodatkowe tury i zakończą jedynie\
    \ aktualną turę. (Jeszcze nie zdecydowano, czy jest to zbyt potężne)\n6. Interakcja\
    \ z kartami o koszcie X: Zdjęcia dziedziczą zapłacony koszt oryginalnie zagranej\
    \ karty i nastąpią dwie pełne aktywacje."
