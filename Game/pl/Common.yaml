  DontShow: Bez samouczków
  Prev: Cofnij
  Next: Dalej
  Intro: "Witaj na Wystawie Stolicy Księżycowej! Postaraj się znaleźć zaginioną Gałąź\
    \ Mitów!\nJeżeli już grałeś w jakiegokolwiek innego deckbuildera, możesz wybrać\
    \ |szybkie samouczki|, aby otrzymywać wskazówki tylko do elementów unikalnych\
    \ dla tej gry.\nNastępne samouczki będą się trzymały tej preferencji. Możesz dostosować\
    \ samouczki w każdej chwili w ustawieniach."
  BasicBattle: "Użyj kart w swojej ręce aby pokonać wrogów.\nZagrane karty trafiają\
    \ do stosu odrzuconych. Na końcu twojej tury, karty pozostałe w twojej ręce również\
    \ trafiają do stosu odrzuconych.\nNowe karty zostaną dobrane na początku twojej\
    \ tury."
  ManaPanel: "Tabliczka many pokazuje ile many pozostało ci w zapasie.\nWybierz dowolną\
    \ manę, aby przenieść ją do strefy oczekującej. Mana w strefie oczekującej ma\
    \ pierwszeństwo przy zagrywaniu kart.\n{Gamepad:select true='Naciśnij X' false='Kliknij\
    \ prawym przyciskiem myszy'}, aby przenieść całą manę danego koloru do strefy\
    \ oczekującej.\nMana jest przywracana na początku każdej tury."
  BlockShield: "Zanim otrzymasz obrażenia, zagraj kartę obrony, aby zyskać |Blok|\
    \ i |s:Barierę|.\n|Blok| i |s:Bariera| redukują ilość obrażeń, które zostaną tobie\
    \ zadane.\n|Blok| znika na początku tury, a niewykorzystana |s:Bariera| zachowuje\
    \ się między turami."
  Intention: "Nad wrogami wyświetlone są ich intencje.\nWrogowie mogą mieć takie intencje\
    \ jak atak, obrona, nakładanie wzmocnień i osłabień, czy też rzucanie Kart Zaklęć."
  UltimateSkill: "Użyj Karty Zaklęć, aby odwrócić bieg walk!.\nUżycie Karty Zaklęć\
    \ wykorzystuje pełny pasek energii. Pokonani przeciwnicy zostawiają po sobie <sprite=\"\
    Point\" name=\"Power\">, które uzupełniają energię potrzebną na Kartę Zaklęć.\n\
    Karty Zaklęć można użyć tylko raz na turę."
  Mana: "{Gamepad:select true='Naciśnij X' false='Kliknij prawym przyciskiem myszy'}\
    \ na karcie, aby wyświetlić szczegóły. Możesz tak robić w większości miejsc, gdzie\
    \ znajdują się karty.\nZagranie karty wymaga wydania many. Koszt karty znajduje\
    \ się w jej prawym górnym rogu.\nJest 7 rodzajów bazowej many: mana monochromatyczna\
    \ <sprite=\"ManaSprite\" name=\"W\"><sprite=\"ManaSprite\" name=\"U\"><sprite=\"\
    ManaSprite\" name=\"B\"><sprite=\"ManaSprite\" name=\"R\"><sprite=\"ManaSprite\"\
    \ name=\"G\">, mana bez koloru <sprite=\"ManaSprite\" name=\"C\"> oraz <sprite=\"\
    ManaSprite\" name=\"P\">, która może zastąpić każdą inną manę.\nOgólny koszt taki\
    \ jak <sprite=\"ManaSprite\" name=\"2\"> można zapłacić wykorzystując dwa dowolne\
    \ rodzaje many."
