line:0cd13d8: HasSeenBag
line:0ddbdec: '[To] Zyskaj eksponat: |{0}|.'
line:0ca5d45: '[Niedostępne] Wszystkie możliwe eksponaty zostały już zebrane.'
line:0a82591: '[Tamto] Zyskaj eksponat: |{0}|.'
line:032ca60: '"Dziękujemy ci za twoją ciężką pracę. Pani Eirin kazała przekazać ci
  więcej eksponatów."'
line:041b730: "\"Hahaha.\"\n(Jak myślisz, czemu tu jesteś?)"
line:0c3ba74: "\"No cóż... Jest kilka spraw, które muszę wyjaśnić po mojej stronie.\"\
  \n(Kto mi zapłaci za nadgodziny?!)"
line:0494427: "\"Mam kilka ważniejszych spraw do załatwienia.\"\n(Jak czyszczenie\
  \ HappyConów księżniczki...)"
line:0191c2b: "\"Haha, ostatnio mam już dużo na głowie.\"\n(Dlaczego kierowniczka\
  \ średniego szczebla Eientei musi też pracować jako woźna?)"
line:0572e10: "\"Dokładnie. Jakież to szczęście, że panna {0} jest tutaj.\"\n(Ufff...\
  \ Może uda nam się zmniejszyć część wydatków za ten kwartał.)"
line:0b31f0d: "\"Haha, Eientei byłoby zachwycone, gdybyś stała się częścią zespołu,\
  \ {0:v}.\"\n(Wyślę ci ofertę, jak tylko znajdziesz zagubioną Gałąź!)"
line:0b66fe1: "\"Klasyczna {0}, zawsze profesjonalna!\"\n(Mam nadzieję, że mam jeszcze\
  \ czas na obejrzenie 'Alicji w Szanghaju'!)"
line:09e131e: '{0}'
line:01ad76b: '{0}'
line:0671234: '[To i tamto] Zyskaj eksponaty: |{0}|, |{1}|.'
line:0e1d069: '[Odejdź] Nic się nie dzieje.'
line:0805794: '{0}'
line:0e03646: '{0}'
line:06ab5aa: '[Niedostępne] Wszystkie możliwe eksponaty zostały już zebrane.'
line:072efd0: "\"Ah, twoja torebka pozwala ci zachować jeszcze jeden eksponat.\"\n\
  (Świetnie. Nie będę musiała wszędzie targać tych eksponatów.)"
line:0b92ee1: "\"Spokojnie, wysłałam już króliki, żeby się tym zajęły\"\n(Brednie.\
  \ Wszystkie są na wakacjach i nie odbierają moich telefonów.)"
line:05fd0a6: "\"Jesteś taka niezawodna, {0:v}.\"\n(Brak wynagrodzenia i pokrycia\
  \ kosztów transportu. Jaka dobra pracownica.)"
line:04cdec6: "\"Jesteś naprawdę skuteczna, panno {0:v}.\"\n(Mogę wykorzystać niedostarczone\
  \ eksponaty, by wyrównać rachunek za 'Circle Fit', co ostatnio księżniczka kupiła.)"
line:006b66b: '"Wielkie dzięki. A dlaczego sama nie ścigasz sprawcy?"'
line:006b66b.Reimu:
line:006b66b.Marisa: '"Świetnie, więcej eksponatów! Nie powinnaś być w sumie silniejsza,
  skoro masz ze sobą tyle przedmiotów?"'
line:006b66b.Sakuya: '"Dziękuję, panno Reisen. Czy nie chciałabyś może przyłączyć
  się do pościgu za sprawcą?"'
line:006b66b.Cirno: '"Dziękuję! Jesteś bardzo miłą osobą!"'
line:006b66b.Koishi: '"Dziękuję. Będę z tym bardzo ostrożna."'
line:005e158: '"Nie trzeba, to dla mnie drobiazg."'
line:005e158.Reimu:
line:005e158.Marisa: '"Nie, dzięki. Mam już dostatecznie dużo, nawet nie licząc tego."'
line:005e158.Sakuya: '"Podziękuję. Mam już wystarczająco."'
line:005e158.Cirno: '"W ogóle nie potrzebuję tych rzeczy!"'
line:005e158.Koishi: '"Nie..."'
