line:0557dad: '[Weź go] Zyskaj losowy eksponat.'
line:0dc3dde: Ze strony Lasu Bambusowego dociera podejrzany dźwięk…
line:0c4a8da: '[Zignoruj] Nic się nie dzieje.'
line:0bbc877: '[Oddaj eksponat] Strać eksponat: |{0}|.'
line:0eb1ea2: '[Niedostępne] Brakuje eksponatów.'
line:0724a11: '[Oddaj inny eksponat] Strać eksponat: |{0}|.'
line:0f2d695: '[Niedostępne] Brakuje eksponatów.'
line:0f9fdb8: '{0}'
line:094a004: '"Jak możesz być taka bezinteresowna?! Twoja dobroczynność napawa mnie
  zazdrością!"'
line:0d7d127: '{0}'
line:0d0c814: '"Oddasz mi |{0}|? Dobrze, uznaję, że ci wybaczam."'
line:0d2e77f: '"Ufff, dobrze. Czy zawsze tak zieleniejesz z zazdrości?"'
line:0d2e77f.Reimu:
line:0d2e77f.Marisa: '"Jesteśmy w porządku? Ruszam dalej."'
line:0d2e77f.Sakuya: '"Niesamowite, jaka jesteś drażliwa."'
line:0d2e77f.Cirno: '"Z racji tego, jaka jestem silna, to jasne, że to powinno mi
  się wybaczać."'
line:0d2e77f.Koishi: '"Czasami jest miło nie myśleć o czymkolwiek."'
line:0b15c0b: '"Znalezione, niekradzione!"'
line:0b15c0b.Reimu:
line:0b15c0b.Marisa: '"Jaka szkoda. To już jest częścią mojej kolekcji."'
line:0b15c0b.Sakuya: '"Byłaś o ułamek sekundy zbyt wolna. Jestem pewna swojej szybkości."'
line:0b15c0b.Cirno: '"To moje! Nie ma opcji, bym ci to dała!"'
line:0b15c0b.Koishi: '"Nie ma mowy... Dlaczego nie spróbujesz wyłowić innego skarbu?"'
line:092a6ef: '"Twoja bezwstydność napawa mnie zazdrością... Poczekaj tylko co cię
  spotka w środku nocy!"'
line:0340a4c: '{0} natknęła się na eksponat pływający w wodzie. Wyłowić go?'
line:0b63278: '"Dlaczego mam wrażenie, że ktoś mnie obserwuje?"'
line:00e3d78: '"Dlaczego wszystkim innym tak łatwo przychodzi znajdowanie eksponatów?
  Jestem z tego powodu strasznie zazdrosna."'
line:028b07c: '"Nałożę na ciebie klątwę! Przez cały wieczór będziesz odnajdywać tylko
  najgorsze eksponaty!"'
line:0eea103: '"Poczekaj chwilę, dam ci coś czego już nie potrzebuję. Mogę ci oddać
  |{0}|."'
line:0eea103.Reimu:
line:0eea103.Marisa: '"Oh, chciałabyś |{0}|? Możesz brać."'
line:0eea103.Sakuya: '"Proszę chwilę poczekać. Mam przy sobie dodatkowo |{0}|. Możesz
  to wziąć, jeśli potrzebujesz."'
line:0eea103.Cirno: '"Co? Chcesz |{0}|? Jestem w dobrym nastroju, więc mogę ci to
  dać."'
line:0eea103.Koishi: '"Hmm... W sumie nie zależało mi na tym. Proszę, możesz to wziąć."'
line:03c49f5: '[Nie oddawaj niczego] Zyskaj kartę Nieszczęścia: |{0}|.'
