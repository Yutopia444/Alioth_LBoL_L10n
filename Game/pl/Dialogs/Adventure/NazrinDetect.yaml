line:0f6474a: '{0}'
line:0b435bf: '[Wynajmij] Zapłać {0} <sprite="Point" name="Gold">, aby zyskać losową
  nagrodę.'
line:02f3a36: '[Niedostępne] Brakuje <sprite="Point" name="Gold">.'
line:0279574: '{0}'
line:0bf5da1: O nie, Nazrin aktywowała magiczną pułapkę! Zyskaj losową kartę Nieszczęścia.
line:04d438a: Nazrin znalazła zagubiony skarb z wystawy! Zyskaj losowy eksponat.
line:06048b9: Jak to? Narzin nie udało się niczego znaleźć!
line:0eece72: '{0} czuje, że jej umiejętności stają się coraz lepsze.'
line:0e8e6c2: Nazrin odnalazła młot kuźniczy wróżki! Ulepsz kartę.
line:0c19fa5: '{0} czuje się uwolniona od stresu…'
line:0766cf1: Nazrin wykopała zakurzone kadzidło! Usuń kartę.
line:0c1ff9c: '"Nie, dzięki. Możesz zatrzymać odnalezione skarby dla siebie."'
line:03f4300: '[Odejdź]'
line:02cdbff: '"Moje różdżki mogą odkryć niesamowite skarby!"'
line:062ca0e: '"Jesteś zainteresowana, {0:v}? Za drobną opłatą skarb może być twój..."'
line:0aa76a7: Nazrin znalazła antyczne monety! Zyskaj {0} <sprite="Point" name="Gold">.
line:0bc8048: Nazrin dokopała się do gorącego źródła! Ulecz wszystkie obrażenia.
line:03c7b6c: '[Odmów] Nic się nie dzieje.'
