line:0e688d4: '"Jesteś szczera w swoim pościgu za pragnieniami, co? W tym wypadku,
  oto twoje honorarium za udzielenie wywiadu."'
line:02a8586: Zaczęły krążyć plotki, że {0} chciała odnaleźć sekretny skarb Kaguyi
  i sprzedać go dla zysku.
line:0db4c31: '"{0} ujawniła w wywiadzie swoją głęboką więź z panną Kaguyą, działając
  na wyobraźnię czytelników..."'
line:08250c8: '"Z moją autorską technologią Natychmiastowej Platformy Reporterskiej,
  w końcu będę o krok przed Ayą!"'
line:0fed9a3: '"Panno {0:v}! Czy mogłabym poprosić o wywiad?"'
line:0ffc3c5: '[Zgoda] Odpowiedz na pytanie.'
line:0f1ab7b: '"Dlaczego postanowiłaś zaangażować się w rozwiązywanie tego incydentu,
  panno {0:v}?"'
line:0c26759: '[Dla Gensokyo] Zyskaj |{0}|.'
line:093187e: '"...Cel pełny szlachetności! Na pewno wszyscy o tym usłyszą!"'
line:0e860d0: Wieść o dobrym uczynku {0:g} rozprzestrzeniła się po Gensokyo, po tym
  jak Hatate dodała kilka "detali".
line:01f1aca: '[Dla pieniędzy] Zyskaj |{0}| i {1} <sprite="Point" name="Gold">.'
line:018ba4d: '[Nie wiem] Zyskaj |{0:a}| i kartę nieszczęścia: |{1}|.'
line:02ca266: '"Impulsywna eksterminacja tak wielu niewinnych osób. Klasyczna {0}."'
line:062320e: '"Powód... Dlaczego to ja właściwie wyszłam dzisiaj z domu?"'
line:062320e.Reimu: '"Takie właśnie jest życie kapłanek."'
line:062320e.Marisa:
line:062320e.Sakuya: (Nie wydaje mi się, że spełnienie zachcianki panny Remilii na
  |Kombinezon Kosmiczny| wymagało jakiegoś szczególnego powodu.)
line:062320e.Cirno:
line:062320e.Koishi:
line:0680a62: '[Dla Kaguyi] Zyskaj |{0}| i ulecz {1:plural one=''% punkt'' few=''%
  punkty'' many=''% punktów''} życia.'
line:08f2904: '{0} czuje ciepło we swojej piersi.'
line:0b1bfc1: '[Odmów] Nic się nie dzieje.'
line:070965c: '"Spasuję. Nikt nie bierze reportaży Tengu na poważnie."'
line:070965c.Reimu:
line:070965c.Marisa: '"Nie, wolałabym żeby moje imię nie było znane w |Internecie|."'
line:070965c.Sakuya: '"Przepraszam, ale mam jeszcze dużo obowiązków do wypełnienia".'
line:070965c.Cirno:
line:070965c.Koishi: '"Musisz wiedzieć, że gdy zrobisz ze mną zdjęcie, to nic na nim
  nie będzie."'
line:0fe3a32: '"Gdybyś miała telefon, to miałabyś inne zdanie!"'
line:0fe3a32.Reimu:
line:0fe3a32.Marisa: '"Przecież wiesz, że bycie sławnym jest lepsze od alternatywy!"'
line:0fe3a32.Sakuya: '"Czy tak zachowują się kobiety w miejscach pracy?"'
line:0fe3a32.Cirno:
line:0fe3a32.Koishi: '"Jeżeli zamknęłaś swoje serce, to nie oznacza, że ignorujesz
  prawa fizyki, prawda...?"'
