line:035fe0b: '[Bierz moje pieniądze] Zapłać {0} <sprite="Point" name="Gold">. Zyskaj
  kartę: |{1}|.'
line:0af9f64: '[Niedostępne] Brakuje <sprite="Point" name="Gold">.'
line:0f92fba: '{0}'
line:0b88a7e: '"Jakie miłe doświadczenie zakupowe... Kiedy jest wasza następna wyprzedaż?!"'
line:0b88a7e.Reimu: '"Jaki rzadki wybór towarów! Kiedy nowy asortyment?"'
line:0b88a7e.Marisa:
line:0b88a7e.Sakuya: '"Wybór jest tutaj inny niż ten, z jakim się zazwyczaj spotykam.
  Kiedy uzupełniacie asortyment?"'
line:0b88a7e.Cirno: '"Najbardziej lubię te zimne! Kiedy następna dostawa?"'
line:0b88a7e.Koishi: '"Następnym razem przyjdę z siostrą. Kiedy jest następna dostawa?"'
line:053b6d2: '"A skoro incydent przyniósł nam długą noc, wyprzedaż będzie trwała
  codziennie!"'
line:03a90b9: '[Odmów zakupu] Zapłać {0} <sprite="Point" name="Gold"> lub zyskaj kartę
  Nieszczęścia: |{1}|.'
line:09653e9: '"Czy to dobry pomysł, aby karać osobę tak spłukaną jak ona? Mimo wszystko,
  nie jest to zły pomysł."'
line:027fc29: '[Oszczędźcie mnie] Zapłać {0} <sprite="Point" name="Gold">.'
line:0f29356: '"Mam pieniądze! Uspokójcie się!"'
line:0f29356.Reimu: '"Poczekajcie! Czy jest coś, co mogłabym zrobić...?"'
line:0f29356.Marisa:
line:0f29356.Sakuya: '"Weźcie je i przestańcie mnie dręczyć. Poproszę również fakturę."'
line:0f29356.Cirno: '"Dobra weźcie je. Nie jestem chciwa jak ludzie."'
line:0f29356.Koishi: '"Aha, chcecie pieniądze? Jesteście nie do podrobienia."'
line:0989e20: '"No i teraz możemy się dogadać!"'
line:0ddd9ed: '"Proszę bardzo!"'
line:08ee578: '[Jestem spłukana] Zyskaj kartę Nieszczęścia: |{0}|.'
line:039060c: '"Odczepcie się ode mnieee!"'
line:039060c.Reimu: '"Chcecie zrobić ze mnie jeszcze większego biedaka, niż jestem
  teraz!?"'
line:039060c.Marisa:
line:039060c.Sakuya: '"Wygląda na to, że będę musiała zasmakować tego jak jest się
  biednym."'
line:039060c.Cirno: '"Ale moje pieniądze zamarzły..."'
line:039060c.Koishi: '"Atmosfera jest tutaj dość ponura..."'
line:08c6cbc: "\"Hej, czy to nie jest {0}? Byłabyś chętna na mały makeover dzięki\
  \ wyprzedaży biżuterii second-hand u Sióstr Yorigami?\""
line:0e93370: '"Normalna cena to 100 <sprite="Point" name="Gold">, ale oferujemy specjalną
  zniżkę |g:{0}%| na pierwszy zakup!"'
line:083ab19: "\"'Wyprzedaż biżuterii second-hand u Sióstr Yorigami odbywa się tylko\
  \ w nocy.\""
line:096777f: '"Chcesz utrudniać nam pracę? Hej, Shion, czy mogłabyś ją opętać?"'
