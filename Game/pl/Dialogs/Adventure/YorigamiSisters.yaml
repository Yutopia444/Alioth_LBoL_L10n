line:035fe0b: '[Bierz Moje Pieniądze] Zapłać {0} <sprite="Point" name="Gold"> i zyskaj:
  |{1}|.'
line:0af9f64: '[Niedostępne] Brakuje <sprite="Point" name="Gold">.'
line:0f92fba: '{0}'
line:0b88a7e: '"Jakie satysfakcjonujące... kiedy jest wasza następna wyprzedaż?"'
line:0b88a7e.Reimu:
line:0b88a7e.Marisa:
line:0b88a7e.Sakuya:
line:0b88a7e.Cirno: '"Najbardziej lubię te zimne~ Kiedy następna dostawa?"'
line:0b88a7e.Koishi:
line:053b6d2: '"A incydent przyniósł nam długą noc, a więc wyprzedaż będzie odbywać
  się codziennie!"'
line:03a90b9: '[Odmów Zakupu] Zapłać {0} <sprite="Point" name="Gold"> lub zyskaj kartę
  Nieszczęścia: |{1}|.'
line:09653e9: '"Czy jest to w ogóle dobry pomysł, aby ukarać kogoś tak spłukaną jak
  ona? Nie to, że jest to coś złego."'
line:027fc29: '[Zlitujcie się] Zapłać {0} <sprite="Point" name="Gold">.'
line:0f29356: '"Mam pieniądze! Uspokójcie się!"'
line:0f29356.Reimu: '"Przestańcie! Czy nie ma czegoś, co bym mogła zrobić..."'
line:0f29356.Marisa:
line:0f29356.Sakuya: '"Weźcie je i przestańcie mnie dręczyć. Poproszę też do tego fakturę."'
line:0f29356.Cirno: '"Weź je, weź je, trochę papierków za te błyszczące."'
line:0f29356.Koishi:
line:0989e20: '"No i proszę~"'
line:0ddd9ed: '"Masz~"'
line:08ee578: '[Jestem Spłukana] Zyskaj kartę Nieszczęścia: |{0}|.'
line:039060c: '"A kysz a kysz!"'
line:039060c.Reimu:
line:039060c.Marisa:
line:039060c.Sakuya: '"Może i spróbuję zasmakowania jak to jest być biednym na jakiś czas..."'
line:039060c.Cirno: '"Pieniądze mi się zamroziły..."'
line:039060c.Koishi:
line:08c6cbc: "\"No hej, czyż to nie {0}? Czy chciałabyś mieć makeover z 'Zakładu\
  \ Jubilerskiego z Drugiej Ręki Sióstr Yorigami'?\""
line:0e93370: '"Zwykle kosztują 100 <sprite="Point" name="Gold">, ale oferujemy specjalną
  zniżkę |g:{0}%| na pierwszy zakup~"'
line:083ab19: "\"'Wyprzedaż Zakładu Jubilerskiego z Drugiej Ręki Sióstr Yorigami'\
  \ odbywa się tylko w nocy.\""
line:096777f: '"A więc chcesz sobie utrudnić sprawy... hej, siostro, czy nie mogłabyś
  ją opętać coś?"'
