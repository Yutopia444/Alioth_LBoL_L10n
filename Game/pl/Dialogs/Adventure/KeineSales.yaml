line:01bf833: Bezimienna Obecność
line:09a7a08: '"Witamy serdecznie w programie telewizyjnym ''Kto chce zostać magnatem
  elektryki''! Przywitajmy naszą pierwszą zawodniczkę — {0:g}!"'
line:0032bb0: '[Pytanie z matematyki] Odpowiedz poprawnie aby wygrać eksponat: |{0}|.'
line:008a879: '[Pytanie z historii] Odpowiedz poprawnie aby wygrać eksponat: |{0}|.'
line:05bdc79: '[Pytanie z inżynierii] Odpowiedz poprawnie aby wygrać eksponat: |{0}|.'
line:07b190b: '[Odpowiedz] Zapłać {0} <sprite="Point" name="Gold"> i wybierz kategorię
  pytania.'
line:0879803: '[Niedostępne] Brakuje <sprite="Point" name="Gold">.'
line:00066ed: '{0}'
line:0537088: '"Jeżeli nagroda jest tego warta... Mam trochę wolnego czasu."'
line:0537088.Reimu:
line:0537088.Marisa:
line:0537088.Sakuya: '"Z przyjemnością. Właśnie się zastanawiałam nad zakupem nowych
  urządzeń dla posiadłości."'
line:0537088.Cirno:
line:0537088.Koishi:
line:06dcb37: '"Nie możemy się doczekać twojego występu! Proszę odpowiedzieć na następujące
  pytanie:"'
line:0ee3db9: '[Odejdź] Strać {0} <sprite="Point" name="Power">.'
line:053ed42: '"Mówisz mi, że pokojówki Rezydencji Szkarłatnego Diabła mogą odtwarzać
  seriale telewizyjne i generować chłodne powietrze?!"'
line:0e14f32: '"W sumie masz rację..."'
line:084baf0: '{0}'
line:0beded5: '{0}'
line:0cb0bc9: '{0}'
line:010e2fe: '"Suma liczby |{0}| oraz której z podanych liczb jest liczbą pierwszą?"'
line:087ece2: '1'
line:09e15fb: '2'
line:03332fc: '3'
line:06203d1: '4'
line:0ca7a30: '"|{0}|, którą spotkałaś, jest również znana w Gensokyo jako...?"'
line:0d56d39: '{0}'
line:07e2b95: '{0}'
line:013f97a: '{0}'
line:09fb8b4: '"|{0}| to urządzenie, które wymaga jakiego komponentu do prawidłowej
  pracy?"'
line:0ea4d5d: Pulsatora bębna
line:00336cb: Układu strojeniowego
line:0b5bbe0: '"Przedstawię teraz ciekawostkę dotyczącą tych urządzeń!"'
line:0d8ff1f: '"Odpowiedź nieprawidłowa! Zdolności matematyczne {0:g} są na poziomie
  wróżek..."'
line:07b6632: '"Zgadza się! Masz dobrą pamięć! Oto nagroda: |{0}|."'
line:011047b: '"Przedstawię teraz ciekawostkę dotyczącą tych urządzeń!"'
line:0b5abbd: '"Zgadza się! Oto nagroda: |{0}|."'
line:0b18392: "\"Odpowiedź nieprawidłowa! Zdaje się, że {0} nie zna się na 'Trzech\
  \ domowych skarbach współczesnego świata'.\""
line:07c2a4e: '"Badania wykazały, że potężny, zwrócony ku górze wir generowany przez
  |pulsatory bębna| w |pralkach| może zostać użyty w pojedynkach na karty zaklęć."'
line:0e7188a: Zaworu rozprężnego
line:0fcfabf: '"Słucham? Tylko że ja nie widzę tutaj nikogo innego?"'
line:0fcfabf.Reimu:
line:0fcfabf.Marisa: '"Co się tutaj dzieje? Czemu tak nagle?"'
line:0fcfabf.Sakuya:
line:0fcfabf.Cirno: '"Program... telewizyjny? A co to jest?"'
line:0fcfabf.Koishi: '"Oh! Czy ktoś inny do nas dołączy?"'
line:0285d02: "\"Proszę się nie martwić! Wystarczy drobna darowizna na rzecz szkółki\
  \ świątynnej Hiedy, aby mieć szansę zdobycia jednego z 'Trzech domowych skarbów\
  \ współczesnego świata'!\""
line:0c57268: '"Nie możemy się doczekać twojego występu! Proszę wybrać kategorię pytania:"'
line:0b38a73: '"To dość dużo pieniędzy... Przecież do szkółki świątynnej Hiedy nie
  chodzi aż tyle osób, racja?"'
line:0b38a73.Reimu:
line:0b38a73.Marisa:
line:0b38a73.Sakuya: '"Jakby się nad tym zastanowić, to pokojówka bez problemu może
  zastąpić wszystkie te urządzenia."'
line:0b38a73.Cirno:
line:0b38a73.Koishi:
line:0045670: '"Czy chcesz w przyszłości walczyć z bezmyślnymi youkai, ponieważ nie
  chciałaś wspierać wartości edukacyjnych?"'
line:04402be: '"Nieprawidłowa odpowiedź! To nie zgadza się z moimi obserwacjami! Najwyraźniej
  {0} jest dostatecznie uważna."'
line:020eade: '"|Telewizory| dzięki |układowi strojeniowemu|, pozwalają ludziom na
  odbieranie obrazów z miejsc oddalonych o tysiące kilometrów. Czego ja bym nie zrobiła,
  by szkoła mogłaby uczyć zdalnie."'
line:0f6d5c4: '"Prawidłowo! Zdolności matematyczne {0:g} są na poziomie szkoły podstawowej
  świątyni Hiedy! Oto nagroda: |{1}|."'
line:0c96111: '"|Zawór rozprężny| w |lodówkach| reguluje przepływ substancji chłodzące.
  Jedna z moich uczennic jest bardzo dobra w generowaniu zimna, więc nie potrzebuję
  takiej ekstrawagancji."'
