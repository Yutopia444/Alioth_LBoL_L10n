line:0891a52: '[Użyj tunelu] Natychmiast rozpocznij walkę z bossem. Zyskaj |Graniczny
  Wykrywacz|.'
line:098d18c: '{0} wchodzi do Świata Snów i po krótkiej chwili odnajduje wyjście.'
line:0e60178: '[Kontynuuj]'
line:0298994: '[Odejdź] Nic się nie dzieje.'
line:01a3b93: '{0} uważa, że rzetelniejsze będzie jej własne śledztwo.'
line:01a3b93.Reimu: '{0} liczy, że uda się jej jeszcze znaleźć trochę więcej pieniędzy.'
line:01a3b93.Marisa: '{0:d} wydaje się, że nadal nie ma przy sobie dostatecznej liczby
  eksponatów.'
line:01a3b93.Sakuya: '{0} myśli, że pośpiech jest niebezpieczny.'
line:01a3b93.Cirno:
line:01a3b93.Koishi:
line:0d4ca3c: '"Hey, byłam świadkiem kradzieży na wystawie i wiem kto jest sprawcą."'
line:0af435d: '"Jeśli chcesz ją szybko znaleźć, przygotowałam dla ciebie skrót."'
line:0f1da28: '[Szukaj skarbów] Zyskaj losowy eksponat i {0} <sprite="Point" name="Gold">.
  Zyskaj kartę nieszczęścia: |Halucynacje|.'
line:0dc28a0: '"Jeżeli walka i eksploracja Świata Snów tak ci się podoba, to {Censor:select
  false=\"daj szansę ''Dreamland of Infinity''\" true=\"spróbuj spać w godzinach pracy
  \" }!"'
line:05751d7: '"Ah i nie zapomnij wziąć tego ze sobą."'
line:0ecb56e: '{0} wchodzi do portalu, ale po chwili zatraca się w poszukiwaniu skarbów
  oraz walce z mieszkańcami Świata Snów.'
line:029fd89: '[Kontynuuj]'
line:0121d21: '"Udało mi się wrócić do rzeczywistości?"'
