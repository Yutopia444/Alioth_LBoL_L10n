line:098d18c: '{0} wchodzi do Świata Snów i po krótkiej chwili odnajduje wyjście.'
line:0e60178: '[Kontynuuj]'
line:0298994: '[Odejdź] Nic się nie dzieje.'
line:01a3b93: '{0} uważa, że jej własne śledztwo będzie rzetelniejsze.'
line:01a3b93.Reimu: '{0} liczy, że uda się jej jeszcze zdobyć trochę więcej pieniędzy.'
