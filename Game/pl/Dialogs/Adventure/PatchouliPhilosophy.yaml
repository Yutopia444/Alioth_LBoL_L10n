line:03b4cbd: Zdaje się, że Patchouli właśnie bada te magiczne klejnoty.
line:06ad387: '"Aha, już rozumiem..."'
line:07acb35: Wybierz jedną monochromatyczną manę w bazie i zamień ją w manę filozoficzną.
line:01cdad3: '[Zgódź się] {0}'
line:013e396: '"A więc, którego klejnotu many chciałabyś użyć?"'
line:0e78dc7: '"Wielkie dzięki. Chcesz, bym kupiła ci herbatę w drodze powrotnej?"'
line:0725f8e: '"Herbata Earl Grey byłaby odpowiednia. Proszę i dziękuję."'
line:04eeb1a: '[Odmów] Nic się nie dzieje.'
line:044f4bc: '"Pomyśleć, że tyle się nacierpiałam, żeby się tutaj pojawić..."'
line:04b1f03: '"Nie trzeba, czuję się dostatecznie dobrze."'
line:0b23fed: "\"Co za zbieg okoliczności, {0:v}. Mogę ci pomóc dostroić twoją więź\
  \ z tymi klejnotami.\"\n(Dostatecznie dobry królik doświadczalny.)"
line:0fb491d: '{0} czuje, że może teraz korzystać z potężniejszego strumienia many.'
line:01c44c8: '"Nie trzeba. Dostroję ją sobie tak bardzo, jak będę chciała, gdy tylko
  wrócę do domu."'
line:071a8e9: '"Dzięki, Patchouli. Nie wiedziałam, że możesz być taka miła."'
line:0cbf9f4: '"Co masz na myśli?"'
line:0bc2af5: '"Świetnie... Komplement od półgłówka..."'
line:066cc93: '"Po prostu wydaje mi się, że wykorzystasz sytuację, aby odzyskać to,
  co jestem ci winna."'
line:0f3e81b: '"To może lepiej, żebyś oddała to co ukradła..."'
line:0874548: '"Nie do końca rozumiem, czemu dokładnie teraz o to pytasz."'
line:092f7e3: '"Nie wiem, czy jestem w stanie to jej wytłumaczyć, więc najlepiej odpuszczę..."'
line:07939f8: '"Czy ona zwietrzyła jakiś sposób na zdobycie pieniędzy? Ruszyła z kopyta..."'
line:035363d: '"Mieszkanko czerwonego domu nad jeziorem! Dobra robota."'
line:0cfade6: '"Nie chcę być znowu zaciągnięta do chłodzenia napojów."'
line:0465dee: '"Wydaje mi się, nie jest to czas na chłodzone napoje..."'
line:04fba63: '"Nie chcę o tym teraz myśleć. Zobacz się ze mną później, jak chcesz
  robić eksperymenty."'
