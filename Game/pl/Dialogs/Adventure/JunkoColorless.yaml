line:00b8f03: '"Nie twój interes."'
line:00b8f03.Reimu:
line:00b8f03.Marisa: '"Nie. Odmawiam oddania jakiekolwiek części mojej many."'
line:00b8f03.Sakuya: '"Mam już wystarczająco dużo bezkolorowej many. A teraz przepraszam."'
line:00b8f03.Cirno: '"To brzmi zbyt skomplikowanie. Myślę, że po prostu odpuszczę."'
line:00b8f03.Koishi: '"Moja siostra za często mi już mówi, że jestem "czystą tablicą".'
line:0252f89: '"Muszę powiedzieć, że twoja metoda korzystania z many jest dość nieefektywna."'
line:0632b2f: '"Pozwól mi i moim mocom oczyszczania pomóc ci ją kontrolować."'
line:0833aaf: Wybierz jedną monochromatyczną manę w bazie i zamień ją w dwie bezkolorowe
  many.
