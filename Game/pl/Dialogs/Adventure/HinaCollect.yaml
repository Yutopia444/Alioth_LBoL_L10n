line:017720c: '"Ah, Panno {0:v}, widzę nosisz w sobie mnóstwo nieszczęścia i zmartwień."'
line:0183740: '"Pozwól, bym przejęła na siebie twoje cierpienie"'
line:09f1923: '"Nie jesteś, aby zbyt nieufna? Ja nie mam niczego oprócz szczerych
  intencji."'
line:06b252f: '{0} czuje, jak jej nieszczęście zanika.'
line:02dcea4: '[Przyjmij pomoc] Usuń wszystkie karty |Nieszczęścia|.'
line:076f484: '"Bardzo ci dziękuję, Hino."'
line:076f484.Reimu: '"Chwała niebiosom! Ten dzień był już dostatecznie okropny."'
line:076f484.Marisa: '"W sumie... Nie ma sensu brać tych ''miłych pamiątek'' z sobą."'
line:076f484.Sakuya: '"Oczyściłaś mnie bardzo dokładnie, Hino."'
line:076f484.Cirno: '"Czuję się świeżo niczym zimny kawałek arbuza."'
line:076f484.Koishi: '"Czuję się teraz zdecydowanie świeżej."'
line:0a76aa4: '[Odejdź] Nic się nie dzieje.'
line:0d580ed: '"Może to jest nieszczęście, ale jest to też część mojej kolekcji..."'
line:00dc670: '[Obejmij ją] Zyskaj losową kartę |Nieszczęścia|.'
line:037bd0d: '"Nie, tym razem to ja przejmę je od ciebie."'
line:037bd0d.Reimu: '"Chronienie przed katastrofami i pieczętowanie zła jest również
  odpowiedzialnością kapłanek."'
line:037bd0d.Marisa: '"Słuchaj, nie jestem wybredna, jeśli chodzi o wygląd."'
line:037bd0d.Sakuya: '"Panna Remilia... Też mogła by być tak otwarta."'
line:037bd0d.Cirno: '"Nie ma problemu, zajmę się tym! Zamrożę całe to nieszczęście!"'
line:037bd0d.Koishi: '"A więc tak to jest jak ktoś zbiera nieszczęście."'
