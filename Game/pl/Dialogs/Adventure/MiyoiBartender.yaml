line:0c9cdfa: '{0} przypadkowo wchodzi późną porą do |Sanshoku Geidontei|. Ciężki
  zapach alkoholu wypełnia budynek…'
line:0c66585: '"Panno {0:v}! Proszę wejść! Czego byś dzisiaj chciała?"'
line:05ad143: '"Ah... to jest takie duże?! Wszyscy już na mnie patrzą i nie ma już
  odwrotu!"'
line:0269654: Czy ja o czymś nie zapomniałam...? Wybierz kartę, aby usunąć.
line:0b95170: '"Co tam słyszę, {0:v}? Panna "urywa-mi-się-film-po-jednym-drinku" pragnie
  wyzwać mnie na pojedynek?"'
line:00d22c7: Obserwujące youkai zaczęły kibicować. Niektóre nawet zaczęły stawiać
  zakłady o to, kto zwycięży.
line:0bdfac4: '"Próbujesz wychować tutaj małego wieloryba? To nie wystarczy!"'
line:0862f2d: '"Hey! Czy ty nie jesteś mi winna za cały zeszły miesiąc?"'
line:015f1aa: '"Uhh, czemu czuję się taka senna po jednym... kieliszku..."'
line:0e46351: '"Tak silne iluzje... czy coś dodawałaś do tego sake?!"'
line:0e46351.Reimu: '"Zaczęłam halucynować... Jak mocne było to sake, co mi dałaś!?"'
line:0e46351.Marisa: '"To były naprawdę silne halucynacje... Czy przypadkiem nie dodałaś
  mi czegoś do sake?"'
line:0e46351.Sakuya: '"Bardzo intensywne halucynacje... Czy zwykła sake może mieć
  taki efekt?"'
line:0e46351.Cirno: '"Uhh... Okropnie się czuję... To musi oznaczać, że ktoś dodał
  mi coś podejrzanego do mojego sake!"'
line:0e46351.Koishi: '"Hmm... To wcześniejsze sake... Czułam, że coś podejrzanego
  zostało tam dodane."'
line:0b0300d: '"Ahhh! Proszę to przyjąć i nikomu o tym nie mówić!"'
line:0b3a02b: '[Przyjmij] Zyskaj eksponat: |{0}|.'
line:0bd13e0: '"I tak się właśnie robi interesy. Do następnego razu~"'
line:0bd13e0.Reimu: '"To wymaga silnego zaangażowania. Będzie zatrzymywać się tutaj
  częściej."'
line:0bd13e0.Marisa: '"Jak najbardziej! Będę na ciebie liczyła także następnym razem!"'
line:0bd13e0.Sakuya: '"To bardzo hojne z twojej strony! Na pewno odwiedzę to miejsce
  ponownie."'
line:0bd13e0.Cirno: '"Ohh, naprawdę mi to dajesz!? Jesteś taka miła!"'
line:0bd13e0.Koishi: '"Wpadnę następnym razem!"'
line:0d8166c: '[Odmów] Nic się nie dzieje.'
line:0ea1dc5: '[Niedostępne] Wszystkie możliwe eksponaty zostały już zebrane.'
line:0868bad: (Geidontei... Jeżeli dobrze pamiętam, jest on otwarty w nocy dla youkai.)
line:061da42: '[Haust] Zyskaj eksponat: |{0}|. Usuń kartę z biblioteki.'
line:0da2517: '"To sake? Czy panna {0} jest pewna, że sobie poradzi?"'
line:018cd9a: '[Zawody alkoholowe] Zyskaj {0} <sprite="Point" name="Gold"> oraz dwie
  karty Nieszczęścia: |{1}|.'
line:0c77879: '"Coś nie tak, Suika? Twój cwaniacki uśmiech nie schodzi ci z twarzy
  odkąd tu weszłam."'
line:0c77879.Reimu:
line:0c77879.Marisa: '"Wy pijane Oni, wasze głowy są wypełnione wyłącznie alkoholem."'
line:0c77879.Sakuya: '"Oj, przez cały czas czuję na sobie twój wzrok. Co tu się dzieje?"'
line:0c77879.Cirno: '"Hey! Może wiesz, że jestem najsilniejsza, ale to nie znaczy,
  że możesz się ze mnie naśmiewać."'
line:0c77879.Koishi: '"Panno oni, czemu cały czas się mi pani przygląda?"'
line:0064f30: '"Oto mój atak ostateczny, Bomba Głębinowa!"'
line:0064f30.Reimu: '"Nie jesteś świadoma, jak dobre w piciu są kapłanki—jestem profesjonalistką!"'
line:0064f30.Marisa: '"Przestań gadać głupoty!.. Dajcie mi coś mocniejszego!"'
line:0064f30.Sakuya: '"Procent alkoholu nie ma dla mnie znaczenia, ani trochę!"'
line:0064f30.Cirno: '"Nie doceniasz mnie! Mogę tutaj wezwać wszystkie inne wróżki
  do picia z tobą!"'
line:0064f30.Koishi: '"Oooooh~ Cała ziemia mi się kręci~~ To zaczyna być zabawne!"'
line:0c29c84: "Przepełniona determinacją, {0} wygrywa pojedynek i bierze ze sobą nagrodę.\n\
  Czy było to tego warte?"
line:0bea743: '[Łyk] Walcz z losową grupą wrogów, by zyskać losowy rzadki eksponat.'
line:05203c5: '"Jasne, poproszę to, co zwykle. Dopisz mi to do rachunku, dobra?"'
line:05203c5.Reimu: '"Eh, znowu będę nabijać rachunek."'
line:05203c5.Marisa: '"Zapłacę następnym razem jak wpadnę. Daj mi jeszcze trochę czasu."'
line:05203c5.Sakuya: '"Czy możemy dopisać to do rachunku naszej strażniczki?"'
line:05203c5.Cirno: '"Pieniądze!? Nie posiadam!"'
line:05203c5.Koishi: '"Będę lecieć. Pa-pa!"'
line:024e390: (We śnie, {0} wyczuła wrogą obecność!)
line:01b5a50: '"Nie trzeba. Już nie nabiorę się na twoje sztuczki."'
line:01b5a50.Reimu:
line:01b5a50.Marisa: '"Hej, hej, możemy już sobie darować. To chyba już koniec na
  dziś."'
line:01b5a50.Sakuya:
line:01b5a50.Cirno: '"Muszę już iść!"'
line:01b5a50.Koishi: '"I tak nie zamierzam tutaj wracać"'
line:096d262: '"Daj mi trochę tej specjalnej sake, które Aya piła ostatnim razem!"'
line:0c7c734: ({0} w końcu wypiła |Oddech Wieloryba|, ale pijana zapomina o rachunku
  i o czymś ważnym.)
