line:00848b0: '"Patrzysz teraz na moją prawdziwą formę. Właśnie uciekłam z matrixa."'
line:0b3c24c: '"Czy jesteś w stanie rozróżnić, co jest prawdziwe, a co nie?"'
line:06ae443: '"Hehe, skoro tak mocno interesujesz się życiem pozaziemskim, dam ci
  jedno z moich UFO! Bierz!"'
line:02e269d: '[Fizyczne] Strać {0} <sprite="Point" name="Power">. Zyskaj eksponat:
  |Zestaw UFO|.'
line:02c3f5f: '[Wirtualne] Strać {0} maksymalnego życia. Zyskaj eksponat: |Wirtualne
  UFO|.'
line:095b051: '[Opuść] Nic się nie dzieje.'
line:0782c18: '"Nie, humanoidy się nie liczą. Mówię o tym rodzaju obcych, który jest
  łapany przez facetów w czerni."'
line:02b9647: '(Jeśli ich nie potrzebujesz, to możesz zawsze je sprzedać komuś innemu.)'
line:02d45a7: '"Wygląda jak nowe..."'
line:00f952e: '"Słyszałam o dziwakach ze świata zewnętrznego takich jak ty. Takich
  co myślą, że rzeczywistość jest symulacją."'
line:0b8ee98: '"Możesz je mieć na pamiątkę."'
line:07ebb66: '"Miałam już dość kontaktów z obcymi odwiedzając Eientei."'
line:0ffebf0: '"Nigdy nie trać swojej ciekawości do rzeczy niewyjaśnionych."'
line:0830dc8: UFO absorbują energię z otoczenia...
line:037b17c: "{0:a} dopadły nudności.\nZ jej głowy zniknęły wszelkie wspomnienia\
  \ o przygodzie przez Matriksa, z której właśnie wróciła."
