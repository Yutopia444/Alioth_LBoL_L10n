line:008b857: '{0}'
line:02cd30b: '"Patrz Mai, znaleźliśmy kolejną kandydatkę."'
line:0927a10: '"Mając za cenę swoje życie, zobacz jakie korzyści można otrzymać pracując
  w Świecie Tylnych Drzwi"'
line:024f6c3: '[Narzędzia] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''%
  punktów''} życia i zyskaj dwie losowe karty Narzędzi.'
line:0045201: '[Forma] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''% punktów''}
  życia i zyskaj {1} maksymalnego życia.'
line:02c03b1: '[Sprawczość] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''%
  punktów''} życia i zyskaj {1} <sprite="Point" name="Power">.'
line:0ba21b9: '[Zdolności] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''%
  punktów''} życia i zyskaj losową kartę zdolności.'
line:0b8832a: '"Ha! Pieniądze ostatecznie są najważniejsze. Chcesz kontynuować?"'
line:0b3cea2: '"Z drzwi wylatują jakieś dziwne narzędzia!"'
line:0579e44: '"Praca nad sobą pomoże ci dłużej utrzymać się na nogach? Gdzie zniknęła
  twoja pewność siebie?"'
line:08eea4a: '[Niedostępne] Wszystkie możliwe eksponaty zostały już zebrane.'
line:0292f42: '[Eksponat] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''%
  punktów''} życia i zyskaj losowy eksponat.'
line:0559467: '{0}'
line:0d3ac72: '{0}'
line:0072ead: '{0}'
line:041d1bd: '{0}'
line:0c9e100: '{0}'
line:06691d2: '"Właściwie to jaką pracę wasza szefowa oferuje?"'
line:0c1f815: '[Zarobki] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''%
  punktów''} życia i zyskaj {1} <sprite="Point" name="Gold">.'
line:0e4c0ab: '[Eksponat] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''%
  punktów''} życia i zyskaj losowy eksponat.'
line:08238a7: '"Ah, kandydat pełny werwy do pracy."'
line:091e5ec: '"Eksponaty z wystawy?! Nie spodziewałam się, że odnajdą się w naszych
  drzwiach"'
line:0a37d54: '"Chcesz rozwijać w sobie nowe kompetencje? Zobaczmy, gdzie cię poprowadzą
  drzwi."'
line:033d1fd: '[Odejdź] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''%
  punktów''} życia.'
line:0523a82: '"Hehe, wygląda na to, że nie spełniasz wymogów naszej szefowej."'
line:05fe005: '"Wybaczcie, ale nie interesuje mnie wasza pracodawczyni."'
line:064b7bc: "\"Nie planuję zmiany etatu, ale mogę wam zarekomendować odpowiedniego\
  \ kandydata.\"\n(Zaproponuję im tę leniwą strażniczkę, gdy wrócę do domu.)"
line:0371959: '"Ktoś słabszy ode mnie, chce być moim szefem. Nie ma mowy!"'
line:06874cb: '"Szefowa? Czy to znaczy, że jest ktoś bardziej imponujący niż moja
  siostra?"'
