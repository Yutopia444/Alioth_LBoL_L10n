line:0ea45c4: '[Trójkolorowe Mrożone Dango] Podmień jedną kartę na ulepszoną wielokolorową
  kartę.'
line:00eb35b: Podmień jedną kartę na ulepszoną wielokolorową kartę
line:0dfa68e: '"Moim zdaniem to dango... reprezentuje przyszłość wszystkich dango!"'
line:0598cdd: '"Dziękuję za komplement!"'
line:0d7cfde: '[Ciasto] Zyskaj eksponat: |{0}| oraz kartę |Nieszczęścia|: |{1}|.'
line:0528906: '"Mielona wołowina połączona z... dango? Co to za danie? Nigdy czegoś
  takiego nie widziałam."'
line:0815d2b: "\"Łał, to jest niezwykle smaczne!\"\n(Może zamiast pozwolić, aby Yuyuko\
  \ to miała... Co jeśli...)"
line:0661ea5: '{0} bierze Ciasto Księżycowe i ucieka gdzie pieprz rośnie!'
line:03a8a3c: '"Hej! Wracaj tu! Niech mi ktoś pomoże, zostałam okradzionaaaa!"'
line:047fc02: '"Pani Yuyuko chciała posmakować dania, którego jeszcze nie próbowała.
  Nie byłam dostatecznie pewna, więc przygotowałam dwa..."'
line:0577ef3: '"Panno {0:v}, czy mogłabyś je spróbować, zanim dostarczę je pani Yuyuko?"'
line:07b91f2: "\"Daj mi zjeść trochę tego dango.\"\n(Puszysty kleisty ryż zawinięty\
  \ w słodko-kwaśny krem z kawałkami owoców. Co za innowacyjna kombinacja....)"
line:035f569: "\"Nazwałam to 'Sardyńskim Ciastem Księżycowym'. Innowacyjne potrawy\
  \ najlepiej robić z egzotycznych składników. Proszę spróbować.\""
line:008037e: '{0} czuje gniew Yuyuko, której nie dane było zasmakować Sardyńskiego
  Ciasteczka Księżycowego…'
