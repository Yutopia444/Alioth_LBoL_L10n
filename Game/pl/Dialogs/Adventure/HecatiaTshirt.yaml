line:008fa52: '"Dalej! Czas wspólnymi siłami wesprzeć Kaguyę-chan!"'
line:0670be2: '"Pamiętaj, żeby wszystkim się w nim pokazywać!"'
line:00d22b0: '[Odejdź] Nic się nie dzieje.'
line:0678716: '[Przyjmij ubranie] Zyskaj eksponat: |T-Shirt Idolki|.'
line:063a72b: '"Według moich badań Kaguya-chan jest gościnna i przyjazna, w przeciwieństwie
  do innych lunarian."'
line:0ba9037: '"Za darmo to dobra cena. Wezmę jeden."'
line:0ba9037.Reimu:
line:0ba9037.Marisa: '"Za darmo? Znaczy, że mogę to pożyczyć i nie oddawać, tak?"'
line:0ba9037.Sakuya: '"Darmo, powiadasz? Pamiątka jaką przyniosę pannie Remilli będzie
  tym razem dość nietypowa."'
line:0ba9037.Cirno: '"Rzeczy dla najsilniejszych powinny być darmowe."'
line:0ba9037.Koishi: '"Bez opłat? Będę chciała ubrać w to moją siostrę jak wrócę."'
line:0fc2c16: "\"{Censor:select false=\\\"Łał, 'Kaguya-chan'. Jaka żenada.\\\" true=\\\
  \"Łał. Twój ubiór już i tak był dostatecznie dziwaczny. Zapomnij.\\\"}\""
line:0fc2c16.Reimu:
line:0fc2c16.Marisa:
line:0fc2c16.Sakuya: '"To nawet nie nadawałoby się na szmatkę"'
line:0fc2c16.Cirno: '"Lód by się roztopił, jeśli założyłabym czarne ubranie..."'
line:0fc2c16.Koishi: '"Łał. To... nawet... przy uroczym nie stało!"'
line:01566ec: '[Wymień ubranie] Zyskaj eksponat: |T-Shirt Idolki (L)|'
line:059fbd3: '"Darmowe? To wezmę jeden. Poproszę większy rozmiar."'
line:059fbd3.Reimu:
line:059fbd3.Marisa: '"Jaka okazja! Daj mi ten większy!"'
line:059fbd3.Sakuya: '"Wezmę to na upominek dla Meiling. Tylko proszę podaj mi większy
  rozmiar."'
line:059fbd3.Cirno: '"Oczywiście, że biorę największą jaką masz!"'
line:059fbd3.Koishi: '"No cóż, w takim razie wezmę ten większy! Wygląda świetnie!"'
line:0ba87b6: '"Pamiętaj, żeby wszystkim się w nim pokazywać!"'
