line:037c786: '"Wydrowe dusze wytropiły zbuntowane drony kapp. Dla dobra krainy, proszę,
  abyś zajęła się tym problemem najszybciej jak to możliwe."'
line:07acb62: '[Walcz] Walcz z falangą dronów i zyskaj losowy rzadki eksponat.'
line:0970713: '"Na pannę {0:a} zawsze można liczyć! Proszę przyjąć mój starannie przygotowany
  podarunek!"'
line:0e2d8d9: '[Przyjmij] Zyskaj eksponat: |{0}|.'
line:08457aa: '"Tak, proszę pani! Proszę dać mi znać, jeśli będzie mnie pani potrzebowała
  ponownie."'
line:01fd35f: '[Odmów] Nic się nie dzieje.'
line:09e89c0: '[Odmów] Zyskaj kartę Nieszczęścia: |{0}|.'
line:0e300a9: '"C-czy walka z nimi przyniesie mi jakąkolwiek korzyść?"'
line:0abbfc7: "\"Masz rację...\"\n(Normalnie bym się jej przeciwstawiła, ale z jakiegoś\
  \ powodu, ja...)"
line:0f208e0: '"Lud powierzchni liczy na ciebie. Czy rozsądnym jest wystawić go do
  wiatru z samolubnych pobudek?"'
line:0f9238b: '"Łaskawa panno {0:v}, czy zechciałabyś wyświadczyć przysługę głowie
  klanu Kiketsu?"'
line:098663c: "\"Hmm? D-dobrze.\"\n(Moment... Czemu się na to zgodziłam, nie przyglądając\
  \ się wcześniej przeciwnikowi?)"
line:04ee4ff: '"Spasuję. Nigdy nie proszę o rekompensatę za pomoc innym."'

