line:005a3e9: '"Ci, którzy znają jedynie rzadkie karty, nie są świadomi, z jaką pogardą
  traktuje się karty słabe."'
line:04566b1: '"{0:v}, musimy użyć Pobijaka Cudów, aby zbuntować się przeciwko rzadkim
  kartom!"'
line:04e318b: '[Rośnięcie] Wybierz {0} podstawowych kart do ulepszenia.'
line:039b98c: '"Nie mam czasu, aby pozbyć się tych kart, więc czemu nie?"'
line:039b98c.Reimu: "\"Rozumiem cię. Jest mi zawsze ciężko rozstać się z tymi kartami.\"\
  \n(Głównie dlatego, że usuwanie ich jest zbyt drogie.)"
line:039b98c.Marisa: '"Rewelacja. To jest właśnie powód, dla którego przetrzymywałam
  te karty."'
line:039b98c.Sakuya:
line:039b98c.Cirno:
line:039b98c.Koishi:
line:07da6ed: '"Świetnie! Pobijaku Cudów, obdarz te słabe karty swoją mocą!"'
line:0593c4c: '"Hm? Czemu mam wrażenie, że stałaś się jeszcze mniejsza?"'
line:009a2f1: '[Skurczenie] Usuń |niepodstawową| kartę z biblioteki.'
line:0e60a55: "\"Proszę usuń moje inne karty. Chciałabym mieć tylko te słabe\"\n(Skoro\
  \ ta usługa jest darmowa, mogę trochę poudawać, że mi zależy.)"
line:0e60a55.Reimu: "\"Proszę pozbądź się moich innych kart. Zależy mi tylko na tych\
  \ słabych!\"\n(Kiedy ta yamawaro nauczy się, że usuwanie kart powinno być darmowe?)"
line:0e60a55.Marisa: '"Lubię wszystkie swoje karty, ale zwłaszcza te słabe!"'
line:0e60a55.Sakuya:
line:0e60a55.Cirno: '"Nie potrzebuję tej karty, jestem już dostatecznie silna!"'
line:0e60a55.Koishi: '"Jak ślicznie! Moje karty stały się takie urocze!"'
line:0a6031e: '"Dobrze! Mały pobijaku, pozbądź się kart, które stoją na naszej drodze!"'
line:03acac4: (Użyj |r:łuku|, aby dać jej później nauczkę |r:Seija|...)
line:05c5655: "\"Chciałabym dołączyć do waszego powstania.\"\n(W sumie, zawsze chciałam\
  \ tego spróbować.)"
line:05c5655.Reimu: '"Nie mam już sił tak ciężko pracować. Dołączę do waszego powstania."'
line:05c5655.Marisa: '"Nie wierzę ci, no chyba że potrafisz wprawić moje karty w ruch."'
line:05c5655.Sakuya:
line:05c5655.Cirno: '"Rebelia? Brzmi bardzo fajnie, też chciałabym spróbować!"'
line:05c5655.Koishi: '"Brzmi jak dobra zabawa. Chętnie spróbuję ci pomóc."'
line:06fc81c: '"Pięknie! Mały pobijaku, udziel {0:d} moc fantazji!"'
line:0253e27: '"Hm? Dlaczego mam wrażenie, jakbyś stała się nieco większa?"'
line:0a32439: (To powinno być to, czego chciała |r:Seija|...)
line:0364fd7: Usuń niepodstawową kartę z biblioteki
line:0bb82a2: '[Podmiana] Wybierz {0} podstawowe karty do podmiany na pospolite karty.
  Strać {1} maksymalnego życia.'
line:0622791: "\"A, zapomniałam wspomnieć. Moc pobijaka ma swoją niewielką cenę...\"\
  \n(Osłabiłam {0:a} dla ciebie |r:Seija|!)"
line:0d37399: Wybierz {0} podstawowych kart do ulepszenia
line:05d94d1: Wybierz {0:plural one='% podstawową kartę' few='% podstawowe karty'
  many='% podstawowych kart'} do podmiany na pospolite karty
line:08c142c: '[Odejdź] Nic się nie dzieje.'
line:0d64e10: "'Niestety mnie zależy jedynie na rzadkich kartach! Są silne i utrzymują\
  \ wysoką cenę na rynku!\""
line:0690f4b: "\"Czekaj... Czy ty dopiero zaczynasz z grami karcianymi?\"\n(Nie musimy\
  \ się o nią martwić, |r:Seija|...)"
