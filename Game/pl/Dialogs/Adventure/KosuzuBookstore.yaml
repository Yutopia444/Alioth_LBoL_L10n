line:0150d96: '"Witaj w wypożyczalni książek Suzunaan. Czy jest coś, co chciałabyś
  przeczytać?"'
line:02e54df: '[Zwróć] Strać eksponat: |{0}|.'
line:0b70964: '[Ta z lewej] Zyskaj eksponat: |{0}|.'
line:04432b2: '[Ta z prawej] Zyskaj eksponat: |{0}|.'
line:09f57d5: '[Ta pod spodem] Zyskaj eksponat: |{0}|.'
line:0dccd45: '[Odejdź] Nic się nie dzieje.'
line:05c251f: '"Nie, dziękuję. Nie wydaje mi się, żebym miała dzisiaj czas na książki."'
line:05c251f.Reimu:
line:05c251f.Marisa: '"Jestem dzisiaj zbyt zajęta, więc nie będę niczego pożyczała."'
line:05c251f.Sakuya:
line:05c251f.Cirno: '"Nie dzięki, ja nie czytam książek!"'
line:05c251f.Koishi: '"Książki, tak? W sumie, nie czytam żadnych."'
line:07162cf: '[Niedostępne] Brak innych posiadanych książek.'
line:0d2b81d: '[Zwróć] Strać eksponat: |{0}|.'
line:09d3e76: "\"W porządku.\nBędziesz musiała wpłacić kaucję wysokości {0} <sprite=\"\
