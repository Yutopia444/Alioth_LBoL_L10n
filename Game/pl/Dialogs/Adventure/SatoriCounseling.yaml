line:04226a9: '"Zwiedzałaś wystawę i rozwiązujesz teraz incydent."'
line:01f775f: '"Oh tak, racja. Na razie!"'
line:0e5d3c4: '"Pamiętaj by wrócić do domu wcześnie! Nie ma znikania na całą noc!"'
line:036ea59: '"Przez wiele lat, patrząc na swoje łóżko, czułam jakbym miała być pochłonięta
