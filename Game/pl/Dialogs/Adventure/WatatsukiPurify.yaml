line:05fe9e1: '"Tu jesteś, asystentko pani Eirin. Pozwól, że udzielę ci pomocy."'
line:08e2a8a: '"Pożyczyłam od Yorihime dzwonki Kagury bogini |Idunome|. Pozwolą tobie
  pozbyć się nieczystości."'
line:050b98e: Z błogosławieństwem dzwonków Kagury, {0} czuje jak niewielki fragment
  jej nieczystości zanika…
line:022c54a: '"Dzięki!"'
line:07b8cb5: '"Możesz wziąć i zjeść tę brzoskwinię co przyniosłam. Wiedz tylko, że
  jest bardzo słodka."'
line:09c8a85: '"Smakuje rewelacyjnie!"'
line:09c8a85.Reimu: '"Jest pyszna. Czemu nie poczęstowaliście mnie nimi, jak byłam
  na Księżycu?"'
line:09c8a85.Marisa: '"Świetny smak! Szkoda, że nie miałam okazji ich spróbować, jak
  ostatnio byłam na Księżycu."'
line:09c8a85.Sakuya: '"Ona jest przepyszna! Muszę zabrać kilka dla panny Remilii."'
line:09c8a85.Cirno: '"Łał! To jest pyszne! Masz może więcej!?"'
line:09c8a85.Koishi: '"Jaka słodka i pyszna! Od razu czuję się lepiej."'
line:0c671d8: '[Odmów] Nic się nie dzieje.'
line:0b9590a: '"Mogę rozwiązać ten mały incydent z zamkniętymi oczyma!"'
line:0b9590a.Reimu:
line:0b9590a.Marisa: '"Nie ma potrzeby. Eksperci od rozwiązywania incydentów tacy
  jak ja są tu po to, byś nie musiała się angażować."'
line:0b9590a.Sakuya: '"Nie, dziękuję. Jeśli coś brzmi zbyt dobrze by było prawdziwe,
  to zazwyczaj takie jest."'
line:0b9590a.Cirno: '"Jestem już teraz najsilniejsza! Nie potrzebuję dodatkowej pomocy!"'
line:0b9590a.Koishi: '"Ten owoc pachnie dość podejrzanie. Podziękuje."'
line:0c46a1e: '"W porządku. Moim celem tutaj i tak jest tylko nadrobić zaległości
  z panią Eirin."'
line:0220408: '[Odmów modlitwę] Strać {0} maksymalnego życia. Zyskaj dwie karty: |{1:v}|.'
line:015cd2b: '[Zjedz brzoskwinię] Zyskaj {0} maksymalnego życia. Zyskaj kartę Nieszczęścia:
  |{1}|.'
line:005d895: Pomimo podejrzanego zapachu aromatów przemysłowych, genetycznie zmodyfikowane
  brzoskwinie Stolicy Księżycowej dalej są bardzo smaczne.
