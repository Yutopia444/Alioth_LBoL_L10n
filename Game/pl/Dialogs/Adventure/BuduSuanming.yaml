line:0b3de88: '"Znajomi, przeszkody i ukryci wrogowie. Moje jasnowidzenie wszystko
  ci przepowie!"'
line:07cdbe4: '[Wróżba] Zapłać {0} <sprite="Point" name="Gold">. Ujawnij bossa trzeciego
  aktu.'
line:0152f90: '[Interpretacja snu] Zapłać {0} <sprite="Point" name="Gold">. Ujawnij
  pierwsze przyjazne wydarzenie w trzecim akcie.'
line:028834f: '[Odejdź] Nic się nie dzieje.'
line:010d2bd: '"Przykro mi, ale nie wiem o czym ty mówisz."'
line:010d2bd.Reimu:
line:010d2bd.Marisa: "\"Ona zdaje się być ode mnie lepsza w 'pożyczaniu' pieniędzy.\
  \ Trzeba zmykać!\""
line:010d2bd.Sakuya:
line:010d2bd.Cirno: '"Twój przekręt jest tak słaby, że nawet wróżki się na niego nie
  nabiorą."'
line:010d2bd.Koishi:
line:0b5f8ae: '"Twoim przeciwnikiem będzie {0}."'
line:0607cc8: '"Natkniesz się na {0:a}."'
line:0abc92c: '"Jej ataki i taktyki są dość uniwersalne. Postaraj się nie przeciągać
  walki za długo."'
line:0c5922a: '"Ona ograniczy liczbę kart, którymi możesz zagrać. Czas poszukać kart
  o wysokim koszcie."'
line:055e092: '"Ona oczyści twoją manę z koloru. Używaj kart, które mają tylko uniwersalny
  koszt, albo znajdź sposób, aby zyskać manę filozoficzną, która nie może zostać oczyszczona."'
line:088d295: '"Zjedzenie brzoskwini będzie dobrą decyzją. Jeżeli masz jakieś karty,
  którymi grasz regularnie, rozważ czy nie pozwolić jej na ich oczyszczenie, jeśli
  nie wpłynie to na ich efektywność"'
line:0150d74: '"Nieźle jak na pustelniczkę!"'
line:0150d74.Reimu:
line:0150d74.Marisa: '"Dobra robota! Twoje magiczne umiejętności dają ci potencjał
  do stania się czarownicą."'
line:0150d74.Sakuya: '"Interesujące! Masz kompetencje by zostać arlekinem panny Remilii."'
line:0150d74.Cirno: '"Rozumiem! Wygląda na to, że mam wszystko co potrzeba, aby zostać
  najsilniejszą wróżką."'
line:0150d74.Koishi: '"Niewiarygodne! Dzięki twojemu jasnowidzeniu, mogłabyś zostać
  kompanem dla mściwych dusz."'
line:0d00686: '"Ona pomoże tobie zidentyfikować prawdziwego sprawcę. Eksponaty z świata
  zewnętrznego nie będą ci potrzebne."'
line:07f3e64: '"Jeżeli masz sposób na poradzenie sobie z alkoholem, dobrym pomysłem
  będzie podjęcie wyzwania i wygranie pieniędzy w pojedynku na picie."'
line:09db3f2: '[Odczyt twarzy] Zapłać {0} <sprite="Point" name="Gold">. Ujawnij pierwszy
  przedmiot ukrytego finałowego bossa.'
line:02c2c1f: '"Jej pierwszym przedmiotem będzie {0}."'
line:07e0edb: '"Będzie nakładał na ciebie negatywne efekty, więc lepiej zaopatrz się
  w sprzęt medyczny. Możesz też poprosić Keine o jeden z jej skarbów."'
line:0062be2: '"Odbierze ci wszystkie eksponaty poza Lśniącymi. Nie kupuj eksponatów
  od Takane, chyba że aktywują swoje efekty w pierwszej turze."'
line:0d65829: '"Przyzywa coraz silniejsze fale wrogów. Przygotuj jeden lub dwa ataki,
  które zadają obrażenia wielu wrogom naraz."'
line:07e5e51: '"Praca pani {0:g} pomaga Gensokyo, dlatego zaoferuję małą zniżkę."'
line:054b5d4: '"Będzie dodawał Czyste Światłości do twojej talii, więc musisz znaleźć
  sposób na pozbycie się ich."'
