line:0122dcf: '[Zostań Błogosławionym] Ulepsz kartę.'
line:0f513e5: '"Emm.... czy mogłabyś podzielić mi się trochę swoją mocą?"'
line:0f513e5.Reimu:
line:0f513e5.Marisa:
line:0f513e5.Sakuya:
line:0f513e5.Cirno: '"Hej! Daj swoją moc tej Wróżce Władającej Lodem!"'
line:0f513e5.Koishi:
line:042c6e3: '"Pewnie~ Ujrzyj moje Święte Proszkowane Łuski!"'
line:042c6e3.Reimu:
line:042c6e3.Marisa:
line:042c6e3.Sakuya:
line:042c6e3.Cirno: '"Dobrze! Bierz ten proszek i niech wróżki wrócą do świetności!"'
line:042c6e3.Koishi:
line:092d6b0: Wybierz kartę, aby ulepszyć
line:0663fce: '[Udziel Unicestwienie] Strać {0:plural one=''% punkt'' few=''% punkty''
  many=''% punktów''} życia i usuń kartę z biblioteki.'
line:070b7de: '"Umm... czy mogłabyś pozbyć się trochę mojego stresu?"'
line:070b7de.Reimu:
line:070b7de.Marisa:
line:070b7de.Sakuya:
line:070b7de.Cirno: '"Nie trzeba, czy nie pamiętasz o tej największej legendzie, w której
  pokonałyśmy tą dziwaczkę w wózku inwalidzkim?"'
line:070b7de.Koishi:
line:04e7441: '"Pewnie~ Ujrzyj moje Święte Proszkowane Łuski!"'
line:04e7441.Reimu:
line:04e7441.Marisa:
line:04e7441.Sakuya:
line:04e7441.Cirno: '"Ja nie chcę pamiętać! Dlaczego ty też o niej zapomnisz, baka!"'
line:04e7441.Koishi:
line:0cb3009: Usuń kartę z biblioteki
line:0122e22: '"No to... rób jak chcesz?"'
line:0122e22.Reimu:
line:0122e22.Marisa:
line:0122e22.Sakuya:
line:0122e22.Cirno: '"Wniebowstąpienie? Fajniejsze jest zamrażanie żab..."'
line:0122e22.Koishi:
line:01a7f1c: '"Pewnie~ Ujrzyj moje Święte Proszkowane Łuski!"'
line:01a7f1c.Reimu:
line:01a7f1c.Marisa:
line:01a7f1c.Sakuya:
line:01a7f1c.Cirno: '"Aż tak? Według mnie zabawniejsze jest sypanie proszkiem i oglądanie,
  jak inni kichają."'
line:01a7f1c.Koishi:
line:0b4215c: '"Ta potężna siła życia... w końcu osiągnęłam ostatni krok mojego wniebowstąpienia.'
line:0e35dc4: '"Chodź zostać błogosławionym przez Boginię Nocy Letniej, {0:v}!"'
line:0c5e0c4: Skrzydła Eternity wydzieliły cuchnący proszek... Przyznające {0:d} trochę
