line:0122dcf: '[Otrzymaj błogosławieństwo] Ulepsz kartę.'
line:0f513e5: '"Emm... Czy mogłabyś trochę podzielić się swoją mocą?"'
line:0f513e5.Reimu:
line:0f513e5.Marisa: '"Hę? Mogę wziąć twoją moc?"'
line:0f513e5.Sakuya: '"Oh, rozumiem. W takim wypadku przyjmę je."'
line:0f513e5.Cirno: '"Hej! Daj swoją moc mi, Lodowej Królowej Wróżek!"'
line:0f513e5.Koishi: '"Eh!? Chcesz się podzielić mocą ze mną?"'
line:042c6e3: '"Pewnie! Oto moje Święte Proszkowate Łuski!"'
line:042c6e3.Reimu:
line:042c6e3.Marisa:
line:042c6e3.Sakuya:
line:042c6e3.Cirno: '"Dobrze! Zaakceptuj mój dar Świętego Pyłku i niech wróżki wrócą
  do świetności!"'
line:042c6e3.Koishi:
line:092d6b0: Wybierz kartę do ulepszenia
line:0663fce: '[Otrzymaj unicestwienie] Strać {0:plural one=''% punkt'' few=''% punkty''
  many=''% punktów''} życia i usuń kartę z biblioteki.'
line:070b7de: '"Umm... czy mogłabyś wyzwolić mnie od mojego stresu?"'
line:070b7de.Reimu:
line:070b7de.Marisa:
line:070b7de.Sakuya:
line:070b7de.Cirno: '"To nie będzie koniecznie. Nie pamiętasz naszej legendarnej przygody,
  w której pokonałyśmy dziwaczkę na wózku inwalidzkim?"'
line:070b7de.Koishi:
line:04e7441: '"Pewnie! Oto moje Święte Proszkowane Łuski!"'
line:04e7441.Reimu:
line:04e7441.Marisa:
line:04e7441.Sakuya:
line:04e7441.Cirno: '"Nie przypominaj mi tym! Ty też powinnaś o niej zapomnieć, idiotko!"'
line:04e7441.Koishi:
line:0cb3009: Usuń kartę z biblioteki
line:0122e22: '"To... może coś mi dasz?"'
line:0122e22.Reimu:
line:0122e22.Marisa:
line:0122e22.Sakuya:
line:0122e22.Cirno: '"Metamorfoza? Dużo ciekawsze jest mrożenie żab..."'
line:0122e22.Koishi:
line:01a7f1c: '"Pewnie! Oto moje Święte Proszkowane Łuski!"'
line:01a7f1c.Reimu:
line:01a7f1c.Marisa:
line:01a7f1c.Sakuya:
line:01a7f1c.Cirno: '"Naprawdę? Dużo zabawniejsze jest sypanie innych proszkiem i
  oglądanie kichają."'
line:01a7f1c.Koishi:
line:0b4215c: '"Tyle potężnej energii życiowej... Osiągnęłam ostatni krok mojej boskiej
  metamorfozy!"'
line:0e35dc4: '"Podejdź {0:v} i uzyskaj błogosławieństwo Bogini Nocy Letniej!"'
line:0c5e0c4: Skrzydła Eternity rozpyliły cuchnący proszek... ofiarując {0:d} trochę
  "mocy"…
