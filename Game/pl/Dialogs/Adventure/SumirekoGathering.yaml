line:022ef50: '[Wymiana] Wymień kartę: |{0}|, na jedną z trzech rzadkich kart.'
line:0d7f696: '[Niedostępne] Nie masz żadnych rzadkich kart do wymiany.'
line:07a7bdc: '[Kupno] Zapłać {0} <sprite="Point" name="Gold">, aby zyskać jedną z
  trzech rzadkich kart.'
line:00120ec: '[Niedostępne] Brakuje <sprite="Point" name="Gold">.'
line:0283933: '"Nieźle, moja kolekcja rośnie!"'
line:0a9677d: '{0}'
line:06b5869: '"Co powiesz na {0}?"'
line:05de04c: "\"Zgoda!\"\n(Ha, to o wiele więcej niż oferty na platformach wymiany.)"
line:0073f47: Twoje karty są tandetne. Poradzę sobie bez nich."
line:0d9bed0: '"Nie. Moje zarobki nie są wystarczające, aby pozwolić sobie na takie
  hobby."'
line:0a46227: '{0}'
line:060422d: '"T-to musi być najnowsza konsola{Censor:select true=\"\" false=\" Nentendo\"}!"'
line:0ed2833: '[Zgódź się] Strać: |{0:a}|. Zyskaj: |{1}|.'
line:06b0c24: (Coś czuję, że też nie skorzystam z tych kosmetyków.)
line:06cd2f3: '[Odejdź] Nic się nie dzieje.'
line:0b6b919: '"Nieeee! A chciałam pograć ze znajomymi z klasy w ''Youkai Hunter:
  Rise''..."'
line:0329854: (Czy ci łowcy youkai nie są wszędzie w Gensokyo?)
line:040269b: '"Panno {0:v}! Chciałabyś się wymienić kartami z tej kolekcjonerskiej
  gry karcianej ze świata zewnętrznego?"'
line:0977eb5: '"Możemy zamienić się |rzadkimi| kartami. Jeśli nie masz żadnej, to
  mogę sprzedać ci jedną za rozsądną cenę."'
line:072c3d7: '"Dam ci tę kartę w zamian za nią. Musisz wiedzieć, że jest ona dość
  potężna!"'
line:046c8a9: '[Odejdź] Nic się nie dzieje.'
line:0a6bd2c: '"Do następnego razu!"'
line:04c2389: '"Dasz mi ją za zestaw luksusowych kosmetyków? Wygrałam je na loterii,
  ale moje pokolenie jeszcze ich nie potrzebuje."'
line:00f4cea: '"Super! Teraz mogę zagrać w arcydzieło, jakim jest ''Legend of Rinkle:
  Screams of the Wild''!"'
