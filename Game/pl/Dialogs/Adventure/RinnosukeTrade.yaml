line:0e77e0d: '"Jak to prostokątne pudełko miałoby mi niby pomóc? Czuje się oszukana."'
line:09bbfcf: '"Możesz w takim razie to wziąć. Ja już tego nie potrzebuje."'
line:0ca56ad: '"Tak bardzo zależy ci na tych okularach?"'
line:0bd086d: "\"Czy to nie jest...\nPanno {0:v}, masz przy sobie coś, na czym mi\
