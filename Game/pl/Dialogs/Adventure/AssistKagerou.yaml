line:0d31645: '"Panno {0:v}, czy ten skarb ci jakoś pomoże rozwiązać ten incydent
  szybciej?"'
line:09559cc: '[Nie Miziaj] Zyskaj losowy |Eksponat|. Dodaj |{0:a}| do biblioteki.'
line:0d416e0: '"Tak jak się spodziewałam po {0:l}, moje plany podróżnicze wróciły
  na właściwe tory!"'
line:05164d7: (Kagerou skoczyła do przodu, pozostawiając wszędzie sierść...)
line:05164d7.Reimu:
line:05164d7.Marisa:
line:05164d7.Sakuya: (Kagerou skoczyła do przodu, pozostawiając wszędzie sierść... będzie
  to wymagało trochę czyszczenia.)
line:05164d7.Cirno: (Dostając przytulasa od Kagerou czuję się ciepła...)
line:05164d7.Koishi:
line:0361c5f: '[Niedostępne] Wszystkie możliwe eksponaty zostały zebrane.'
line:05b62f1: '[Wymiziaj] Zyskaj {0} <sprite="Point" name="Power">.'
line:0668b2a: '"Czy puszyste pieski nie są ostatnio niezwykle popularne? Powinnaś
  tak zostać~"'
line:0668b2a.Reimu: "\"Wybacz, ale śpieszę się!\"\n(Czy to samo dzieje się z Aunn podczas\
  \ pełni Księżyca?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Słodki puchaty wilkołak powiadasz... być może panna Remilia będzie
  inaczej spoglądać na wilkołaki dzięki tobie?"'
line:0668b2a.Cirno: '"Czy to nie jest czasami *ten* eksponat, co tam trzymasz? To ty jesteś
  złodziejką!"'
line:0668b2a.Koishi:
line:0d0e5fe: '"Jestem wilczycą a nie psem!"'
line:0d0e5fe.Reimu: '"Czy twój czas jest tyle wart?"'
line:0d0e5fe.Marisa:
line:0d0e5fe.Sakuya: '"Nie jestem zwierzęciem domowym!"'
line:0d0e5fe.Cirno: '"Najwyraźniej nie mogę polegać na bace..."'
line:0d0e5fe.Koishi:
line:035e5a2: '"Rany, przez Księżyc znowu staję się włochata..."'
line:02e376a: '"Ależ oczywiście!"'
line:02e376a.Reimu: '"Oczywiście! Incydent na taką skalę zostanie rozwiązany w trymiga."'
line:02e376a.Marisa: '"Więcej rzeczy mi nie zaszkodzi, więc z chęcią go przyjmę~"'
line:02e376a.Sakuya: '"Prosta sprawa. Z ochotą ci pomogę."'
line:02e376a.Cirno: '"Fajnie, jestem mistrzynią w zamrażaniu przebiegłych istot."'
