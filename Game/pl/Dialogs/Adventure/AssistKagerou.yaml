line:0d31645: '"Panno {0:v}, czy ten skarb co go znalazłam, pomoże ci szybciej rozwiązać
  incydent?"'
line:09559cc: '[Obiecaj pomóc] Zyskaj losowy eksponat. Dodaj |{0}| do biblioteki.'
line:0d416e0: '"Na ciebie zawsze mogę liczyć {0:g}. Moje plany urlopowe zostały uratowane!"'
line:05164d7: (Kagerou w radości rzuciła się na mnie... Jej liniejąca sierść jest
  wszędzie...)
line:05164d7.Reimu:
line:05164d7.Marisa:
line:05164d7.Sakuya: (Kagerou w radości rzuciła się na mnie, pozostawiając wszędzie
  sierść... Będę musiała to wyczyścić.)
line:05164d7.Cirno: (Dostałam przytulasa od Kagerou... Ona jest taka ciepła...)
line:05164d7.Koishi:
line:0361c5f: '[Niedostępne] Wszystkie możliwe eksponaty zostały już zebrane.'
line:05b62f1: '[Odmów] Zyskaj {0} <sprite="Point" name="Power">.'
line:0668b2a: '"Czy puszyste pieski nie są ostatnio w modzie? Lepiej żebyś taka została!"'
line:0668b2a.Reimu: "\"Wybacz, ale śpieszę się!\"\n(Czy to samo dzieje się z Aunn\
  \ podczas pełni Księżyca?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Słodki puchaty futrzak powiadasz... być może panna Remilia
  zmieni swoją opinię o wilkołakach?"'
line:0668b2a.Cirno: '"Czy nie trzymasz właśnie eksponatu z wystawy? To oznacza, że
  to ty jesteś złodziejką!"'
line:0668b2a.Koishi: '"Ten przedmiot pachnie jak dzika bestia. Nie chcę tego brać."'
line:0d0e5fe: '"Jestem wilczycą, a nie psem!"'
line:0d0e5fe.Reimu: '"Czy twój czas jest aż tyle wart?"'
line:0d0e5fe.Marisa:
line:0d0e5fe.Sakuya: '"Nie jestem zwierzęciem domowym!"'
line:0d0e5fe.Cirno: '"Najwyraźniej ta głuptaska nie jest godna zaufania..."'
line:0d0e5fe.Koishi: '"Przesadzasz! To nie będzie nieprzyjemnie pachnieć... chyba?"'
line:035e5a2: '"Tragedia! Przez Księżyc znowu staję się włochata..."'
line:02e376a: '"Ależ oczywiście!"'
line:02e376a.Reimu: '"Oczywiście! Incydent tego kalibru zostanie rozwiązany w mgnieniu
  oka."'
line:02e376a.Marisa: '"Jasne, im więcej przydatnych przedmiotów tym lepiej. Biorę!"'
line:02e376a.Sakuya: '"To błahostka. Chętnie pomogę."'
line:02e376a.Cirno: '"Ta jest! KOCHAM mrozić rzeczy, które się wyślizgują"'
