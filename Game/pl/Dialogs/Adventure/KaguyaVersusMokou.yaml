line:09d8d02: '[Kontynuuj]'
line:0bc6368: (Nie wiem, o co się kłócą, ale jeśli nie przestaną, to złodziej może
  skorzystać z zamieszania i uciec.)
line:008a9a4: '[Pomóż Kaguyi] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''%
  punktów''} życia i zyskaj eksponat: |{1}|.'
line:02e8c97: '"{Censor:select false=\"Proszę przestańcie walczyć! Słyszałam, że Nentendo
  ma grę strategiczną o ogniu!\" true=\"Proszę przestańcie walczyć! Małe biznesy takie
  jak Kourindou podupadną, jeśli nikt nie będzie już kupować płyt CD!\"}"'
line:02e8c97.Reimu:
line:02e8c97.Marisa: "\"{Censor:select false=\\\"Proszę przestańcie walczyć! 'Ultimate\
  \ Mariso: Galaxy' jest rewelacyjną grą!\\\" true=\\\"Przestańcie walczyć! Jeśli\
  \ cyfrowa dystrybucja zastąpi płyty, to od kogo będę pożyczać gry?\\\"}\""
line:02e8c97.Sakuya: "\"{Censor:select false=\\\"Przestańcie, proszę! Panna Remilia\
  \ lubi grać w 'Scarletvania: Symphony of the Devil' na tej konsoli!\\\" true=\\\"\
  Przestańcie, proszę! Jeśli teraz zagracie z panną Remilią, to możecie wygrać darmową\
  \ konsolę!\\\"}\""
line:02e8c97.Cirno:
line:02e8c97.Koishi:
line:0d3703c: '[Pomóż Mokou] Strać {0:plural one=''% punkt'' few=''% punkty'' many=''%
  punktów''} życia i zyskaj eksponat: |{1}|.'
line:0f73a43: '"{Censor:select false=\"Przestańcie walczyć! Słyszałam, że na technologii
  moneywersum można będzie dużo zarobić!\" true=\"Przestańcie walczyć! Rinnosuke nawet
  nie ma tylu płyt CD w kolekcji!\"}"'
line:0f73a43.Reimu:
line:0f73a43.Marisa: '"{Censor:select false=\"Proszę przestańcie walczyć! Słyszałam,
  że wszystko w moneywersum jest dobrem niewymiernym!\" true=\"Proszę przestańcie
  walczyć! Słyszałam, że wersje cyfrowe gier oferują wcześniejszy dostęp!\"}"'
line:0f73a43.Sakuya: "\"{Censor:select false=\\\"Przestańcie, proszę! Słyszałam, że\
  \ moneywersum może także wspierać tradycyjne wystawy!\\\" true=\\\"Przestańcie,\
  \ proszę! Segregowanie kaset jest strasznie uciążliwe!\\\"}\""
line:0f73a43.Cirno:
line:0f73a43.Koishi:
line:015db7a: '"Jeszcze wrócimy do tego tematu!"'
line:0c1db12: '"Wygląda na to, że {0} się ze mną zgadza. Skoro jesteśmy teraz w jednej
  drużynie, dam ci coś w ramach podziękowania."'
line:01185cd: '"Po prostu zostawię je samym sobie..."'
line:0460217: '[Kontynuuj]'
line:04ceb26: "\"{Censor:select false=\\\"Game Girl Advance to najlepsza przenośna\
  \ konsola! Nie pozwolę ci na szkalowanie Nentendo!\\\" true=\\\"Śmiesz nazywać się\
  \ prawdziwą gamerką, skoro nigdy nie miałaś ani jednego kartridża? Wracaj do książek\
  \ i nie niszcz naszej reputacji!\\\"}\""
line:06b80ce: "\"{Censor:select false=\\\"Firma która nie potrafi zrozumieć konceptu\
  \ metawersum jest tak samo żałosna jak twoja wystawa!\\\" true=\\\"Kto w dzisiejszych\
  \ czasach wypełnia dom po sufit łatwopalnymi przedmiotami? Ty i twoja wystawa zatrzymaliście\
  \ się w średniowieczu!\\\"}\""
line:07ab6fd: '{0} próbuje oddzielić walczące siłą. Po zablokowaniu kilku ciosów od
  Mokou, Kaguya stopniowo zaczęła przejmować inicjatywę.'
line:0921fbf: '"Przestań być taka wścibska, {0:v}."'
line:0219773: '"Panno {0:v}, proszę przyjmij to jako dowód mojej wdzięczności! Liczę,
  że uda ci się rozwiązać ten incydent."'
line:04fec24: '{0} próbuje oddzielić walczące siłą. W całym zamieszaniu Mokou stopniowo
  zaczyna zyskiwać przewagę.'
line:0db14e0: '[Odejdź] Nic się nie dzieje.'
line:0677c42: '"{Censor:select false=\"Tak? To czemu mnie pytałaś o te konsole na
  wystawie w sklepie Rinnosuke?''\" true=\"Tak? To w takim razie czemu pytałaś mnie,
  czy podobają mi się pudełka dla nowych gier?''\"}"'
line:0a72879: '"Ja po prostu chciałam zobaczyć czy ta twoja wystawa jest warta świeczki!
  Okazuje się, że była dokładnie tak słaba jak się spodziewałam!"'
