line:05575e9: '[Pomóż] Zyskaj kartę: |{0}|.'
line:09ee960: '"Co to własność intelektualna? Wiem tylko, że te drony są denerwujące."'
line:09ee960.Reimu:
line:09ee960.Marisa:
line:09ee960.Sakuya: '"Eksterminacja dronów jest prosta jak drut."'
line:09ee960.Cirno: '"Drony nie dają się zamrozić! Nienawidzę ich. Czas jest rozwalić!"'
line:09ee960.Koishi: '"Ta rzecz nazywa się dronem? W takim razie będę je niszczyć
  bez zahamowania."'
line:0ddd7b7: '[Kontynuuj]'
line:0b93b5a: '[Odmów] Zyskaj trzy losowe karty Narzędzi i kartę Nieszczęścia: |{0}|.'
line:0a26145: '"Czemu jakiś księżycowy królik miałby mi mówić, co mam robić? Czy muszę
  dać ci nauczkę?"'
line:0a26145.Reimu:
line:0a26145.Marisa:
line:0a26145.Sakuya: '"Nie jesteś w spółce z tymi telefonicznymi oszustami? Może powinnam
  cię teraz sprzątnąć?"'
line:0a26145.Cirno: '"Jestem najsilniejsza. Zamrożę cię, jeśli mi nie wierzysz."'
line:0a26145.Koishi: '"Brzmi to bardzo podejrzanie. Może powinnam zapytać siostrę
  o zdanie?"'
line:0b3160d: '"Nie nie nie, to lekkie nieporozumienie! Zapomnij o mnie. Ty tylko
  spotkałaś królika w drodze po kupno dango."'
line:06797b6: '"...Hmm? Królik z księżyca kupujący dango na Ziemi? Dziwne."'
line:0c1abfc: '"Łał! Kto zostawił tu te wszystkie gadżety?"'
line:095a793: '[Zignoruj] Nic się nie stanie.'
line:0e80e9a: '"Cześć {0:v}! Pewnie już natknęłaś się na drony kapp, co nie?'
line:00a9945: '"Te podróbki naruszają patent należący do Stolicy Księżycowej. Mam
  nadzieję, że pomożesz nam bronić naszej własności intelektualnej."'
line:0deca08: "\"Wielkie dzięki! Ta nowa broń przeciw dronom, zaprojektowana przez\
  \ Stolicę Księżycową, będzie pomocna.\"\n(Świetnie, już nie będę musiała chodzić\
  \ po okolicy i prowadzić testów!)"
line:080f7f2: Ringo wyjmuje jakieś dziwne narzędzie w kształcie patyka. Macha nim
  przed {0:i}, upuszczając kilka rzeczy i uciekając.
line:0e52736: '"Wasze księżycowe gierki zwiastują wyłącznie kłopoty. Nie zamierzam
  w nie wpadać."'
line:014c651: '"Rozumiem argument. Nie będę nalegać."'
line:0e52736.Marisa: '"To brzmi jak coś w kompetencjach Eiki. Idź do niej i zapytaj,
  co da się zrobić"'
line:0e52736.Koishi: '"Ja nie do końca rozumiem, czym jest wartość intelektualna i
  tym podobne. W sumie myślę, że nie chce wiedzieć."'
line:014c651.Koishi: '"Życzyłabym sobie łatwiejszych kontrahentów. Ciężko być sprzedawcą
  na pierwszej linii frontu..."'
line:0e52736.Sakuya: '"Nie będę niczego podpisywała, przed dokładnym przeczytaniem
  drobnego druczku. Do zobaczenia."'
line:0e52736.Cirno: '"Ech... Od ściany słów na tym świstku dostałam zawrotów głowy."'
line:014c651.Marisa: '"Jeśli yama może rozwiązywać sprawy praw autorskich, to może
  da radę z sporami pracowniczymi królików księżycowych."'
line:014c651.Sakuya: '"Nie ma tutaj żadnego małego druczku... Zaczekaj, daj mi to
  przeczytać."'
line:014c651.Cirno: '"Chyba za dużo oczekuję od wróżki."'
