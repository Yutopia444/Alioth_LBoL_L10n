line:0603ab0: '"Ty również jesteś zaangażowana w poszukiwanie sprawcy, nieprawdaż?"'
line:0c6dafc: '"Jeśli tylko o to poprosisz, to z wielką chęcią użyczę ci swojej mocy!"'
line:0aa0a2f: '[Zgódź się] Podmień podstawowe karty Ataku na |Diabelskie Ataki|. Strać
  eksponat: |{0}|.'
line:0855034: '[Niedostępne] Wymaga eksponatu: |{0}|.'
line:0ce8472: '"Oh? Zgadzasz się na to, {0:v}? Myślałam, że po prostu żartowałaś."'
line:0325ae0: '{0} czuje się rozgorączkowana i impulsywna.'
line:00c808f: '"Użyj mojej niezrównanej mocy, jak ci się żywnie podoba!"'
line:0bdb099: '[Kontynuuj]'
line:06f2511: '{0}'
line:09c5eaa: '"Wyśmienicie. Jesteś wyjątkowo troskliwa, {0:v}."'
line:0ee5ddb: "\"Tylko nie zakładaj go, póki nie wrócę do domu.\"\n(Dla powodzenia\
  \ zadania, dam jej to co chce.)"
line:061d426: '"Bardzo miło z twojej strony! Właśnie czegoś takiego szukałam."'
line:0bd042a: '[Kontynuuj]'
line:0ab3c60: '"Skończ z tym, panno Remilio. Powinnaś wrócić do posiadłości zanim
  wyjdzie słońce."'
line:0d8c336: '{0} nie chce się stać sługusem diabła.'
line:0e5ffc6: '"Hmph!"'
line:0b0f1b1: '[Poproś] Podmień podstawowe karty Ataku na |Diabelskie Ataki|. Zyskaj
  kartę Nieszczęścia: |{0}|.'
line:0e73ca1: '"Ta zadanie jest trudniejsze, niż się spodziewałam. Pamiętaj, aby mnie
  przywrócić do normalności, gdy wrócę do domu."'
line:014dfb8: '[Odejdź] Nic się nie dzieje.'
line:0a5c6bd: '"Wampirza kapłanka? Nie jestem zainteresowana takim miksem."'
line:02764e6: '"Wampirza wróżka? Byłoby źle, gdyby to nie było najsilniejsze."'
line:0538fce: '"Bycie wampirem? Nie wydaje mi się, żeby krew była taka dobra."'
line:0860fd7: '"Wampirza czarownica? Ta kombinacja jest nieco zbyt kliszowata."'
