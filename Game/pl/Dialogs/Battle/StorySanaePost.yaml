line:07de4c3: Koniec zabawy. To już czas byś się przyznała, racja?
line:00850b4: Nie widzisz pełnego obrazu sytuacji {0}. Radar, który ci dałam namierzył
  już prawdziwego sprawcę.
line:0ef03b9: '{0}? To tak przewidywalne, że domyśliłam się już wieki temu.'
line:0e4c109: Niech to! Jeszcze jedna tura i mogłabym zagrać "Emr*kul, rozdartych
  eonów"!
line:0f042cd: To na prawdę nie byłam ja. Ja tylko chciałam zorganizować sobie kompanów
  do nocnej sesji w gry karciane.
line:0e4760b: Ale klejnoty na pewno pojawiły się w okolicy Jeziora Boga Wiatru! Musiałam
  pominąć jakąś ważną poszlakę.
line:0bd9337: '|{1}| na |{0}| przeszkodziły |{2}| w poszukiwaniach. Nie udało się
  odnaleźć prawdziwego sprawcy!'
line:00c39ca: '{0} nie znalazła przedmiotów koniecznych do odnalezienia prawdziwego
