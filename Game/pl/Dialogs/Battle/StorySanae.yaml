line:0068a0e: Trop, który poprowadził mnie prosto do ciebie.
line:0d8bd8d: O czym ty mówisz? Byłam jedynie gościem na wystawie!
line:05f9530: W końcu dotarłam do youkai'owej świątyni na szczycie góry.
line:09f307c: Co przypędziło cię tu w środku nocy? Sprawdzasz jakiś trop, {0:v}?
line:0f3c994: Później wszyscy oszaleli na punkcie tej nowej gry karcianej i tak się
  składa, że wiem jakie karty są najmocniejsze.
line:010c359: Jeżeli zamierzasz kooperować, to chętnie spuszczę ci łomot kilkoma mocnymi
  kartami.
