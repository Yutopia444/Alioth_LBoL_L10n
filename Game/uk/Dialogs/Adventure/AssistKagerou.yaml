line:035e5a2: '"Йойки, знову Місяць робить мене кудлатою..."'
line:0d31645: '"Пані {0:v}, чи допоможе вам скарб, що я знайшла, вирішити цей інцидент
  швидше?"'
line:09559cc: '[Так, Пухнастику] Отримуєш випадковий Експонат. Додає |{0}| до бібліотеки.'
line:05164d7: (Каґеро міцно-міцно мене обійняла, тепер її шерсть у мене повсюди...)
line:05164d7.Reimu:
line:05164d7.Marisa:
line:05164d7.Sakuya: (Каґеро міцно-міцно мене обійняла та залишила по собі купу шерсті...
  Доведеться почиститись.)
line:05164d7.Cirno: (Обійми від Каґеро такі тепленькі...)
line:05164d7.Koishi:
line:05b62f1: '[Ні, Пухнастику] Отримуєш {0} <sprite="Point" name="Power">.'
line:0668b2a: '"Хіба пухнасті песики не найпопулярніші нині? Тобі б так й залишитись~"'
line:0668b2a.Reimu: "\"Звиняй, треба бігти!\"\n(Невже те ж саме відбувається з Аун в повний\
  \ Місяць?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Милий та пухнастий перевертень кажеш... можливо навіть пані Ремілії
  ти прийдеш до вподоби."'
line:0668b2a.Cirno: '"А ти часом ото не експонат в руках маєш? Злодюжка!"'
line:0668b2a.Koishi:
line:0d0e5fe: '"Я вовк, а не песик!"'
line:0d0e5fe.Reimu: '"Он виходить наскільки цінний твій час!"'
line:0d0e5fe.Marisa:
line:0d0e5fe.Sakuya: '"Я не домашня тваринка!"'
line:0d0e5fe.Cirno: '"Здається мені не варто розраховувати на дурбецало..."'
line:0d0e5fe.Koishi:
line:0d416e0: '"Як й очікувалось від {0:g}, мої плани на подорожі знову на плаву!"'
line:0361c5f: '[Недійсне] Усі доступні Експонати вже отримано.'
line:02e376a: '"Звичайно!"'
line:02e376a.Reimu: '"Звичайно! Настільки простий інцидент вирішиться у мить ока."'
line:02e376a.Marisa: '"Мати більше предметів аж ніяк не нашкодить, з радістю його прийму~"'
line:02e376a.Sakuya: '"Простіш-простого, рада буду допомогти."'
line:02e376a.Cirno: '"Файно, я тепер вмітиму заморожувати слизьких істот!"'
line:02e376a.Koishi:
