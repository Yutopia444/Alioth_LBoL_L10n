line:0b4215c: '"Яка потужна життєва сила... Я нарешті спромоглась дістатись останнього
  кроку становлення справжнім богом!"'
line:0122dcf: '[Отримати Просвітлення] Покращує карту.'
line:0f513e5: '"Ее... поділишся силою?"'
line:0f513e5.Reimu:
line:0f513e5.Marisa:
line:0f513e5.Sakuya:
line:0f513e5.Cirno: '"Агов! Нумо ділись силами з великою Феєю Повелителькою Криги!"'
line:0f513e5.Koishi:
line:042c6e3: '"Звичайно~ Ось тобі мій Святий Пилок Метелика!"'
line:042c6e3.Reimu:
line:042c6e3.Marisa:
line:042c6e3.Sakuya:
line:042c6e3.Cirno: '"Гаразд! Забирай цей Божественний Пилок й зроби фей найсильнішими знову!"'
line:042c6e3.Koishi:
line:092d6b0: Вибери карту аби Покращити
line:0663fce: "[Отримати Забуття] Втрачаєш {0} здоров'я та усуваєш карту з бібліотеки."
line:070b7de: '"Хух... а можеш трохи мені зняти стресу?"'
line:070b7de.Reimu:
line:070b7de.Marisa:
line:070b7de.Sakuya:
line:070b7de.Cirno: "\"Та не треба, хіба не пам'ятаєш легенду усіх легенд що поборола ту\
  \ дивачку в інвалідному візку?\""
line:070b7de.Koishi:
line:04e7441: '"Звичайно~ Ось тобі мій Святий Пилок Метелика!"'
line:04e7441.Reimu:
line:04e7441.Marisa:
line:04e7441.Sakuya:
line:04e7441.Cirno: "\"Я не хочу того пам'ятати! Й чому тобі також про те не забути, дурепо!\""
line:04e7441.Koishi:
line:0cb3009: Усунь карту з бібліотеки.
line:0122e22: '"Ну... будь-що згодиться напевне?"'
line:0122e22.Reimu:
line:0122e22.Marisa:
line:0122e22.Sakuya:
line:0122e22.Cirno: '"Божественність? Морозити жаб набагато веселіше…"'
line:0122e22.Koishi:
line:00eb35b: Трансформуй карту в Незвичайну карту
line:0e35dc4: '"Підходь й отримаєш благословіння Богині Літніх Ночей, {0:v}!"'
line:0c5e0c4: Крила Етьорніті випускають пилок з дивним запахом… даючи {0:d} певної
  "сили"…
line:04ad2ac: Пилок з дивним запахом розвіявся з крил Етьорніті… {0:d} запаморочилось
  в голові…
line:0786492: "[Отримати Переміни] Втрачаєш {0} здоров'я та вибираєш карту в бібліотеці\
  \ аби перетворити її у Незвичайну карту."
line:01a7f1c: '"Звичайно~ Ось тобі мій Святий Пилок Метелика!"'
line:01a7f1c.Reimu:
line:01a7f1c.Marisa:
line:01a7f1c.Sakuya:
line:01a7f1c.Cirno: '"Правда? А я вважаю веселішим розсипати усюди пилок й споглядати як
  усі чхають."'
line:01a7f1c.Koishi:
line:0c16a46: Крила Етьорніті розсіюють надзвичайно смердючий пилок… {0} непритомніє
  від запаху…
