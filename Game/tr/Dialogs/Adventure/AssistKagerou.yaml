line:035e5a2: '"Tanrı aşkına, Ay yine saçımı çok tüylendiriyor."'
line:0d31645: '"{0} Hanım, bulduğum bu hazine bu olayı daha hızlı çözmene yardımcı
  olacak mı?"'
line:0668b2a: '"Şu sıralar tüylü köpekler bayağı popüler değil mi? Bu şekilde kalmalısın~"'
line:0668b2a.Reimu: "\"Üzgünüm, kaçmam lazım!\"\n(Aynı şey dolunay olduğunda Aunn'ada mı\
  \ yaşanıyor?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Şirin bir tane kurt insanı mı diyorsun... belki bunun yüzünden hanımım
  kurt insanlarını başka bir göz açısından görür."'
line:0668b2a.Cirno:
line:0668b2a.Koishi:
line:0d416e0: '"{0:sd} beklediğim gibi, seyahat planlarım tekrardan yoluna gelecek!"'
