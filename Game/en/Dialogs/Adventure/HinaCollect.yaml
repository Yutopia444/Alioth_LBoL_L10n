"line:017720c": '"Ah, you seem to have a lot of misfortune on you, Miss {0}."'
"line:0183740": '"Let me bear this misfortune for you."'
"line:02dcea4": "[Accept Help] Remove all |Misfortune| cards."
"line:06b252f": '{0} feels all her misfortune fading away.'
"line:076f484": '"Thank you, Hina."'
"line:076f484.Reimu": '"Thank goodness, today has been bad enough already."'
"line:076f484.Marisa": "\"Guess I can't take these souvenirs home with me...\""
"line:076f484.Sakuya": '"You cleaned up pretty well, Hina."'
"line:076f484.Cirno": '"It feels as refreshing as eating a cold slice of watermelon."'
"line:076f484.Koishi": '"It feels so much fresher now."'
"line:0a76aa4": '[Leave] Nothing happens.'
"line:09f1923": '"As wary as ever, huh? I have nothing but pure intentions."'

line:0d580ed: "\"It may be misfortune, but it's also part of my collection...\""
line:00dc670: '[Embrace Her] Gain a random |Misfortune|.'
line:037bd0d: "\"No, this time I'll bear it for you.\""
line:037bd0d.Reimu: "\"Warding off disasters and banishing evil is also part of a shrine\
  \ maiden's duties.\""
line:037bd0d.Marisa: "\"I'm not picky about looks, you know.\""
line:037bd0d.Sakuya: '"Milady... should be interested in this, too."'
line:037bd0d.Cirno: "\"No problem, leave it to me! I'll freeze all the misfortunes!\""
line:037bd0d.Koishi: '"So this is what it feels like to collect misfortunes."'
