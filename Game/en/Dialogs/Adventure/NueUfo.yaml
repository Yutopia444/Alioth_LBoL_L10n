line:00848b0: "\"You're looking at the real me right now. I just escaped from the\
  \ Matrix.\""
line:0b3c24c: "\"What's the difference from here?\""
line:0b8ee98: '"Nah, you can have them as a keepsake."'
line:02d45a7: '"This looks brand new..."'
line:07ebb66: "\"I've had my fill of aliens at Eientei.\""
line:0782c18: "\"Nah, I'm talking about the kind kept hidden by men in black.\""
line:06ae443: "\"Hehe, since you're so interested in extraterrestrial life, you can\
  \ have my UFOs! Take one!\""
line:02b9647: "\"If you don't need them anymore, you can sell them to someone else.\""
