Penglai:
  Name: Кукла Хорай
  Description: '|Пассив|: Когда {PlayerName} заканчивает ход, {SelfName} увеличивает
    свой урон на {Value1}.

    |Применение|: Наносит {Damage} урона. Даёт {Mana}. {SelfName} выходит.

    |Выход|: Активирует эффект Применение на враге с наименьшим здоровьем.'
  Brief: "Нанести {Damage} урона. Даёт {Mana}.\nКаждый ход увеличивает урон на {Value1}."
