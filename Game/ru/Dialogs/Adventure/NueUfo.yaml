line:0b3c24c: '"Не понимаю, в чём разница?"'
line:02e269d: '[Физическая версия] Потерять {0} <sprite="Point" name="Power">, получить
  Экспонат: |Набор НЛО|.'
line:02b9647: '(Если тебе они больше не нужны, то можешь продать их кому-либо ещё.)'
line:00848b0: '"Прямо сейчас ты видишь настоящую меня. Я только что сбежала из Матрицы!"'
line:00f952e: '"Я слышала о чудаках из Внешнего мира, что похожи на тебя. Они думают,
  что весь мир - это симуляция."'
line:06ae443: '"Хе-хе, коли ты так заинтересована во внеземной жизни, то можешь взять
  у меня НЛО! Вот, выбери!"'
line:0b8ee98: '"Оставлю их себе на память и поставлю на полку дома."'
line:02c3f5f: '[Цифровая версия] Потерять {0} максимума здоровья, получить Экспонат:
  |Цифровой НЛО|.'
line:02d45a7: '"Выглядит совсем новеньким..."'
line:095b051: '[Уйти] Ничего не произойдёт.'
line:07ebb66: '"Мне и так хватило общения с инопланетянами в Эйентэе."'
line:0782c18: '"Не, гуманоиды не в счёт. Я же говорю про те виды, что требуют захвата
  людьми в чёрном, если понимаешь меня."'
line:0ffebf0: '"Никогда не переставай интересоваться неизведанным."'
line:0830dc8: Похоже, этот НЛО обладает эффектом поглощения окружающей энергии.
line:037b17c: "{0} чувствует головокружение.\nОна совершила краткое путешествие в\
  \ цифровой мир, хотя теперь совершенно не помнит этого."
