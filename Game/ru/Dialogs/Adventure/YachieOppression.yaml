line:0e2d8d9: '[Принять] Получить экспонат |{0}|.'
line:08457aa: '"Да, мэм! Обязательно сообщите мне, если произойдёт что-то интересное."'
line:04ee4ff: '"Нет нужды - я, {0}, никогда не прошу ничего взамен за доброе дело."'
line:01fd35f: '[Отказаться] Ничего не произойдёт.'
line:09e89c0: '[Отказаться] Несчастье: |{0}|.'
line:0f208e0: '"Народы этих земель рассчитывают на тебя. Разумно ли отворачиваться
