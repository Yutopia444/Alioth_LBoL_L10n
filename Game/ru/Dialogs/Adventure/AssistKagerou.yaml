line:0361c5f: '[Недоступно] Все подходящие экспонаты уже получены.'
line:035e5a2: '"Из-за аномальной фазы луны моё тело снова становится пушистым..."'
line:09559cc: '[''Нет'' пушистости] Получить случайный |Экспонат|. Добавить карту
  |{0}| в колоду.'
line:0d31645: '"Эй, {0}, может ли найденное мной сокровище помочь тебе быстрее решить
  инцидент?"'
line:0d416e0: '"Как и ожидалось от {0:g}, ты спасла мои планы на путешествие!"'
line:05b62f1: '[''Да'' пушистости] Получить {0} <sprite="Point" name="Power">.'
line:0d0e5fe: '"Я волк, а не собака!"'
line:0d0e5fe.Reimu: '"Неужели твоё время настолько бесценно?!"'
line:0d0e5fe.Marisa:
line:0d0e5fe.Sakuya: '"Я не питомец!"'
line:0d0e5fe.Cirno: '"Похоже, я не могу рассчитывать на дурочку..."'
line:0d0e5fe.Koishi: '"Это уже слишком! Вонять же не будет... Правда?"'
line:0668b2a: '"Разве пушистые девочки-собаки в наше время не считаются очень популярными?
  Давай оставим всё как есть~"'
line:0668b2a.Reimu: "\"Извини, я тороплюсь...\"\n(Интересно, а Аун в полнолуние тоже станет\
  \ такой?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Милый пушистый оборотень… Может быть, мнение госпожи об оборотнях
  изменится."'
line:0668b2a.Cirno: '"Разве это не из-за экспоната, который ты держишь в руках? Воровка!"'
line:0668b2a.Koishi: '"Пахнет животным. Мне больше не хочется держать это при себе."'
line:05164d7: (Кагэро крепко обняла меня, и вся её шерсть растёрлась об мою одежду...)
line:05164d7.Reimu:
line:05164d7.Marisa:
line:05164d7.Sakuya: (Кагэро крепко обняла меня, и вся шерсть растёрлась о мою одежду...
  Кажется, сначала мне придётся её почистить.)
line:05164d7.Cirno: (Кагэро крепко обняла меня - мне так жарко...)
line:05164d7.Koishi:
line:02e376a: '"Конечно!"'
line:02e376a.Reimu: '"Конечно! Инцидент такого масштаба будет решён в мгновение ока."'
line:02e376a.Marisa: '"Чем больше полезных вещей, тем лучше. Я с радостью приму его~"'
line:02e376a.Sakuya: '"Не вопрос. Я с удовольствием помогу."'
line:02e376a.Cirno: '"Конечно, я - мастер замораживать склизких созданий!"'
