line:008fa52: '"Ну же, давай поддержим Кагую-чан!"'
line:00d22b0: '[Уйти] Ничего не произойдёт.'
line:0fc2c16: "\"{Censor:select false=\\\"Э-э-э, 'Кагуя-чан'? Какая же мерзость.\\\
  \" true=\\\"Ух, твой внешний вид и так был странен — давай забудем про это.\\\"\
  }\""
line:0fc2c16.Reimu:
line:0fc2c16.Marisa:
line:0fc2c16.Sakuya: '"Даже для тряпки выглядит довольно паршиво."'
line:0fc2c16.Cirno: '"Лёд растает быстрее, если я буду носить чёрное..."'
line:0fc2c16.Koishi: '"Воу~ Как же~ это~ не мило!"'
line:0670be2: '"Носи её почаще! Все должны видеть!"'
line:063a72b: '"Я провела расследование и выяснила, что Кагуя-чан особенная. Она очень
  гостеприимна и сильно отличается от других лунян."'
line:0ba9037: '"Бесплатно? Тогда давай"'
line:0ba9037.Reimu:
line:0ba9037.Marisa: '"Бесплатно? То есть, я могу одолжить это и не возвращать, верно?"'
line:0ba9037.Sakuya: '"Бесплатно, говоришь? Что же, в этот раз сувенир для Госпожи будет
  уникальным."'
line:0ba9037.Cirno: '"Вещи, созданные для самых сильных, должны быть бесплатными."'
line:0ba9037.Koishi: '"Бесплатно, значит? Что же, попробую одеть в это сестрёнку."'
line:0678716: '[Взять одежду] Получить экспонат: |Айдол футболка|.'
line:01566ec: '[Взять размер побольше] Получить экспонат: |Айдол футболка (XL)|.'
line:059fbd3: '"Бесплатно? Тогда давай. И размер побольше."'
line:059fbd3.Reimu:
line:059fbd3.Marisa: '"Прекрасная возможность - давай мне большую!"'
line:059fbd3.Sakuya: '"Я куплю это в качестве сувенира для Мэйлин. Тогда дайте мне, пожалуйста,
  большую."'
line:059fbd3.Cirno: '"Конечно же, я возьму большую!"'
line:059fbd3.Koishi: '"Хорошо, я возьму большую! Выглядит замечательно!"'
line:0ba87b6: '"Носи её почаще! Все должны видеть!"'
