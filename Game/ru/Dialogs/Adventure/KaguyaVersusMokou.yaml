line:04ceb26: '"Хотя у тебя нет физической формы, ты смеешь называть себя любителем видеоигр! Я не позволю такому книжному червю-зануде порочить гордое звание геймера!"'
line:0219773: '"{0} - прими это, пожалуйста, в качестве моей благодарности! Я рассчитываю на тебя в разрешении этого инцидента."'
line:06b80ce: '"Кто в наши дни стал бы хранить у себя такой хлам? Кто-то не может идти в ногу со временем, что и так было видно по выставке!"'
line:04fec24: '{0} попыталась применить грубую силу, чтобы разделить их, и в этом хаосе Моко постепенно взяла верх.'
line:0c1db12: '"Похоже, {0} тоже так думает. Как своему человеку, я подарю тебе этот сувенир - в знак благодарности."'
line:0677c42: '"Сейчас говоришь вот так, но почему в тот раз ты пришла ко мне и спросила о том, интересны ли картинки на упаковках свежих дисков?"'
line:0bc6368: (Я не понимаю из-за чего они дерутся, но если позволить им продолжать всё крушить, то укравшие Хорайскую ветвь могут воспользоваться хаосом, чтобы сбежать.)
line:008a9a4: '[Помочь Кагуе] Потерять {0} здоровья. Получить экспонат |{1}|.'
line:02e8c97: '"Прекратите драться! Если никто не будет покупать физические копии, то продавцов, вроде Ринносукэ, ждёт разорение!"'
line:02e8c97.Reimu:
line:02e8c97.Marisa: '"Прекратите драться! Я вот не могу позаимствовать игру из чужого дома, если она не на физическом носителе! Будь проклята цифровая дистрибуция!"'
line:02e8c97.Sakuya: '"Пожалуйста, остановитесь, вы обе! У моей госпожи есть большие запасы этих игровых консолей!"'
line:02e8c97.Cirno:
line:02e8c97.Koishi:
line:07ab6fd: '{0} попыталась разделить их грубой силой. Заблокировав несколько ударов Моко, Кагуя постепенно взяла верх.'
line:0921fbf: '"Тс-с, хватит шуметь, {0}"'
line:09d8d02: '[Продолжить]'
line:0d3703c: '[Помочь Моко] Потерять {0} здоровья. Получить экспонат |{1}|.'
line:0f73a43: '"Прекратите драться! Я слышала, что у Ринносукэ так и не вышло заполнить стеллаж дисками с играми!"'
line:0f73a43.Reimu:
line:0f73a43.Marisa: '"Прекратите драться! Я слышала, что при покупке цифрового издания можно получить ранний доступ!"'
line:0f73a43.Sakuya: '"Пожалуйста, остановитесь, вы обе! Я думаю, что хранить и систематизировать книги - тоже достойное дело!"'
line:0f73a43.Cirno:
line:0f73a43.Koishi:
line:015db7a: '"Хм, это ещё не конец!"'
line:0460217: '[Продолжить]'
line:0db14e0: '[Пройти мимо] Ничего не произойдёт.'
line:0a72879: '"Я просто пришла посмотреть, так ли хороша ваша выставка, как вы утверждаете! Оказалось, что всё так же плохо, как я себе и представляла!"'
line:01185cd: '"Я просто оставлю их здесь..."'
