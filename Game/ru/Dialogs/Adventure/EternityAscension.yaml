line:00eb35b: Выберите карту из колоды и поменяйте её на редкую карту.
line:0122dcf: '[Дар просвещения] Улучшить карту.'
line:0f513e5: '"Эм… можешь дать мне немного силы?"'
line:0f513e5.Reimu:
line:0f513e5.Marisa: '"А? Ты позволишь мне воспользоваться своей силой?"'
line:0f513e5.Sakuya: '"Ох, в таком случае... Я возьму это."'
line:0f513e5.Cirno: '"Эй! Поделись своей силой со мной, феей мороза!"'
line:0f513e5.Koishi: '"Ась?! Ты хочешь поделиться со мной?"'
line:042c6e3: '"Хорошо. Прими мой Святой Чешуйчатый Порошок!"'
line:042c6e3.Reimu:
line:042c6e3.Marisa:
line:042c6e3.Sakuya:
line:042c6e3.Cirno: '"Хорошо. Прими мой Святой Чешуйчатый Порошок и приведи народ фей к
  победе!"'
line:042c6e3.Koishi:
line:0663fce: '[Дар забвения] Потерять {0} здоровья. Удалить карту из колоды.'
line:070b7de: '"Ух... ты можешь снять мой стресс?"'
line:070b7de.Reimu:
line:070b7de.Marisa:
line:070b7de.Sakuya:
line:070b7de.Cirno: '"Мне это не нужно - ты же помнишь, как я победила ту чудачку в кресле?"'
line:070b7de.Koishi:
line:04e7441: '"Хорошо. Узри мой Святой Чешуйчатый Порошок!"'
line:04e7441.Reimu:
line:04e7441.Marisa:
line:04e7441.Sakuya:
line:04e7441.Cirno: '"Я не хочу этого забывать! Почему бы тебе самой не забыть про это,
  дурочка?"'
line:04e7441.Koishi:
line:0cb3009: Удалите карту из колоды.
line:0122e22: '"Эм... мне любая помощь пригодится, я полагаю?"'
line:0122e22.Reimu:
line:0122e22.Marisa:
line:0122e22.Sakuya:
line:0122e22.Cirno: '"Вознестись? Это звучит не так круто, как замораживание лягушек..."'
line:0122e22.Koishi:
line:01a7f1c: '"Хорошо. Узри мой Святой Чешуйчатый Порошок!"'
line:01a7f1c.Reimu:
line:01a7f1c.Marisa:
line:01a7f1c.Sakuya:
line:01a7f1c.Cirno: '"Правда? Думаю, было бы веселее разбросать пыльцу и смотреть, как люди
  чихают."'
line:01a7f1c.Koishi:
line:0c16a46: Из-под крыльев Этернити вылетает чрезвычайно дурно пахнущий чешуйчатый
  порошок... {0} теряет сознание от запаха…
line:0b4215c: '"Такая мощная жизненная сила... Я наконец-то прошла последний шаг вознесения!"'
line:0e35dc4: '"Подойди и получи благословение Богини вечной ночи, {0}!"'
