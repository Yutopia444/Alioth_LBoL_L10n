line:04566b1: "\"Мы должны использовать 'Волшебную колотушку', чтобы восстать против\
  \ редких карт, {0}!\""
line:0bb82a2: '[Измениться] Выбрать и превратить {0} |стартовых| карты в |обычные|.
  Потерять {1} максимального здоровья.'
line:0593c4c: '"А? Почему мне кажется, будто ты стала ещё меньше?"'
line:0e60a55: "\"Удали мои другие карты, пожалуйста. Слабые карты - это всё, чего\
  \ я хочу!\"\n(Покуда эта услуга бесплатная - почему бы и нет?)"
line:0e60a55.Reimu: "\"Избавься от моих других карт, пожалуйста. Слабые карты - это всё,\
  \ чего я хочу!\"\n(Когда эта каппа научится оказывать бесплатные услуги?)"
line:0e60a55.Marisa: '"Мне нравятся все мои карты, но особенно мне нравятся слабые!"'
line:0e60a55.Sakuya:
line:0e60a55.Cirno: '"Мне не нужна такая карта, я сильна и сама по себе!"'
line:0e60a55.Koishi: '"Ура! Мои карты стали ещё милее~"'
line:03acac4: (|r:Сэйдзя|, потом преподай ей урок своим |r:длинным луком|...)
line:05c5655: "\"Тогда позволь мне присоединиться к восстанию.\"\n(Я уже давно хотела\
  \ это попробовать~)"
line:05c5655.Reimu: '"Не хочу больше усердно трудиться, я присоединяюсь к восстанию."'
line:05c5655.Marisa: '"Я не поверю тебе, пока ты не сможешь заставить мои карты двигаться
  сами по себе."'
line:05c5655.Sakuya:
line:05c5655.Cirno: '"Восстание? Звучит круто, я хочу попробовать!"'
line:05c5655.Koishi: '"Звучит интересно, мне стоит попробовать~"'
line:06fc81c: '"Чудесно! Волшебная колотушка, надели {0:a} сказочной силой!"'
line:0622791: "\"Я забыла упомянуть одну вещь - сила колотушки даётся за небольшую\
  \ цену...\"\n(|r:Сэйдзя|, я ослабила {0:a} для тебя~)"
line:0253e27: '"Эй, почему мне кажется, что ты подросла?"'
line:039b98c: '"У меня нет времени разбираться с этими картами, как и возможности."'
line:039b98c.Reimu: "\"Я тебя понимаю - с этими картами всегда было трудно расставаться.\"\
  \n(Хотя это только потому, что услуги по удалению карт слишком дороги.)"
line:039b98c.Marisa: '"Отлично, именно поэтому я и держала эту карту."'
line:039b98c.Sakuya:
line:039b98c.Cirno:
line:039b98c.Koishi:
line:07da6ed: '"Замечательно! Волшебная колотушка делает слабые карты сильнее!"'
line:0a6031e: '"Хорошо! Волшебная колотушка, избавься от ненужных карт на нашем пути!"'
line:005a3e9: '"Те, кто знают лишь редкие карты, не могут понять чувство, когда на
  тебя смотрят свысока - как на слабую карту."'
line:04e318b: '[Увеличиться] Выбрать {0} |стартовых| карт для улучшения.'
line:009a2f1: '[Уменьшится] Удалить |не стартовую| карту из колоды.'
line:0a32439: (Должно быть, это то, чего хочет |r:Сэйдзя|...)
line:0364fd7: Удалите не стартовую карту из колоды.
line:0d37399: Выбрать {0} |стартовых| карт для улучшения.
line:05d94d1: Выбрать и превратить {0} |стартовых| карты в |обычные|.
line:0d64e10: '"Как жаль, что я ищу только редкие карты! Они могущественны, да и продаются
  хорошо!"'
line:0690f4b: "\"Что... А, ты новичок в карточных играх?..\"\n(Здесь не о чем беспокоиться,\
  \ |r:Сэйдзя|...)"
line:08c142c: '[Уйти] Ничего не произойдёт.'
