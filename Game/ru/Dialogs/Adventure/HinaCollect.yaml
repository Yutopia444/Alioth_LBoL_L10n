line:0183740: '"Позволь мне нести эти несчастья за тебя."'
line:06b252f: '{0} почувствовала, что несчастья, опутывающие её, были сметены прочь.'
line:076f484: '"Спасибо тебе, Хина."'
line:076f484.Reimu: '"Слава богу, сегодняшний день был уже достаточно скверным."'
line:076f484.Marisa: '"Похоже, я не смогу забрать эти сувениры домой..."'
line:076f484.Sakuya: '"А ты хороша в очищении, Хина."'
line:076f484.Cirno: '"Так же освежающе, как холодный кусок арбуза."'
line:076f484.Koishi: '"Теперь я чувствую себя свежо."'
line:09f1923: '"Как всегда настороже - я же, очевидно, желаю тебе добра."'
line:0d580ed: '"Может, это и несчастье - но оно всё ещё часть моей коллекции..."'
line:02dcea4: '[Согласиться] Удалить все |Несчастья|.'
line:0a76aa4: '[Уйти] Ничего не произойдёт.'
line:017720c: '"Ой-ой, {0} выглядит так, как будто у неё много несчастий сегодня."'
line:037bd0d: «Нет... В этот раз я заберу одно у тебя.»
line:037bd0d.Reimu: '"Отгон бед и уничтожение зла - тоже обязанности жрицы храма."'
line:037bd0d.Marisa: '"Я не притязательна к внешнему виду, знаете ли."'
line:037bd0d.Sakuya: '"Госпожа... в таком тоже заинтересована."'
line:037bd0d.Cirno: '"Без проблем, оставь это мне! Я заморожу любые несчастья!"'
line:037bd0d.Koishi: '"Так вот каково это - собирать несчастья."'
line:00dc670: '[Обнять Хину] Получить случайное |Несчастье|.'
