line:00848b0: "\"Người đang đứng trước mặt các bạn chính là tôi, người vừa thoát khỏi\
  \ 'Ma trận'.\""
line:00f952e: '"Tôi đã nghe kể ngoài đời có rất nhiều người kỳ lạ như cô, nghĩ thế
  giới thực chỉ là được mô phỏng."'
line:0b3c24c: '"Sự khác biệt giữa chuyện đó và bình thường ở đâu?"'
line:06ae443: '"He he, để thỏa mãn sự tò mò của mọi người về sự sống ngoài hành tinh,
  chúng tôi đang tổ chức chương trình tặng UFO! Hãy chọn một cái!"'
line:02e269d: '[Bản Vật Lý] Nhận |Bộ UFO|'
line:02b9647: (Nếu mình không cần nó nữa, mình có thể bán lại cho người khác.)
line:0b8ee98: '"Nhớ trân trọng nó đấy nhé."'
line:02c3f5f: '[Bản Điện Tử] Nhận |UFO Điện Tử|'
line:02d45a7: '"Trông nó mới cứng vậy"'
line:095b051: '[Rời Đi] Không có chuyện gì xảy ra'
line:07ebb66: '"Ở Vĩnh Viễn Đình có nhiều người ngoài hành tinh lắm, muốn xem thì
  cứ ra đó ngắm thỏa thích."'
line:0782c18: "\"Trông giống hệt người Trái Đất thì không tính. \nPhải là kiểu mà\
  \ mẫy gã mặc áo đen sẽ bắt giữ, cô hiểu chứ.\""
line:0ffebf0: '"Hãy luôn giữ sự tò mò về những điều cô chưa biết."'
