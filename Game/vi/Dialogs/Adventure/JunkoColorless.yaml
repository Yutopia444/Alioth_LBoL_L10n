line:04e31e3: '[Từ Chối] Không có chuyện gì xảy ra'
line:00b8f03: '"Không phải việc của cô."'
line:00b8f03.Marisa: '"Không, còn lâu tôi mới từ bỏ bất cứ chút mana nào."'
line:00b8f03.Sakuya: '"Tôi đã có đủ mana vô sắc rồi. Xin thứ lỗi."'
line:00b8f03.Cirno: '"Nghe có vẻ thật phức tạp, thật rắc rối, thôi kệ đi vậy."'
line:00b8f03.Koishi: "\"Chị tôi đã bảo tôi là 'ngây thơ' đủ nhiều rồi.\""
