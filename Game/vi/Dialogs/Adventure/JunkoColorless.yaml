line:0252f89: '"Cách sử dụng mana của cô vẫn còn thiếu hiệu quả lắm."'
line:0632b2f: '"Hãy để ta với sức mạnh thanh lọc này hỗ trợ cô trong việc kiểm soát
  chúng."'
line:0833aaf: Chọn một mana trong kho mana để chuyển thành hai mana không màu.
