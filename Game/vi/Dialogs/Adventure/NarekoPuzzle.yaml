line:05d6c36: '"Thật tốt quá, cuối cùng cũng có người để thử thách rồi."'
line:039c5a0: '"Cứ đố về nhân sư mãi cũng thật nhàm chán, tôi đã bổ sung kho câu hỏi
  về bảy kỳ quan thế giới rồi!"'
