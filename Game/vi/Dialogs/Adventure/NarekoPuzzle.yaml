line:0a2f677: '"Quả là tri kỷ khó tìm, tôi cũng rất hứng thú với mấy thứ này."'
line:0a40ad6: '"Tôi khá hiểu biết về các kim tự tháp đấy."'
line:0ab6f07: '"Đố xong nhanh lên để tôi còn đi tìm kho báu."'
line:036656a: '"Dẹt dẹt, sai rồi!"'
line:0724321: '"Chính xác! Không ngờ cô {0} lại hiểu biết về các kim tự tháp đến vậy
