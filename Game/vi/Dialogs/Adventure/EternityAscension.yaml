line:0122dcf: '[Nhận Sự Khai Sáng] Nâng Cấp một lá bài'
line:042c6e3: '"Được chứ~ Hãy chiêm ngưỡng Bột Vảy Thần của ta!"'
line:042c6e3.Reimu:
line:042c6e3.Marisa:
line:042c6e3.Sakuya:
line:042c6e3.Cirno: '"Được chứ! Hãy nhận chút phấn này và làm cho các tiên nữ vĩ đại trở
  lại!"'
line:042c6e3.Koishi:
line:092d6b0: Chọn một lá để Nâng Cấp
line:0663fce: '[Nhận Sự Quên Lãng] Mất {0} HP, loại bỏ một lá bài khỏi thư viện.'
line:04e7441: '"Được chứ~ Hãy chiêm ngưỡng Bột Vảy Thần của ta!"'
line:04e7441.Reimu:
line:04e7441.Marisa:
line:04e7441.Sakuya:
line:04e7441.Cirno: '"Tớ không muốn nhớ về nó, cậu cũng nên quên nó đi thôi đồ ngốc!"'
line:04e7441.Koishi:
line:0786492: '[Nhận Sự Thay Đổi] Mất {0} HP, chọn một lá từ thư viện để biến đổi
  thành một lá Ít Gặp.'
line:0122e22: '"Chà... Thế nào cũng ổn cả?"'
line:0122e22.Reimu:
line:0122e22.Marisa:
line:0122e22.Sakuya:
line:0122e22.Cirno: "\"'Hóa thần'? Nghe không vui bằng việc đóng băng ếch...\""
line:0122e22.Koishi:
line:01a7f1c: '"Được chứ~ Hãy chiêm ngưỡng Bột Vảy Thần của ta!"'
line:01a7f1c.Reimu:
line:01a7f1c.Marisa:
line:01a7f1c.Sakuya:
line:01a7f1c.Cirno: '"Vậy ư? Tớ nghĩ rắc bột vảy để khiến mọi người hắt hơi lại vui hơn."'
line:01a7f1c.Koishi:
line:00eb35b: Biến đổi một lá trong thư viện thành lá Ít Gặp
line:0b4215c: '"Thật là một sức sống mạnh mẽ... Mình cuối cùng đã chinh phục được
  bước hóa thần cuối cùng!"'
line:0e35dc4: '"{0}, hãy tới đây và nhận lấy sự ban phước của Thần Đêm Vĩnh Cửu!"'
line:0f513e5: '"Ừm... Cho tôi xin một chút sức mạnh được không?"'
line:0f513e5.Reimu:
line:0f513e5.Marisa: '"Ờm? Cô có thể chia cho tôi ít sức mạnh của cô được không?"'
line:0f513e5.Sakuya: '"Ôi chà, trong trường hợp đó, tôi xin phép được chấp nhận."'
line:0f513e5.Cirno: '"Này! Hãy hiến dâng sức mạnh của cậu cho Nữ Hoàng Tiên của Băng Giá
  mau!"'
line:0f513e5.Koishi: '"Hả!? Chia cho tôi một ít với."'
line:0c5e0c4: Cánh của Eternity vảy ra loại bột có mùi thoang thoảng hôi... đem lại
  cho {0} một chút "sức mạnh"…
line:070b7de: '"Ừm... Cô có thể làm tôi bớt căng thẳng đi được không?"'
line:070b7de.Reimu:
line:070b7de.Marisa:
line:070b7de.Sakuya:
line:070b7de.Cirno: '"Không cần đâu, cậu không nhở huyền thoại mạnh nhất mùa hè khi chúng
  ta đánh bại ả ngồi xe lăn lập dị kia sao?"'
line:070b7de.Koishi:
line:0cb3009: Xóa một lá khỏi thư viện.
line:04ad2ac: Một loại bột có mùi hôi thoang thoảng tỏa ra từ cánh của Eternity...
  {0} cảm thấy chóng mặt…
line:0c16a46: Đôi cánh của Eternity tỏa ra một loại bột có mùi cực kì hôi... {0} ngất
  xỉu vì thứ mùi đó…
