line:0d416e0: '"Quả nhiên là {0}, kế hoạch du lịch của tôi được cứu rồi!"'
line:05b62f1: '[Cũng được] Nhận {0} <sprite="Point" name="Power">'
line:0668b2a: '"Không phải mấy con chó lông xù hiện cũng đang khá nổi đấy sao? Cô
  cứ để như vậy cho đẹp~"'
line:0668b2a.Reimu: "\"Xin thứ lỗi, tôi đang rất vội!\"\n(Chuyện tương tự có xảy ra với\
  \ Aunn khi trăng tròn không nhỉ?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Thật là một người sói bông xù dễ thương... Có lẽ đại tiểu thư sẽ thay
  đổi quan điểm của mình về người sói."'
line:0668b2a.Cirno: '"Đó chẳng phải là một chứng vật sao? Đồ ăn trộm!"'
line:0668b2a.Koishi: '"Mùi như động vậy hoang dã vậy, tôi bắt đầu đổi ý rồi."'
line:0d0e5fe: '"Tôi là một con sói chứ không phải là chó nhé!"'
line:0d0e5fe.Reimu: '"Thời gian của cô quý giá đến thế luôn!"'
line:0d0e5fe.Marisa:
line:0d0e5fe.Sakuya: '"Tôi không phải thú cảnh nhé!"'
line:0d0e5fe.Cirno: '"Xem ra không thể dựa dẫm vào đứa ngốc này rồi..."'
line:0d0e5fe.Koishi: '"Thật quá quắt! Rõ ràng là không nên có mùi gì cả, nhỉ...?"'
line:02e376a: '"Đương nhiên rồi!"'
line:02e376a.Reimu: '"Tất nhiên rồi! Một dị biến ở mức độ này sẽ được giải quyết nhanh thôi."'
line:02e376a.Marisa: '"Có càng nhiều thứ hữu dụng càng tốt, đưa nó cho tôi~"'
line:02e376a.Sakuya: '"Chuyện nhỏ mà thôi, rất vui nếu giúp được cô."'
line:02e376a.Cirno: '"Tuyệt, tôi thích nhất là đóng băng những con vật có làn da mịn màng!"'
