line:035e5a2: '"Trời ạ, mặt trăng lại khiến lông tóc tôi xù hết lên cả rồi..."'
line:0d31645: '"{0} ơi, liệu bảo vật tôi nhặt được này có thể giúp cô giải quyết dị
  biến nhanh hơn được hay không?"'
line:05164d7: (Bị Kagerou ôm chặt, lông vương ra khắp cả người rồi...)
