line:00f952e: '"He oído hablar de unos raritos del mundo exterior que son como tú.
  Creen que el mundo real es una simulación."'
line:095b051: '[Irse] No sucede nada.'
line:02c3f5f: '[Digital] Gana la exhibición: |OVNI digital|.'
line:02e269d: '[Físico] Gana la exhibición: |Set de OVNIs|.'
line:06ae443: '"Je, je… Ya que te interesa tanto la vida extraterrestre, ¡puedes quedarte
  con mis OVNIs! ¡Quédate con uno!"'
line:00848b0: '"Ahora mismo estás viendo a mi verdadero yo ¡Acabo de escapar de la
  Matrix!"'
line:02b9647: '"Si ya no los necesitas, puedes vendérselos a otra persona."'
line:0b8ee98: '"Nah, puedes tenerlas como recuerdo."'
line:07ebb66: '"Ya he tenido suficiente de aliens en Eientei."'
line:0782c18: '"Nah, me refiero a los que mantienen ocultos los hombres de negro."'
line:0b3c24c: '"¿Y qué diferencia hay entre los dos?"'
line:02d45a7: '"Esto parece totalmente nuevo..."'
