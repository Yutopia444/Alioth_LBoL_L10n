line:0d31645: '"Señorita {0}, ¿este tesoro que encontré la ayudará a resolver el incidente
  más rápido?"'
line:09559cc: '[Que no este esponjosa] Gana una |Exhibición| aleatoria. Agrega |{0}|
  a la biblioteca.'
line:0d416e0: '"Siempre puedo contar contigo, {0}, ¡Mis planes de viaje vuelven a
  estar sobre ruedas!"'
line:05164d7: (He sido abrazada por Kagerou... todo sus pelos se han esparcido sobre
  mi...)
line:05164d7.Reimu:
line:05164d7.Marisa:
line:05164d7.Sakuya: (He sido abrazada por Kagerou... y todo su pelo quedó sobre mí... tendré
  que limpiarme luego.)
line:05164d7.Cirno: (Un abrazo de Kagerou... se siente tan cálida...)
line:05164d7.Koishi:
line:0361c5f: '[Invalido] Todas las exhibiciones elegibles han sido adquiridas.'
line:0d0e5fe: '"¡Soy una loba, no un perro!"'
line:0d0e5fe.Reimu: '"¡¿Vale tanto la pena tu tiempo?!"'
line:0d0e5fe.Marisa:
line:0d0e5fe.Sakuya: '"¡No soy una mascota!"'
line:0d0e5fe.Cirno: '"Supongo que no se puede contar con una idiota..."'
line:0d0e5fe.Koishi: '"¡Oye, qué exagerada! No va a oler tan mal... ¿o sí?"'
line:035e5a2: '"Maldita sea, la luna está haciendo que mi cabello se vuelva esponjoso
  otra vez..."'
line:05b62f1: '[Que este esponjosa] Gana {0} <sprite="Point" name="Power">.'
line:0668b2a: '"¿No son lo más popular hoy en día los perritos esponjosos? ¡Mejor
  quédate así!"'
line:0668b2a.Reimu: "\"¡Lo siento, tengo que irme!\"\n(¿Le pasa lo mismo a Aunn en la luna\
  \ llena?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Una linda mujer loba y esponjosa dices... en cuyo caso tal vez mi
  señora vea a los hombres lobo bajo una luz diferente."'
line:0668b2a.Cirno: '"¿Estas sosteniendo una de las exhibiciones? ¡Así que tú eres la ladrona!"'
line:0668b2a.Koishi: '"Huele como a perro. Creo que ya no lo quiero."'
line:02e376a: '"¡Por supuesto!"'
line:02e376a.Reimu: '"¡Por supuesto! Un incidente como este se resolverá en poco tiempo."'
line:02e376a.Marisa: '"Claro, cuantos más objetos útiles, mejor. ¡Me la llevo!"'
line:02e376a.Sakuya: '"No hay de qué, me alegra poder ayudarte."'
line:02e376a.Cirno: '"¡Claro! ¡También ME ENCANTA congelar a esos animales de piel resbaladiza!"'
