line:0122e22.Marisa:
line:0122e22.Sakuya:
line:0122e22.Cirno: '"¿Ascensión? Pero es más divertido congelar ranas..."'
line:0122e22.Koishi:
line:01a7f1c: '"¡Por supuesto! ¡Contempla mis polvos de escamas sagradas!"'
line:01a7f1c.Reimu:
line:01a7f1c.Marisa:
line:01a7f1c.Sakuya:
line:01a7f1c.Cirno: '"¿En serio? Creo que es más divertido esparcir polvo y ver a la gente
