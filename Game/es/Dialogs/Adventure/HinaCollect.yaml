line:02dcea4: '[Aceptar ayuda] Quitar todas las cartas de |Desgracia|.'
line:00dc670: '[Abrazarla] Gana una |Desgracia| aleatoria.'
line:037bd0d: '"No, esta vez lo llevaré por ti."'
line:037bd0d.Reimu: '"Alejar las desgracias y desterrar el mal también forma parte de los
  deberes de una miko."'
line:037bd0d.Marisa: '"No soy de fijarme mucho en las apariencias, ya sabes."'
line:037bd0d.Sakuya: '"Mi señora... también debería estar interesada en esto."'
line:037bd0d.Cirno: '"¡No hay problema, déjalo en mis manos! ¡Congelaré todas las desgracias!"'
line:037bd0d.Koishi: '"Así que esto es lo que se siente al recoger las desgracias."'
line:0183740: '"Déjame cargar estas desgracias por ti."'
line:09f1923: '"Tan cautelosa como siempre, ¿cierto? No tengo nada más que intenciones
  puras."'
line:0a76aa4: '[Irse] No sucede nada.'
line:017720c: '"Ah, parece que llevas encima muchas desgracias, señorita {0}."'
line:06b252f: '{0} siente que se desvanece toda las desgracias.'
line:076f484: '"Muchas gracias, Hina."'
line:076f484.Reimu: '"Gracias a dios, hoy día ya ha sido lo suficientemente malo."'
line:076f484.Marisa: '"Supongo que no puedo llevarme estos souvenirs a casa..."'
line:076f484.Sakuya: '"Has limpiado bastante bien, Hina."'
line:076f484.Cirno: '"Se siente tan refrescante como comer una sandía fría."'
line:076f484.Koishi: '"Ahora se siente mucho más refrescante."'
line:0d580ed: '"Puede ser una desgracia, pero también es parte de mi colección..."'
