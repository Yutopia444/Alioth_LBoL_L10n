line:08250c8: '"¡Con la plataforma de prensa instantánea que he construido, yo finalmente
  puedo publicar artículos antes que Aya!"'
line:0fed9a3: '"¿Podría concederme una entrevista, señorita {0}?"'
line:0ffc3c5: '[Aceptar] Responde una pregunta.'
line:0f1ab7b: '"¿Por qué has decidido participar en este incidente, señorita {0}?"'
line:0c26759: '[Por Gensokyo] Gana |{0}|.'
line:093187e: '"... ¡Qué objetivo tan noble! ¡Me aseguraré de que todos lo escuchen!"'
line:0e860d0: Las buenas acciones de {0} comienza a extenderse por Gensokyo después
  de que Hatate agregó algunos "detalles".
line:0e688d4: '"Vaya, eres muy honesta con tus deseos, ¿eh? Entonces, como agradecimiento,
  acepta este pago por tu aparición."'
line:02a8586: Comienzan a circular rumores de que {0} pretende encontrar y vender
  el tesoro secreto de Kaguya.
line:018ba4d: '[Ni idea] Gana |{0}| y gana la desgracia: |{1}|.'
line:02ca266: '"Exterminar a tanta gente inocente sin ningún motivo, clásico de {0}."'
line:01f1aca: '[Por dinero] Gana |{0}|, gana {1} <sprite="Point" name="Gold">'
line:062320e: '"Mi razón... ¿Cuál fue la razón por la que salí hoy?"'
line:062320e.Reimu: '"Bueno, así es como vive su vida una sacerdotisa Hakurei"'
line:062320e.Marisa:
line:062320e.Sakuya: (Dudo que satisfacer el deseo de mi señora por un |Traje espacial| sea
  una razón suficiente.)
line:062320e.Cirno:
line:062320e.Koishi:
line:0680a62: '[Por Kaguya] Gana |{0}|, cura {1} de vida.'
line:0db4c31: '"{0} reveló su profunda amistad con la señorita Kaguya en una entrevista,
  dejando a uno con la duda..."'
line:08f2904: '{0} siente calor en su pecho.'
line:0b1bfc1: '[Rechazar] No sucede nada.'
line:070965c: '"Pasaré. Además nadie toma en serio las noticias de una tengu."'
line:070965c.Reimu:
line:070965c.Marisa: '"No, prefiero que mi nombre no se conozca en el |Internet|."'
line:070965c.Sakuya: '"Tengo mucho trabajo que hacer. Si me disculpas."'
line:070965c.Cirno:
line:070965c.Koishi: '"Sabes, si me haces una foto... no saldrá nada en la imagen."'
line:0fe3a32: '"¡Eso es solo porque no tienes un teléfono!"'
line:0fe3a32.Reimu:
line:0fe3a32.Marisa: '"¡Es mejor ser famosa que pasar desapercibido, ya sabes!"'
line:0fe3a32.Sakuya: '"¿Así son las mujeres en su lugar de trabajo?"'
line:0fe3a32.Cirno:
line:0fe3a32.Koishi: '"Solo cerraste tu corazón, no las leyes de la física, ¿verdad...?"'
