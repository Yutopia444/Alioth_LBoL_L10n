line:00848b0: 「現在出現在你面前的，其實是剛剛逃離了『矩陣母體』的我」
line:00f952e: 「我聽說外面世界有許多像你這樣，以為現實世界是模擬出來的怪人」
line:0b3c24c: 「那和平時的有甚麼區別呢？」
line:06ae443: 「哼哼，為了滿足大家對於外星生命的好奇心，進行幽浮大派送！選一個吧」
line:02e269d: 【實體版】獲得|幽浮套裝|
line:02b9647: 「這個不要了還可以賣二手」
line:0b8ee98: 「還是可以放在家裏收藏的比較好」
line:02c3f5f: 【數字版】獲得|數碼幽浮|
line:02d45a7: 「這個看起來很新鮮」
line:095b051: 【離開】無事發生
line:07ebb66: 「永遠亭裏不是有很多外星人嗎，想看可以去那裏看個夠」
line:0782c18: 「那種不算，得是會被黑衣人收容的那種才行，懂不懂啊」
