line:008fa52: 「あなたもかぐやちゃんのファンになりましょ！」
line:0678716: 【服を受け取る】|変なオタクTシャツ|を手に入れる
line:063a72b: 「知ってる？かぐやちゃんは他の月の民とは違って、とっても情熱的で親切なのよ！」
line:0ba9037: 「無料？それなら1つおねがい」
line:0ba9037.Reimu:
line:0ba9037.Marisa: 「タダなら返さなくてもいいよな？もらっておくぜ」
line:0ba9037.Sakuya: 「あらそう？お嬢様のお土産にしようかしら」
line:0ba9037.Cirno: 「タダならあたいに寄越すのが当然よね！」
line:0ba9037.Koishi: 「お金いらないの？ じゃあもらっちゃおーっと！」
line:0670be2: 「ぜひ着てみてね！」
line:00d22b0: 【遠慮する】何も起こらない
line:0fc2c16: "「うわ、何だその変なTシャツ」"
line:0fc2c16.Reimu:
line:0fc2c16.Marisa:
line:0fc2c16.Sakuya: 「あら、随分と変なデザインね…雑巾にするにしても生地が悪そうだし、いらないわ」
line:0fc2c16.Cirno: 「げーっ、 こんな変なTシャツ、あたいのカッコいい羽が隠れちゃうから絶対いらないぞ！」
line:0fc2c16.Koishi: 「うわー、変な柄のTシャツー！ ぜんぜん可愛くなーい」
line:059fbd3: 「無料？それなら1つお願い、大きいのね」
line:059fbd3.Reimu:
line:059fbd3.Marisa: 「もちろんだ、大きいのをくれ！」
line:059fbd3.Sakuya: 「あらそう？美鈴のお土産にしようかしら、一応大きいのを頂戴」
line:059fbd3.Cirno: 「当然さいきょーにデカいのをもらうに決まってるだろ！」
line:059fbd3.Koishi: 「じゃあねー、このすっごく大きいやつ！ これがいいなー！」
line:0ba87b6: 「ぜひ着てみてね！」
