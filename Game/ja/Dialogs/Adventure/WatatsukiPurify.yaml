line:015cd2b: 【桃を食べる】最大ライフ {0} を得る、厄災：|{1}|
line:08e2a8a: 「依姫から|伊豆能売|の神楽鈴を借りたの、これで穢れを落としてあげましょう」
line:07b8cb5: 「もしよかったら、この桃をあげましょう、とっても甘いのよ」
line:005d895: 添加物のような味はするが、月の都の遺伝子組み換え桃はやはり美味しい……
line:09c8a85: 「すごく美味しい！」
line:09c8a85.Reimu: 「美味しいわねこれ。なんで前はこれでもてなしてくれなかったのかしら？」
line:09c8a85.Marisa: 「本当に美味いな！前の時もこれが食えればよかったんだが」
line:09c8a85.Sakuya: 「これは美味しいわね、お嬢様への手土産にしようかしら」
line:09c8a85.Cirno: 「うおー！うまい！もっとないのか！？」
line:09c8a85.Koishi: 「とっても甘くて美味しいね～、なんだか元気が出てきたよ」
line:0c671d8: 【協力を断る】何も起こらない
line:0b9590a: 「こんな些細な異変、自分で解決できるわ」
line:0b9590a.Reimu:
line:0b9590a.Marisa: 「いらん。お前が出てきたら、私がこれ以上何をするっていうんだ」
line:0b9590a.Sakuya: 「結構です。美味しい話には罠がつきものですから」
line:0b9590a.Cirno: 「そんなものなくなってあたいはさいきょーだ！だからいらない！」
line:0b9590a.Koishi: 「なんだか怪しいな～、いらないよ」
line:05fe9e1: 「八意様の助手じゃない、私も少し手を貸すわ」
