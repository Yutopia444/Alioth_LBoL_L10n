line:08250c8: '"Com a plataforma de notícias instantâneas que construí, posso finalmente
  estar um passo à frente da Aya!"'
line:0fed9a3: '"Senhorita {0}, posso ter uma entrevista?"'
line:0ffc3c5: '[Aceitar] Responder uma pergunta.'
line:0f1ab7b: '"Por que você decidiu participar deste incidente, senhorita {0}?"'
line:0c26759: '[Por Gensokyo] ganhe |{0}|.'
line:0e860d0: As ações justas de {0} começam a se espalhar em Gensokyo depois que
  Hatate adicionou alguns "detalhes".
line:0e688d4: '"Seguindo seus desejos, hein? Então, como agradecimento, por favor,
  aceite este pagamento de participação"'
line:02a8586: Começam a circular alguns rumores de que {0} pretende encontrar e vender
  o tesouro secreto de Kaguya.
line:018ba4d: '[Não faço ideia] Ganhe |{0}|, Infortúnio:|{1}|.'
line:062320e: '"Meu propósito... por que eu saí hoje de novo?"'
line:062320e.Reimu: '"Esse é o modo de viver da sacerdotisa hakurei~"'
line:062320e.Marisa:
line:062320e.Sakuya: (Duvido que satisfazer o desejo da senhorita por um |Traje Espacial|
  seja o suficiente)
line:062320e.Cirno:
line:062320e.Koishi:
line:0680a62: '[Por Kaguya] ganhe |{0}|, cure {1} de vida.'
line:08f2904: '{0} sente um calor em seu peito.'
line:0b1bfc1: '[Recusar] Nada acontece.'
line:0fe3a32: '"Isso é só porque você não tem um telefone!"'
line:0fe3a32.Reimu:
line:0fe3a32.Marisa: '"Melhor ser famoso do que um desconhecido qualquer~"'
line:0fe3a32.Sakuya: '"É assim que mulheres se comportam no local de trabalho?"'
line:0fe3a32.Cirno:
line:0fe3a32.Koishi:
line:070965c: '"Eu dispenso. Ninguém leva as notícias de uma tengu a sério de qualquer
  maneira."'
line:070965c.Reimu:
line:070965c.Marisa: '"Não, eu prefiro que meu nome não seja divulgado na |Internet|."'
line:070965c.Sakuya: '"Tenho muito trabalho a fazer. Com licença."'
line:070965c.Cirno:
line:070965c.Koishi:
line:093187e: '"...Que objetivos nobres! Com certeza irei divulga-los!"'
line:01f1aca: '[Por Dinheiro] Ganhe |{0}|, ganhe {1} <sprite="Point" name="Gold">.'
line:02ca266: '"Exterminar tantas pessoas inocentes sem motivo algum, não é nenhuma
  surpresa se tratando de {0}."'
line:0db4c31: '"{0} revelou sua profunda amizade com a Srta. Kaguya em uma entrevista,
