line:0c9cdfa: '{0} betritt versehentlich das nächtliche |Sanshoku Geidontei|, ein
  penetranter Geruch von Alkohol durchdringt das Gebäude …'
line:0c66585: '"{0}! Komm rein! Was möchtest du heute bestellen?"'
line:061da42: '[Einen Schluck] Erhalte Ausstellungsstück: |{0}|, entferne eine Karte
  aus der Bibliothek.'
line:0da2517: '"Einen Moment, kann {0} das wirklich vertragen?"'
line:0269654: Habe ich etwas vergessen …? Wähle eine Karte aus und entferne sie aus
  der Bibliothek.
line:018cd9a: '[Wetttrinken] Erhalte {0} <sprite="Point" name="Gold"> und zwei Unglücke:
  |{1}|.'
line:00d22c7: Die benachbarten Youkai fangen an zu jubeln, einige von ihnen schließen
  sogar Wetten ab.
line:05203c5: '"Ja, ich nehme einmal das Übliche. Schreib es auf meine Rechnung, ok?"'
line:05203c5.Reimu: '"Oh, ich lasse es mir wie immer auf die Rechnung schreiben."'
line:05203c5.Marisa: '"Ich zahle das nächste Mal, wenn ich wieder hier bin. Gib mir bis dahin
  etwas mehr Zeit~"'
line:05203c5.Sakuya: '"Können wir das auf die Rechnung unserer Torwächterin schreiben?"'
line:05203c5.Cirno: '"Geld!? Ich habe keines bei mir!"'
line:05203c5.Koishi: '"Es war schön, bis dann!"'
line:0862f2d: '"Hey, schuldest du mir nicht noch die Rechnung vom letzten Monat?"'
line:015f1aa: '"Uh, wieso fühle ich mich so schläfrig nach nur einem … Glas …"'
line:0b0300d: '"Uwah! Bitte nimm das und behalte es für dich."'
line:0b3a02b: '[Akzeptieren] Erhalte Ausstellungsstück: |{0}|.'
line:0d8166c: '[Ablehnen] Nichts passiert.'
line:01b5a50: '"Nein danke, auf deine Tricks falle ich nicht nochmal rein."'
line:01b5a50.Reimu:
line:01b5a50.Marisa: '"Hey, mach mal halblang. Ich habe erstmal genug für heute."'
line:01b5a50.Sakuya:
line:01b5a50.Cirno: '"Ich mache mich nun auf den Rückweg!"'
line:01b5a50.Koishi: '"Ich werde nicht mehr wiederkommen~"'
line:05ad143: '"Argh … Ist die Flasche wirklich so groß?! Aber nun schaut jeder zu
  mir her, jetzt gibt es kein Zurück mehr!"'
line:0c29c84: "Durch überwältigende Entschlossenheit geht {0} als Siegerin hervor\
  \ und nimmt ihren Preis an.\nDoch war es das wirklich wert?"
line:024e390: (In einem Traum spürt {0} eine verdächtige Präsenz!)
line:0ea1dc5: '[Ungültig] Jedes mögliche Ausstellungsstück wurde bereits erhalten.'
line:096d262: '"Diesen speziellen Sake, den Aya beim letzten Mal getrunken hat, bitte
  gib mir auch so einen!"'
line:0b95170: '"Wie war das, {0}? Fräulein Ohnmächtig-nach-einem-Glas fordert mich
  zum Trinken heraus?"'
line:0bea743: '[Nippen] Kämpfe gegen zufällige Feinde, erhalte ein zufälliges, seltenes
  Ausstellungsstück.'
line:0e46351: '"Was für mächtige Illusionen … Hast du etwas in den Wein gemischt?!"'
line:0e46351.Reimu: '"Ich fange schon an Dinge zu sehen … Wie stark war den bitte der Sake,
  den du mir gegeben hast!?"'
line:0e46351.Marisa: '"Das waren wirklich heftige Halluzinationen … Du hast nicht zufällig
  etwas in den Sake gemischt, oder?"'
line:0e46351.Sakuya: '"Das waren wirklich heftige Halluzinationen … Ist das bei Sake immer
  so?"'
line:0e46351.Cirno: '"Uh … Mir ist schlecht … Das bedeutet doch, dass jemand etwas Verdächtiges
  in den Sake gemischt hat!"'
line:0e46351.Koishi: '"Hmm … Der Sake von vorhin … Ich habe das Gefühl, dass da etwas seltsames
  drin war …"'
line:0bd13e0: '"Das nenne ich doch mal ein gutes Geschäft. Bis zum nächsten Mal~"'
line:0bd13e0.Reimu: '"Hier ist ja einiges los. Ich werde häufiger vorbeikommen müssen."'
line:0bd13e0.Marisa: '"Nicht schlecht! Ich werde auch das nächste Mal auf dich zählen."'
line:0bd13e0.Sakuya: '"Das ist sehr großzügig, ich werde auf jeden Fall wieder vorbeikommen."'
line:0bd13e0.Cirno: '"Oh, schenkst du mir das etwa!? Du bist wirklich nett!"'
line:0bd13e0.Koishi: '"Bis zum nächsten Mal~"'
line:0c77879: '"Stimmt was nicht, Suika? Seitdem ich hier bin, starrst du mich mit
  diesem Grinsen im Gesicht an."'
line:0c77879.Reimu:
line:0c77879.Marisa: '"Du betrunkener Oni, hast du nichts anderes im Kopf als Alkohol?"'
line:0c77879.Sakuya: '"Oh je, seitdem ich hier bin, fühle mich beobachtet. Was geht hier
  vor sich?"'
line:0c77879.Cirno: '"Hey! Nur weil du mich für die Stärkste hältst, heißt das nicht, dass
  du mich einfach provozieren kannst."'
line:0c77879.Koishi: '"Fräulein Oni, schaust du schon die ganze Zeit zu mir herüber?"'
line:0bdfac4: '"Versuchst du einen Wal großzuziehen? Das reicht nicht!"'
line:0064f30: '"Mach dich bereit für meinen ultimativen Angriff: Tiefseebombe!"'
line:0064f30.Reimu: '"Unterschätze nie die Trinkfestigkeit eines Schreinmädchens, ich bin
  immerhin ein Profi."'
line:0064f30.Marisa: '"Sei nicht albern …! Bring mir lieber etwas Stärkeres!"'
line:0064f30.Sakuya: '"Der Alkoholgehalt ist mir völlig egal!"'
line:0064f30.Cirno: '"Unterschätze mich nicht! Ich kann sogar alle Feen zum Trinken herbeirufen!"'
line:0064f30.Koishi: '"Oooooh~ Die ganze Welt dreht sich~~ Das macht langsam richtig Spaß!"'
line:0868bad: (Geidontei … Wenn ich mich recht entsinne, werden hier in der Nacht
  auch Youkai bedient.)
line:0c7c734: ({0} schafft es den |Atem des Wals| leerzutrinken, aber durch den Alkohol
  vergisst sie die Rechnung und etwas Wichtiges.)
