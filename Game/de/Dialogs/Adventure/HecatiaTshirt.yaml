line:0670be2: '"Vergiss nicht, es zu tragen, damit es jeder sehen kann!"'
line:059fbd3: '"Kostenlos? Dann nehme ich eins und am besten eine Nummer größer."'
line:059fbd3.Reimu:
line:059fbd3.Marisa: '"Das ist eine gute Gelegenheit, bitte gib mir das Größere!"'
line:059fbd3.Sakuya: '"Ich werde das für Meiling als Souvenir mitnehmen. Gib mir einfach
  das Größere."'
line:059fbd3.Cirno: '"Selbstverständlich nehme ich das Größte!"'
line:059fbd3.Koishi: '"Dann nehme ich das Größere! Das sieht gut aus!"'
line:00d22b0: '[Verlassen] Nichts passiert.'
line:0fc2c16: '"{Censor:select false=\"Ähm, ''Kaguya-chan''? Wieso sprichst du so,
  wie peinlich\" true=\"Dein Outfit zuvor war auch schon seltsam … Vergessen wir das
  einfach\"}."'
line:0fc2c16.Reimu:
line:0fc2c16.Marisa:
line:0fc2c16.Sakuya: '"Das würde sich vermutlich nicht einmal als Putzlappen eignen."'
line:0fc2c16.Cirno: '"Wenn ich schwarze Kleidung trage, schmilzt das Eis …"'
line:0fc2c16.Koishi: '"Wow! Das~ ist~ überhaupt nicht süß!"'
line:008fa52: '"Komm schon, lass uns Kaguya-chan gemeinsam unterstützen!"'
line:0678716: '[Kleidung annehmen] Erhalte Ausstellungsstück: |Idol T-Shirt|.'
line:063a72b: '"Meinen Recherchen zufolge ist Kaguya-chan sehr warmherzig und nett,
  im Gegensatz zu den anderen Mondbewohnern."'
line:0ba9037: '"Kostenlos? Dann nehme ich eins."'
line:0ba9037.Reimu:
line:0ba9037.Marisa: '"Kostenlos? Das heißt, ich kann es mir ausleihen und muss es nicht
  zurückgeben, richtig?"'
line:0ba9037.Sakuya: '"Sagtest du eben kostenlos? Das Souvenir, dass ich der Herrin dieses
  Mal mitbringe, ist äußerst einzigartig."'
line:0ba9037.Cirno: '"Dinge, die für die Stärkste bestimmt sind, sollten immer kostenlos
  sein."'
line:0ba9037.Koishi: '"Ich muss nicht dafür bezahlen? Dann werde ich meine Schwester dazu
  bringen, es heute Nacht anzuziehen."'
