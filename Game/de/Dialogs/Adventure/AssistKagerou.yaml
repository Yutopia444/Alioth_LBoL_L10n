line:0361c5f: '[Ungültig] Jedes mögliche Ausstellungsstück wurde bereits erhalten.'
line:035e5a2: '"Menno, der Mond macht meine Haare wieder ganz fluffig …"'
line:0d31645: '"{0}, ich habe diesen Schatz gefunden. Wird er dir dabei helfen, den
  Vorfall schneller zu lösen?"'
line:09559cc: '[Flausch entfernen] Erhalte ein zufälliges Ausstellungsstück und |{0}|.'
line:02e376a: '"Natürlich!"'
line:02e376a.Reimu: '"Aber natürlich! Dieser Vorfall wird im Handumdrehen gelöst sein."'
line:02e376a.Marisa: '"Mehr Gegenstände haben noch nie geschadet, ich nehme es gerne an~"'
line:02e376a.Sakuya: '"Gern geschehen, ich helfe gerne aus."'
line:02e376a.Cirno: '"Cool, ich bin schließlich eine Meisterin darin, glitschige Kreaturen
  einzufrieren!"'
line:02e376a.Koishi:
line:05164d7: (Kagerou umarmt mich kräftig, ihre Haare bleiben überall an mir hängen
  …)
line:05164d7.Reimu:
line:05164d7.Marisa:
line:05164d7.Sakuya: (Kagerou umarmt mich kräftig, ihre Haare bleiben überall an mir hängen
  … Ich werde mich wohl sauber machen müssen.)
line:05164d7.Cirno: (Kagerou umarmt mich kräftig, sie ist so warm …)
line:05164d7.Koishi:
line:05b62f1: '[Flausch beibehalten] Erhalte {0} <sprite="Point" name="Power">.'
line:0668b2a: '"Ist ein flauschiger Hund heutzutage nicht der letzte Schrei? Du solltest
  so bleiben~"'
line:0668b2a.Reimu: "\"Tut mir leid, ich muss los!\"\n(Passiert das etwa auch mit Aunn während\
  \ eines Vollmonds?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Ein süßer, flauschiger Werwolf also … Möglicherweise wird meine Herrin
  Werwölfe doch noch in einem anderen Licht sehen."'
line:0668b2a.Cirno: '"Ist das nicht das vermisste Ausstellungsstück in deiner Hand? Also
  bist du der Dieb!"'
line:0668b2a.Koishi: '"Es hat den Geruch einer Bestie, ich verzichte wohl lieber darauf."'
line:0d0e5fe: '"Ich bin ein Wolf und kein Hund!"'
line:0d0e5fe.Reimu: '"Ist deine Zeit wirklich so kostbar?"'
line:0d0e5fe.Marisa:
line:0d0e5fe.Sakuya: '"Ich bin kein Haustier!"'
line:0d0e5fe.Cirno: '"Anscheinend kann ich mich nicht auf einen Idioten verlassen …"'
line:0d0e5fe.Koishi: '"Das geht zu weit! Es riecht nicht schlecht … oder?"'
line:0d416e0: '"Auf {0} ist immer Verlass, meine Reisepläne sind gerettet!"'
