line:0ffc3c5: '[Akzeptieren] Beantworte eine Frage.'
line:0c26759: '[Für Gensokyo] Erhalte |{0}|.'
line:0e860d0: '{0}s heldenhafte Taten sprechen sich bereits in Gensokyo herum, vor
  allem nachdem Hatate ein paar "Details" hinzugefügt hat.'
line:01f1aca: '[Für Geld] Erhalte |{0}| und {1} <sprite="Point" name="Gold">.'
line:02a8586: Gerüchte, dass {0} plant den geheimen Schatz von Kaguya zu verkaufen,
  beginnen sich zu verbreiten.
line:018ba4d: '[Keine Ahnung] Erhalte |{0}| und Unglück: |{1}|.'
line:0680a62: '[Für Kaguya] Erhalte |{0}|, heile {1} Leben.'
line:0b1bfc1: '[Ablehnen] Nichts passiert.'
line:0fe3a32: '"Das sagst du nur, weil du kein Handy hast!"'
line:0fe3a32.Reimu:
line:0fe3a32.Marisa: '"Lieber berühmt sein als unbekannt bleiben~"'
line:0fe3a32.Sakuya: '"Sind alle berufstätigen Frauen so?"'
line:0fe3a32.Cirno:
line:0fe3a32.Koishi: '"Du hast nur dein Herz verschlossen und nicht die Gesetze der Physik
  … oder?"'
line:070965c: '"Ich verzichte. Niemand nimmt die Nachrichten der Tengu noch ernst."'
line:070965c.Reimu:
line:070965c.Marisa: '"Nein, ich möchte nur nicht im |Internet| bekannt werden."'
line:070965c.Sakuya: '"Ich habe noch viel zu tun. Bitte entschuldige mich."'
line:070965c.Cirno:
line:070965c.Koishi: '"Du musst wissen, wenn du ein Bild von mir schießt, wird man darauf
  nichts sehen können."'
line:0f1ab7b: '"Wieso hast du dich dazu entschlossen, diesem Vorfall nachzugehen,
  {0}?"'
line:0db4c31: '"{0} berichtet im Interview über ihre tiefe Freundschaft mit Kaguya,
  was den ein oder anderen stutzig werden lässt …"'
line:08250c8: '"Mithilfe meiner brandaktuellen Nachrichtenplattform seid ihr sogar
  Aya einen Schritt voraus!"'
line:0fed9a3: '"{0}, könnte ich ein Interview bekommen?"'
line:0e688d4: '"Du folgst also deinen Bedürfnissen, hmm? Dann akzeptiere bitte dieses
  bescheidene Honorar als kleines Dankeschön."'
line:02ca266: '"So viele unschuldige Leute wurden also grundlos ausgelöscht, typisch
  {0}."'
line:062320e: '"Mein Grund … Wieso war ich nochmal unterwegs?"'
line:062320e.Reimu: '"Das gehört zum Leben eines Schreinmädchens dazu~"'
line:062320e.Marisa:
line:062320e.Sakuya: (Ich bezweifle, dass das Verlangen nach einem |Raumanzug| für meine
  Herrin als Begründung ausreicht.)
line:062320e.Cirno:
line:062320e.Koishi:
line:08f2904: '{0} spürt eine Wärme in ihrer Brust.'
line:093187e: '"… Ein nobles Ziel! Ich werde dich auf jeden Fall unterstützen!"'
