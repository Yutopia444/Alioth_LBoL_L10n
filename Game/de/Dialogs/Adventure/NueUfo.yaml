line:095b051: '[Verlassen] Nichts passiert.'
line:02e269d: '[Physisch] Erhalte Ausstellungsstück: |UFO-Set|.'
line:02c3f5f: '[Digital] Erhalte Ausstellungsstück: |Digitales UFO|.'
line:02b9647: '"Falls du sie nicht mehr brauchst, kannst du sie an jemand anderes
  verkaufen."'
line:00f952e: '"Ich habe von Spinnern in der Außenwelt gehört, die genauso sind wie
  du. Die glauben, die echte Welt sei eine Simulation."'
line:0782c18: '"Nein, ich rede von der Sorte, die von den Männern in Schwarz geheim
  gehalten werden."'
line:02d45a7: '"Das sieht ganz neu aus."'
line:0b8ee98: '"Schon gut, du kannst sie als kleines Andenken behalten."'
line:06ae443: '"Hehe, da du dich so für außerirdisches Leben interessierst, kannst
  du eines meiner UFOs haben! Hier, nimm eins!"'
line:00848b0: '"Was du hier vor dir siehst, ist mein wahres Ich, das soeben aus der
  Matrix entkommen ist."'
line:07ebb66: '"Ist Eientei nicht voll mit Außerirdischen? Du kannst sie dir dort
  so lange anschauen, wie du willst."'
line:0b3c24c: '"Und was genau ist jetzt anders als sonst?"'
