line:0eff719: '[Ungültig] Nicht genügend <sprite="Point" name="Gold">.'
line:03e0868: '[Normal bezahlen] Verliere {0} <sprite="Point" name="Gold">.'
line:03e1937: '[Ungültig] Nicht genügend <sprite="Point" name="Gold">.'
line:0284c65: '[Zeche prellen] Weigere dich zu bezahlen.'
line:0086f01: '[Zeche prellen] Weigere dich zu bezahlen.'
line:01cb698: '"Ups, ich habe meine Geldbörse zuhause vergessen. Schreib es einfach
  auf meine Rechnung."'
line:01cb698.Reimu:
line:01cb698.Marisa: '"Das ist kein Versuch, die Situation auszunutzen, verstehst du? Ich
  muss nur schnell die Kalorien wieder loswerden."'
line:01cb698.Sakuya: '"Unsere Torhüterin kommt hier öfter vorbei, nicht wahr? Ich werde sie
  bitten, die Rechnung bei ihrem nächsten Besuch zu begleichen."'
line:01cb698.Cirno: '"Lecker! Danke für die Mahlzeit~"'
line:01cb698.Koishi: '"Das war sehr lecker! Bis dann!"'
line:06598ae: '[Gegrillte Pilze] Erhalte {0} <sprite="Point" name="Power">.'
line:0554174: '[Normal bezahlen] Verliere {0} <sprite="Point" name="Gold">.'
line:0544220: '"Die Pilze sehen lecker aus, ich nehme einen Spieß."'
line:0f8955e: '"Verstanden~ ein Spieß mit gegrillten Pilzen, das macht dann {0} <sprite="Point"
  name="Gold">."'
line:01150b0: '"Bitte komm bald wieder~"'
line:0a8caeb: '"Bitte komm bald wieder~"'
line:0d373d9: '"Leckere Spieße! Kommt und schaut herein~"'
line:0b7dfd2: '"Komm schon, {0}. Hol dir einen Spieß, ansonsten wirst du keine Kraft
  haben, um Youkai zu bekämpfen~"'
line:026a5bc: '[Gegrillter Neunauge] Heile {0} Leben.'
line:08ebd93: '"Also schön, dann nehme ich einmal das gegrillte Neunauge."'
line:08ebd93.Reimu:
line:08ebd93.Marisa: '"Allein der Gedanke an gegrilltes Neunauge lässt mir das Wasser im
  Mund zusammenlaufen."'
line:08ebd93.Sakuya:
line:08ebd93.Cirno: '"Bring mir eine Portion gegrilltes Neunauge, und zwar schnell!"'
line:08ebd93.Koishi: '"Eine Portion gegrilltes Neunauge … So etwas isst man nicht oft."'
line:065edde: '"Hau nicht einfach ab, ohne zu bezahlen—"'
line:06bc591: '"Verstanden~ ein gegrilltes Neunauge, das macht dann {0} <sprite="Point"
  name="Gold">."'
line:05fa0d3: '"Deine Pilze schmecken nicht besonders frisch, wähle deine Zutaten
  beim nächsten Mal mit mehr Bedacht."'
line:05fa0d3.Reimu:
line:05fa0d3.Marisa: '"Sind diese Pilze wirklich frisch? Selbst die Pilze aus dem Wald der
  Magie sehen besser aus."'
line:05fa0d3.Sakuya: '"Sind diese Pilze etwa verdorben?"'
line:05fa0d3.Cirno: '"Die sehen etwas verschimmelt aus!"'
line:05fa0d3.Koishi: '"Sie schmecken komisch. Sind die Pilze schlecht geworden?"'
line:0c3600a: '[Kein nächtlicher Snack] Nichts passiert.'
line:0b5dafc: '"Hin und wieder eine Ausnahme zu machen hat noch nie jemanden geschadet
  …!"'
line:0bf0f77: '"Mein Geschäft ist vielleicht nicht so groß, aber ich führe es mit
  Integrität …!"'
line:0c34697: '"Man soll nachts nicht mehr so viel essen und Sport treiben, das ist
  schlecht für die Gesundheit."'
