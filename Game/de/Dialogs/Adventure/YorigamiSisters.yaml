line:0f92fba: '{0}'
line:0af9f64: '[Ungültig] Nicht genügend <sprite="Point" name="Gold">.'
line:03a90b9: '[Nicht kaufen] Zahle {0} <sprite="Point" name="Gold"> oder erhalte
  Unglück: |{1}|.'
line:035fe0b: '[Nimm mein Geld] Zahle {0} <sprite="Point" name="Gold">, erhalte: |{1}|.'
line:0f29356: '"Ich habe Geld! Beruhigt euch!"'
line:0f29356.Reimu: '"Bitte nicht! Gibt es denn nichts, was ich tun kann …?"'
line:0f29356.Marisa:
line:0f29356.Sakuya: '"Nimmt es, nur lasst mich bitte in Frieden. Zudem hätte ich gerne einen
  Beleg dazu."'
line:0f29356.Cirno: '"Nimmt es ruhig, ich bin nicht so gierig wie die Menschen."'
line:0f29356.Koishi: '"Ach, ihr wollt Geld von mir haben? Ihr seid echt unmöglich."'
line:08ee578: '[Ich bin pleite] Erhalte Unglück: |{0}|.'
line:039060c: '"Komm mir nicht zu nahe!"'
line:039060c.Reimu: '"Versucht ihr mich ärmer zu machen, als ich ohnehin schon bin!?"'
line:039060c.Marisa:
line:039060c.Sakuya: '"Ich werde wohl aus erster Hand erfahren, wie es ist arm zu sein …"'
line:039060c.Cirno: '"Mein Konto ist eingefroren …"'
line:039060c.Koishi: '"Die Stimmung hier fühlt sich bedrückend an …"'
line:0e93370: '"Der originale Preis liegt bei 100 <sprite="Point" name="Gold">, aber
  wir bieten für alle Neukunden einen Sonderrabatt von |g:{0}%| an~"'
line:053b6d2: '"Und dieser Vorfall brachte uns eine lange Nacht, was bedeutet — es
  gibt jeden Tag einen Ausverkauf!"'
line:027fc29: '[Verschont mich] Zahle {0} <sprite="Point" name="Gold">.'
line:0ddd9ed: '"Na geht doch~"'
line:0989e20: '"Das hört sich schon besser an~"'
line:0b88a7e: '"Diese überwältigende Zufriedenheit nach dem Einkauf … Wann ist euer
  nächster Ausverkauf?!"'
line:0b88a7e.Reimu: '"Was für ein einzigartiges Einkaufserlebnis! Wann bekommt ihr wieder
  neue Ware?"'
line:0b88a7e.Marisa:
line:0b88a7e.Sakuya: '"Die Auswahl unterscheidet sich von dem, was man normalerweise findet.
  Wann bekommt ihr wieder neue Ware?"'
line:0b88a7e.Cirno: '"Ich mag kalte Sachen am liebsten~ Wann bekommt ihr wieder neue Ware?"'
line:0b88a7e.Koishi: '"Beim nächsten Mal bringe ich meine Schwester mit. Wann bekommt ihr
  wieder neue Ware?"'
line:096777f: '"Du willst es also auf die harte Tour … Schwesterherz, wärst du so
  lieb und ergreifst Besitz von ihr?"'
line:09653e9: '"Ist es wirklich eine gute Idee, eine bedürftige Person so hart zu
  bestrafen? Aber vielleicht ist das ja auch besser so."'
line:083ab19: "\"Unser Ausverkauf gebrauchter Schmuckstücke findet nur nachts statt.\""
line:08c6cbc: "\"Hey, ist das nicht {0}? Möchtest du mithilfe der gebrauchten Schmuckstücke\
  \ aus dem Ausverkauf der Yorigami Schwestern deinen Stil ändern?\""
