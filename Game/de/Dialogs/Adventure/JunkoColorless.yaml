line:0632b2f: '"Erlaube mir und meiner Kraft der Läuterung dich dabei zu unterstützen,
  dein Mana zu kontrollieren."'
line:0833aaf: Wandle ein farbiges Mana in deiner Manabasis in zwei farblose Mana um.
line:04cb1b4: '{0} kann fühlen, wie ihr {1} Mana geläutert wird.'
line:00b8f03: '"Das geht dich nichts an."'
line:00b8f03.Reimu:
line:00b8f03.Marisa: '"Nein. Ich weigere mich, dir auch nur ein bisschen von meinem Mana
  zu überlassen."'
line:00b8f03.Sakuya: '"Ich habe bereits mehr als genug farbloses Mana. Entschuldige mich."'
line:00b8f03.Cirno: '"Das hört sich kompliziert und mühselig an, ich lasse es lieber bleiben."'
line:00b8f03.Koishi: "\"Meine Schwester hat mir schon viel zu oft gesagt, dass ich 'zu naiv'\
  \ bin.\""
line:0252f89: '"Die Art und Weise, wie du dein Mana verwendest, ist wirklich ineffizient."'
