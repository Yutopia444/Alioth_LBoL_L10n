line:0ab6f07: '"Bringen wir dieses Rätsel hinter uns, damit ich weiter nach Schätzen
  suchen kann."'
line:036656a: '"Bzzt! Falsche Antwort!"'
line:0b624a2: '"Ding, ding, ding! Richtig!"'
line:03cdbc6: '[Halbherzig antworten] Verliere Ausstellungsstück: |{0}|.'
line:05d6c36: '"Endlich ist jemand gekommen, den ich auf die Probe stellen kann!"'
line:0724321: '"Korrekt! Ich hätte niemals damit gerechnet, dass du so gut über Pyramiden
  Bescheid weißt, {0}."'
line:0938bdf: '"Ich möchte lieber keine Fragen über Außerirdische beantworten."'
line:039c5a0: '"Das übliche Rätsel der Sphinx wird auf Dauer langweilig, lass mich
  dir lieber ein Rätsel über die Sieben Wunder dieser Welt stellen!"'
line:0a40ad6: '"Ich kenne mich mit Pyramiden gut aus, musst du wissen."'
line:0a2f677: '"Es ist schwer eine andere Person zu finden, die mein Interesse für
  Pyramiden teilt."'
