line:03cdbc6: '[Réponse sommaire] Perdez |{0}|'
line:0b5073d: '{0}'
line:0a40ad6: "\"En fait, je m'y connais pas mal sur les pyramides.\""
line:023b634: '{0}'
line:0724321: "\"C'est exact ! Je ne m'attendais pas à ce que Mme {0} en sache autant\
  \ sur les pyramides.\""
line:08213a5: '[Quitter] Il ne se passe rien.'
line:036656a: '"Bzzt ! Mauvaise réponse !"'
line:0c2ebc4: '[Réfléchir] Perdez |{0}|, gagnez |{1}|'
line:0711f2e: '[Réfléchir] Perdez |{0}| (Toutes les pièces admissibles ont été obtenues)'
line:0b624a2: "\"Ding ! C'est exact !\""
line:0abb37a: '[Réponse honnête] Perdez |{0}| (Toutes les pièces éligibles ont été
  obtenues)'
line:0bfb06e: '[Réponse honnête] Perdez |{0}|, gagnez |{1}|'
line:05d6c36: "\"Enfin, quelqu'un est venu répondre à mon énigme.\""
line:039c5a0: '"Ça devient lassant de toujours poser la même énigme du Sphinx, alors
  je vais en poser une sur les Sept Merveilles du monde !"'
line:0ab6f07: '"Dépêche-toi de finir de me poser ton énigme pour que je puisse récupérer
  le trésor qui se cache derrière."'
line:0a2f677: '"Il est rare de trouver une autre personne aussi intéressée par les
  tombes des pharaons que moi."'
line:0938bdf: '"Je préfère ne pas répondre aux questions sur les extraterrestres."'
