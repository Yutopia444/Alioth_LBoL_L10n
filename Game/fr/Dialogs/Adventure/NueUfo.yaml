line:0b3c24c: "\"Alors, en quoi est-ce différent de d'habitude ?\""
line:02e269d: '[Physique] Gagnez la merveille : |Ensemble OVNI|.'
line:02c3f5f: '[Numérique] Gagnez la merveille : |OVNI Numérique|.'
line:095b051: '[Quitter] Il ne se passe rien.'
line:06ae443: '"Héhé, puisque tu es tellement intéressée par les extraterrestres,
  tu peux avoir mes OVNIs ! Prends-en un !"'
line:02d45a7: "\"Çà a l'air tout nouveau.\""
line:02b9647: "\"Si tu n'en veux plus, tu peux aussi les vendre à quelqu'un d'autre.\""
line:0b8ee98: '"Mais non, tu peux le garder en souvenir."'
line:07ebb66: "\"Il n'y a pas plein d'extraterrestres à Eientei ? Va là-bas, et tu\
  \ en verras autant que tu veux.\""
line:0782c18: "\"Ceux-là ne comptent pas ; il faut que ce soit le genre d'individu\
  \ gardé caché par des hommes en noir — tu vois le genre ?\""
line:00f952e: "\"J'ai entendu parler de gens bizarres du monde extérieur qui sont\
  \ comme toi. Ils pensent que le monde réel est une simulation.\""
line:00848b0: Celle qui se tient devant vous en ce moment, c'est la vraie moi. Je
  viens de m'échapper de la "Matrice".
