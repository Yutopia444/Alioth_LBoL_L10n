line:0b3c24c: "\"Alors, en quoi est-ce différent de d'habitude ?\""
line:02e269d: '[Physique] Gagnez la merveille : |Ensemble OVNI|, perdez {0} <sprite="Point"
  name="Power">'
line:02c3f5f: '[Numérique] Gagnez la merveille : |OVNI Numérique|, perdez {0} points
  de santé maximum.'
line:095b051: '[Quitter] Il ne se passe rien.'
line:06ae443: '"Héhé, puisque tu es tellement intéressée par les extraterrestres,
  tu peux avoir mes OVNIs ! Prends-en un !"'
line:02d45a7: "\"Çà a l'air tout nouveau.\""
line:02b9647: "(Si je n'en ai plus besoin, je peux simplement les vendre à quelqu'un\
  \ d'autre.)"
line:0b8ee98: '"tu peux les garder en souvenir."'
line:07ebb66: "\"Il n'y a pas plein d'extraterrestres à Eientei ? Va là-bas, et tu\
  \ en verras autant que tu veux.\""
line:0782c18: "\"Non, les humanoïdes ne comptent pas. Je parle de ceux que des hommes\
  \ en noir captureraient — tu vois le genre ?\""
line:00f952e: "\"J'ai entendu parler de gens bizarres du monde extérieur qui sont\
  \ comme toi. Ils pensent que le monde réel est une simulation.\""
line:00848b0: Celle qui se tient devant vous en ce moment, c'est la vraie moi. Je
  viens de m'échapper de la "Matrice".
line:0ffebf0: '"Ne cesse jamais d’être curieuse de l’inconnu."'
line:037b17c: "{0} ressent un vertige.\nElle a également fait un tour dans le monde\
  \ de la Matrice, même si elle ne s'en souvient plus du tout."
line:0830dc8: Les OVNI absorbent l’énergie environnante...
