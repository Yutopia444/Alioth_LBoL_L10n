line:0b4215c: "\"Quelle force vitale puissante... J'ai enfin accompli la dernière\
  \ étape de mon ascension !\""
line:0f513e5: '"Euh... pourrais-tu partager un peu de ton pouvoir ?"'
line:0f513e5.Reimu:
line:0f513e5.Marisa: "\"Hmm ? Ton pouvoir, tu peux m'en donner un peu ?\""
line:0f513e5.Sakuya: "\"Oh, dans ce cas, j'accepte.\""
line:0f513e5.Cirno: '"Hé ! Dépêche-toi de consacrer ta force à sa majesté la fée des glaces
  !"'
line:0f513e5.Koishi: '"Hein ?! Tu veux le partager avec moi ?"'
line:0c5e0c4: Les ailes d'Eternity libèrent une poudre nauséabonde... donnant à {0}
  du "pouvoir"…
line:04ad2ac: Une poudre nauséabonde s'échappe des ailes d'Eternity... {0} est prise
  de vertige…
line:0786492: '[Changement] Perdez {0} points de vie, transformez une carte en carte
  inhabituelle.'
line:0e35dc4: '"Viens et reçois la bénédiction du Dieu de la Nuit Éternelle, {0} !"'
line:0122dcf: '[Illumination] Améliorez une carte.'
line:092d6b0: Choisissez une carte à améliorer
line:0663fce: '[Oubli] Perdez {0} point de vie, retirez une carte de la bibliothèque.'
line:070b7de: '"Euh... pourrais-tu soulager un peu mon stress ?"'
line:070b7de.Reimu:
line:070b7de.Marisa:
line:070b7de.Sakuya:
line:070b7de.Cirno: "\"Pas besoin, aurais-tu oublié notre entrée dans la légende quand nous\
  \ avons vaincu cette tarée en fauteuil roulant ?\""
line:070b7de.Koishi:
line:04e7441: "\"D'accord ~ Voici ma Poudre d'Écaille Sacrée !\""
line:04e7441.Reimu:
line:04e7441.Marisa:
line:04e7441.Sakuya:
line:04e7441.Cirno: "\"Je ne veux pas m'en souvenir ! Pourquoi tu l'oublies pas aussi, idiote\
  \ !\""
line:04e7441.Koishi:
line:042c6e3: "\"Bien sûr ~ Voici ma Poudre d'Écaille Sacrée !\""
line:042c6e3.Reimu:
line:042c6e3.Marisa:
line:042c6e3.Sakuya:
line:042c6e3.Cirno: "\"Bien sûr ! Accepte ma Poudre d'Écailles Sacrées et rend leur grandeur\
  \ aux fées !\""
line:042c6e3.Koishi:
line:0cb3009: Retirez une carte de la bibliothèque
line:0122e22: '"Eh bien... tout me va, je suppose ?"'
line:0122e22.Reimu:
line:0122e22.Marisa:
line:0122e22.Sakuya:
line:0122e22.Cirno: "\" «Devenir un dieu» ? Ce n'est pas aussi amusant que de congeler des\
  \ grenouilles...\""
line:0122e22.Koishi:
line:01a7f1c: "\"C'est parti ~ Voici ma Poudre d'Écaille Sacrée !\""
line:01a7f1c.Reimu:
line:01a7f1c.Marisa:
line:01a7f1c.Sakuya:
line:01a7f1c.Cirno: "\"Vraiment ? Moi je pense que c'est plus amusant de répandre ma poudre\
  \ sur les gens pour les regarder éternuer.\""
line:01a7f1c.Koishi:
