line:05b62f1: '[Sans Touffe] Obtenez  {0} <sprite="Point" name="Power">'
line:0d0e5fe: '"Je suis un loup pas un chien !"'
line:0d0e5fe.Reimu: '"Votre temps est-il si précieux que ça ?"'
line:0d0e5fe.Marisa:
line:0d0e5fe.Sakuya: '"Je ne suis pas un animal de compagnie !"'
line:0d0e5fe.Cirno: "\"On dirait qu'on ne peut pas compter sur une baka...\""
line:0d0e5fe.Koishi: '"Tu exagères ! Ça ne devrait pas sentir mauvais, quand même... ?"'
line:035e5a2: “Bon sang, la lune m'a encore ébouriffé les cheveux...”
line:09559cc: '[Avec Touffe] Gagnez une |Merveille| aléatoire et la carte |{0}|.'
line:0d416e0: '"Comme prévu de {0}, vos aventures vont pouvoir reprendre !"'
line:0361c5f: '[Invalide] Toutes les Merveilles éligibles ont été acquises.'
line:0668b2a: "\"Est-ce qu'un toutou pelucheux n'est pas la chose la plus top de nos\
  \ jours ? Tu devrais rester comme ça ~\""
line:0668b2a.Reimu: "\"Désolé, je dois y aller !\"\n(Est-ce que la même chose arrive à Aunn\
  \ lors d'une pleine lune ?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Un loup-garou peluche... dans ce cas peut-être que Milady verra les
  loups-garous sous un jour différent"'
line:0668b2a.Cirno: "\"Ça ne viendrait pas de l'exposition ? C'est toi la voleuse ! \""
line:0668b2a.Koishi: "\"On dirait qu'il y a une odeur de bête sauvage, je n'en ai plus vraiment\
  \ envie.\""
line:02e376a: '"Bien sûr !"'
line:02e376a.Reimu: '"Bien sûr ! Avec ceci, l''incident sera résolu en un rien de temps."'
line:02e376a.Marisa: "\"Avoir plus de choses ne peut pas faire de mal, je l'accepterai avec\
  \ plaisir ~\""
line:02e376a.Sakuya: "\"Simple affaire, mais je suis plus qu'heureuse de ton aide.\""
line:02e376a.Cirno: '"Cool, avec ça je serai une maître du gel de créatures glissantes !"'
