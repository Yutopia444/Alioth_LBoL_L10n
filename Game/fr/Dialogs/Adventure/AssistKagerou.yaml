line:0d31645: "\"Mademoiselle {0}, ce trésor que j'ai trouvé vous aidera-t-il à résoudre\
  \ l'incident plus rapidement ?\""
line:05164d7: (Kagerou bondit en avant, mettant ses cheveux partout...)
