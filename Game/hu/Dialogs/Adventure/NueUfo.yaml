line:02e269d: '[Valódi] Ad egy Kiállítási Tárgyat: |UFO szett|.'
line:00848b0: '"Most láthatod az igazi énem. Most szöktem meg a Mátrixból."'
line:00f952e: '"Hallottam olyan külvilági csodabogarakról mint te magad. Azt hiszik
  hogy a valóság csak egy szimuláció."'
line:0b3c24c: '"Innen mi a különbség?"'
line:06ae443: '"Hihi, mivel annyira érdekel a földön túli élet, megkaphatod az egyik
  UFO-mat! Vedd el nyugodtan!"'
line:02b9647: (Ha nincs már rájuk szükségem, akkor csak eladom valaki másnak.)
line:0b8ee98: '"Megtarthatod emlékbe."'
line:02c3f5f: '[Digitális] Ad egy Kiállítási Tárgyat: |Digitális UFO|.'
line:02d45a7: '"Ez vadi újnak néz ki..."'
line:095b051: '[Elmegy] Semmi se történik.'
line:07ebb66: '"Már Eienteiben elegem volt az űrlényekből."'
line:0782c18: '"Áh, a humanoidok nem számítanak. Olyanokról beszélek amiket sötét
  zsaruk zárnának el, tudod."'
line:0ffebf0: '"Soha se veszítsd el a kíváncsiságod az ismeretlen iránt."'
