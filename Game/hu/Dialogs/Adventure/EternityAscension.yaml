line:0b4215c: '"Milyen bikáss életerő... Végre elértem a felemelkedés utolsó lépését!"'
line:0e35dc4: '"Gyere, szerezd meg az Örök Éj Istenének áldását, {0}!"'
line:092d6b0: Válassz ki egy Fejlesztendő kártyát
line:070b7de: '"Öhm... segítenél picit oldani a feszültséget?"'
line:070b7de.Reimu:
line:070b7de.Marisa:
line:070b7de.Sakuya:
line:070b7de.Cirno: '"Nem szükséges, nem emlékszel a legdicsőbb legendára, melyben legyőztük
  azt a kerge kerekesszékest?"'
line:070b7de.Koishi:
line:04e7441: '"Oké~ Íme a Szent Hímporom!"'
line:04e7441.Reimu:
line:04e7441.Marisa:
line:04e7441.Sakuya:
line:04e7441.Cirno: '"Nem akarok rá emlékezni! Miért nem felejted el te is, baka!"'
line:04e7441.Koishi:
line:01a7f1c: '"Rendben~ Íme a Szent Hímporom!"'
line:01a7f1c.Reimu:
line:01a7f1c.Marisa:
line:01a7f1c.Sakuya:
line:01a7f1c.Cirno: '"Így lenne? Szerintem mókásabb port szórni és nézni, ahogy az emberek
  tüsszögnek."'
line:01a7f1c.Koishi:
line:0122dcf: '[Felvilágosodás] Felfejleszt egy kártyát.'
line:0f513e5: '"Mmm... Tudnál egy kis erőt adni?"'
line:0f513e5.Reimu:
line:0f513e5.Marisa: '"Öhm, megkaphatom az erődet?"'
line:0f513e5.Sakuya: '"Ó, ebben az esetben, elfogadom."'
line:0f513e5.Cirno: '"Hé! Add az erőd a Jég Tündérurának!"'
line:0f513e5.Koishi: '"Hé!? Megosztod velem?"'
line:042c6e3: '"Rendben~ Íme a Szent Hímporom!"'
line:042c6e3.Reimu:
line:042c6e3.Marisa:
line:042c6e3.Sakuya:
line:042c6e3.Cirno: '"Jó! Vidd ezt a port és legyenek a tündérek ismét nagyszerűek!"'
line:042c6e3.Koishi:
line:0c5e0c4: Eternity szárnyai egy borzalmas szagú port bocsátanak ki... {0:d} adva
  egy kis "erőt"…
line:0663fce: '[Feltámadás] Elveszt {0} életerőt, törölj egy kártyát a könyvtárból.'
line:0cb3009: Törölj egy kártyát a könyvtárból.
line:04ad2ac: Egy borzalmas szagú por ered Eternity szárnyaiból... {0} émelyeg…
line:0786492: '[Változás] Elveszt {0} életerőt, válassz egy kártyát a könyvtárból,
  amit átalakít egy Különleges kártyává.'
line:0122e22: '"Hát... minden rendben, gondolom?"'
line:0122e22.Reimu:
line:0122e22.Marisa:
line:0122e22.Sakuya:
line:0122e22.Cirno: '"Felemelkedés? Jobb szórakozás békákat fagyasztani..."'
line:0122e22.Koishi:
line:00eb35b: Alakíts át egy kártyát egy Különleges kártyává.
line:0c16a46: Eternity szárnyai egy igazán borzasztó szagú port bocsátanak ki... {0:a}
