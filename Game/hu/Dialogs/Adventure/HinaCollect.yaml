line:017720c: '"Ó, úgy tűnik, {0} kisasszonyt sok balszerencse érte."'
line:0183740: '"Hadd hordjam én ezt a szerencsétlenséget."'
line:02dcea4: '[Segítség Elfogadása] Törli az összes |Szerencsétlenség| kártyát.'
line:06b252f: '{0} érzi, hogy az összes szerencsétlensége elhagyja őt.'
line:076f484: '"Köszönöm, Hina."'
line:076f484.Reimu: '"Hála az égnek, a mai nap épp elég gyatra volt."'
line:076f484.Marisa: '"Gondolom nem vihetem haza szuvenírnek ezeket..."'
line:076f484.Sakuya: '"Szépen feltakarítottál, Hina."'
line:076f484.Cirno: '"Olyan üdítő, mint egy hideg szelet görögdinnye."'
line:076f484.Koishi: '"Sokkal frissebb már."'
line:00dc670: '[Öleld Át] Ad egy véletlen |Szerencsétlenséget|.'
line:037bd0d: '"Nem, ezúttal én viselem a terhét helyetted."'
line:037bd0d.Reimu: '"Elhesegetni a bajt és elűzni a gonoszt mind része egy szentélylány
  feladatkörének."'
line:037bd0d.Marisa: '"Tudod, nem vagyok válogatós kinézet terén."'
line:037bd0d.Sakuya: '"Asszonyomat... is érdekelheti."'
line:037bd0d.Cirno: '"Semmiség, csak hagyd rám! Megfagyasztom az összes szerencsétlenséget!"'
line:037bd0d.Koishi: '"Szóval ilyen érzés szerencsétlenségeket halmozni."'
line:0a76aa4: '[Elmegy] Semmi se tőrténik.'
line:09f1923: '"Örök óvatos vagy hmm. Nincs, csakis tiszta szándékom."'
line:0d580ed: '"Lehet hogy egy szerencsétlenség, de része a gyűjteményemnek..."'
