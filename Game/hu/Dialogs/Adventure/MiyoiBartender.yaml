line:0c9cdfa: '{0} tévedésből belép késő este a |Sanshoku Geidonteibe|, erős alkoholszag
  terjeng az épületben…'
line:0868bad: (Geidontei... Ha jól emlékszem, youkaioknak nyíl meg éjszakánként.)
line:0c66585: '"{0} kisasszony! Kerülj beljebb! Mit szeretnél inni a minap?"'
line:096d262: '"Az a különleges sake amit Aya ivott legutóbb, abból adj nekem egyet!"'
line:0da2517: '"No megállj, {0} kisasszony, biztos bírni fogod?"'
line:05ad143: '"Há... Ekkora nagy?! De mindenki engem figyel, nem fordulhatok vissza!"'
line:0c7c734: ({0} végre letorkolja a |Bálna Lehelletét|, de a pia miatt elfelejti
  a számlát, valamint valami fontosat.)
line:0269654: El.. felejtettem valamit? Válassz egy törlendő kártyát.
line:018cd9a: '[Ivóbajnokság] {0} <sprite="Point" name="Gold"> aranyat ad, és két
  Szerencsétlenséget: |{1}|.'
line:0c77879: '"Mi a baj Suika? Azóta azt az önelégült képet vágod mióta beléptem
  az ajtón."'
line:0c77879.Reimu:
line:0c77879.Marisa: '"Te oni, be vagy csiccsentve, a fejedbe nincs is más csak alkohol."'
line:0c77879.Sakuya: '"Ó egek, már azóta érzem a tarkómon azt a szúrós tekintetet,
  mióta beléptem az ajtón. Mi a baj?"'
line:0c77879.Cirno: '"Hé! Csak azért mert azt gondolod én vagyok a legerősebb, nem
  azt jelenti hogy kötekedhetsz is velem."'
line:0c77879.Koishi: '"Oni kisasszony, egész végig engem bámultál?"'
line:0b95170: "\"Mit mondtál, {0}? Egy-pohártól-kifekszem kisasszony csak nem kihí'sz\
  \ engem?\""
line:00d22c7: A környező youkaiok buzdítani kezdik a párost, néhányan még fogadnak
  is arra, hogy ki marad talpon.
line:0bdfac4: "\"Fe' aka'sz nevelni egy házibálnát? A' nem lesz elég!\""
line:0064f30: '"Íme a végső támadásom, Mélytöltet!"'
line:0064f30.Reimu: '"Ne becsüld alá egy szentélylány ivó képességét—Profi vagyok
  ebben."'
line:0064f30.Marisa: '"Ne beszélj itt sületlenségeket!.. Hozz egy erősebbet!"'
line:0064f30.Sakuya: '"Nem érdekel az alkoholtartalom, vagy bármi ilyesmi!"'
line:0064f30.Cirno: '"Ne becsüljön alá! Minden tündért fel tudok kérni hogy igyon
  magával!"'
line:0064f30.Koishi: '"Úúh~ Forog a vilááág~~ Ez kezd vicces lenni!"'
line:0c29c84: "Elszántsággal megtelve, {0} győzedelmeskedik, és hazaviszi a díjat.\n\
  De milyen áron?"
line:0bea743: '[Egy Korty] Harcba lép egy véletlen csapatnyi ellenféllel és ad egy
  véletlen Ritka Kiállítási Tárgyat.'
line:05203c5: '"Igen igen, a szokásost kérem. Írd a számlámra, rendben?"'
line:05203c5.Reimu: '"Hát, akkor ez is mehet a számlámra, ahogy szoktuk."'
line:05203c5.Marisa: '"Fizetek legközelebb ha járok erre. Addig is, adj még egy kis
  időt~"'
line:05203c5.Sakuya: '"Ez mehetne a kapuőr számlájára?"'
line:05203c5.Cirno: '"Pénz? Milyen pénz?"'
line:05203c5.Koishi: '"Hát akkor, szióka!"'
line:0862f2d: '"Hékás—nem tartozol még nekem a múlt hónapival?"'
line:015f1aa: '"Úh, miért lettem annyira álmos csak egy... üveg után..."'
line:024e390: (Egy álomban, {0} egy gyanúsított jelenlétét érzi!)
line:0e46351: '"Oly erőteljes illúziók... tettél valamit a boromba?!"'
line:0e46351.Reimu: '"Forog a világ... Mennyire volt erős az a sake amit letoltál
  a torkomon!?"'
line:0e46351.Marisa: '"Fú, ezek baromi káprázatok... Nem tettél valamit a sakemba
  ugye?"'
line:0e46351.Sakuya: '"Miért lila a fal... A közönséges sake ezt váltja ki az emberből?"'
line:0e46351.Cirno: '"Ahj de borzalmasan érzem magam... Ez azt jelenti valaki tett
  valamit az italomba!"'
line:0e46351.Koishi: '"Hmm... Az a sake... mintha valaki megspékelte volna..."'
line:0b0300d: '"Úáá! Kérlek fogadd el ezt és tartsd titokban."'
line:0b3a02b: '[Elfogad] Ad egy Kiállítási Tárgyat: |{0}|.'
line:0bd13e0: '"Na így kell üzletelni. Viszlát legközelebb~"'
line:0bd13e0.Reimu: '"Az nem kevés egy youkainak. Gyakrabban fogok erre járni."'
line:0bd13e0.Marisa: '"Szép munka! Legközelebb is rád fogunk számítani."'
line:0bd13e0.Sakuya: '"Ez olyan nagylelkű! Biztosra veheti, hogy legközelebb is megállok
  itt."'
line:0bd13e0.Cirno: '"Óh, ezt nekem adod!? Annyira egy kedves lélek vagy!"'
line:0bd13e0.Koishi: '"Itt leszek legközelebb is~"'
line:0d8166c: '[Elutasít] Semmi se történik.'
line:01b5a50: '"Nem kösz, nem dőlök be a trükkjeidnek többé."'
line:01b5a50.Reimu:
line:01b5a50.Marisa: '"Hé, hé, engedj kicsit—Mára ennyi elég."'
line:01b5a50.Sakuya:
line:01b5a50.Cirno: '"Még ma vissza kéne mennem!"'
line:01b5a50.Koishi: '"Nem fogok visszatérni, ugye tudod~"'
line:0ea1dc5: '[Érvénytelen] Minden elérhető Kiállítási Tárgyat összeszedted.'
line:061da42: '[Vedel] Ad egy Kiállítási Tárgyat: |{0}|, és töröl egy kártyát a könyvtárból.'
