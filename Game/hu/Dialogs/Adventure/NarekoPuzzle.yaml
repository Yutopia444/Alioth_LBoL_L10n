line:0ab6f07: '"Essünk túl rajta, had térjek utána vissza a kincskeresésre."'
line:036656a: '"Bzzz! Rossz válasz!"'
line:0b5073d: '{0}'
line:0a40ad6: '"Tudod, jártas vagyok a piramisokban."'
line:0b624a2: '"Csing csing csing! Helyes!"'
line:023b634: '{0}'
line:0a2f677: '"Nehéz találni olyasvalakit aki hozzám hasonlóan érdekelt a piramisokban."'
