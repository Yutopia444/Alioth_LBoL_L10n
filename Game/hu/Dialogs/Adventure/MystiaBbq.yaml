line:0eff719: '[Érvénytelen] Nincs elég <sprite="Point" name="Gold">.'
line:08ebd93: '"Rendben, egy grillezett ingolát kérek akkor."'
line:08ebd93.Reimu:
line:08ebd93.Marisa: '"Már a grillezett Ingóla gondolatától csorog a nyálam."'
