line:05eb4e6: '{0}'
line:01150b0: '"Kérlek gyere máskor is~"'
line:0284c65: '[Egyél és Fuss] Ne fizess.'
line:01cb698: '"Hoppá, otthon maradt a tárcám, csak rakd a számlámra."'
line:01cb698.Reimu:
line:01cb698.Marisa: '"Ez nem parazsálás, tudod? Csak a vacsora kalóriatöbbletét dolgozom
