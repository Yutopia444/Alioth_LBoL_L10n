line:01cb698.Cirno: '"Nyami! Köszi a kaját~"'
line:01cb698.Koishi: '"Ez mennyei volt! Szióka!"'
line:065edde: '"Nehogy elfuss fizetés nélkül—"'
line:06598ae: '[Grillezett Gomba] Tölt {0} <sprite="Point" name="Power">.'
line:0554174: '[Fizess Normálisan] Elvesz {0} <sprite="Point" name="Gold">.'
line:0bf0f77: '"Ez egy kis vállalkozás, de becsülettel tartom fenn...!"'
