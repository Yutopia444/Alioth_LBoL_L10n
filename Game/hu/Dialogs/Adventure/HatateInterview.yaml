line:0fed9a3: '"{0} kisasszony, meginterjúvolhatnám önt?"'
line:0ffc3c5: '[Elfogad] Válaszolsz egy kérdésre.'
line:0f1ab7b: '"Miért döntött úgy hogy részt vesz eme probléma megoldásában, {0} kisasszony?"'
line:0e860d0: '{0} tisztességes cselekedetei terjedni kezdenek Gensokyóban, miután
  Hatate hozzáfűzött néhány "részletet".'
line:0c26759: '[Gensokyóért] Ad: |{0}|.'
line:0e688d4: '"A vágyaid után mész, mi? Akkor köszönetképpen fogadd el ezt a megjelenési
  díjat."'
line:02a8586: Pletykák kezdenek terjedni, hogy {0} meg akarja találni, majd eladni
  Kaguya titkos kincsét.
line:02ca266: '"Indok nélkül kiírtani annyi ártatlan lelket, igazán rád vall {0}."'
line:062320e: '"Az indok... mégegyszer, miért is indultam el a minap?"'
