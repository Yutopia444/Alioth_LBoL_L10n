line:093187e: '"...Igazán nemes célok! Biztosan támogatom!"'
line:01f1aca: '[Pénzért] Ad: |{0}|, {1} <sprite="Point" name="Gold"> arany.'
line:018ba4d: '[Ötletem Sincs] Ad: |{0}|, és ad egy Szerencsétlenséget: |{1}|.'
line:0db4c31: '"{0} kitálalta a mély barátságát Kaguya kisasszonnyal egy interjúban,
