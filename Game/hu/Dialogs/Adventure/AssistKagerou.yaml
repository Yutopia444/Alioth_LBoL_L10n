line:035e5a2: '"Ó Istenem, a Hold már megint bolyhosra kócolta a hajam..."'
line:0d31645: '"{0} kisasszony, fog segíteni a probléma megoldásában ez a kincs amit
  találtam?"'
line:09559cc: '[Nincs Boholy] Kapsz egy Véletlenszerű Kiállítási Tárgyat. |{0}| könyvtába
  kerül.'
line:02e376a: '"Természetesen!"'
line:02e376a.Reimu: '"Hogyne! Egy ilyen szintű probléma seperc alatt megoldódik."'
line:02e376a.Marisa: '"Több tárgy sose árt, szívesen elfogadom~"'
line:02e376a.Sakuya: '"Semmiség, nagyon szívesen segítek."'
line:02e376a.Cirno: '"Kafa, mestere vagyok a csúszós lények fagyasztásának!"'
line:02e376a.Koishi:
line:0d416e0: '"{0}-tól elvártan, az utazási terveim ismét sínen vannak!"'
line:05164d7: (Kagerou leteper, a rámragadt szőre teljesen beterít...)
line:05164d7.Reimu:
line:05164d7.Marisa:
line:05164d7.Sakuya: (Kagerou leteper, a rámragadt szőre teljesen beterít... Meg kell tisztítsam
  magam.)
line:05164d7.Cirno: (Leteper Kagerou, olyan jó meleg...)
line:05164d7.Koishi:
line:0361c5f: '[Érvénytelen] Minden elérhető Kiállítási Tárgyat összeszedted.'
line:05b62f1: '[Van Boholy] Kapsz {0} <sprite="Point" name="Power">.'
line:0668b2a: '"Egy bolyhos kutyus nem a legfelkapottabb dolog manapság? Így kéne
  maradj~"'
line:0668b2a.Reimu: "\"Bocsi, sietek!\"\n(Vajon ugyanez történik Aunnal is egy telihold\
  \ idején?)"
line:0668b2a.Marisa:
line:0668b2a.Sakuya: '"Egy aranyos, bolyhos vérfarkas... talán méltóságos asszonyom más fényben
  tekint majd vérfarkasokra."'
line:0668b2a.Cirno: '"Az nem egy kiállítási tárgy amit tartasz? Te vagy a tolvaj!"'
line:0668b2a.Koishi: '"Szörnyen bűzlik. Nem hiszem, hogy akarom én ezt."'
line:0d0e5fe: '"Farkas vagyok, nem kutya!"'
line:0d0e5fe.Reimu: '"Az időd ér annyit!"'
line:0d0e5fe.Marisa:
line:0d0e5fe.Sakuya: '"Nem vagyok háziállat!"'
line:0d0e5fe.Cirno: '"Úgy tűnik nem számíthatok egy bolondra..."'
line:0d0e5fe.Koishi: '"Ez túl sok! Nem fog bűzleni... ugye?"'
