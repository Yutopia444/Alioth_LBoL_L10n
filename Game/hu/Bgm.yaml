MainMenu:
  TrackName: A fantázia tizenkilencedik formája
  Name: Főmenü
  Comment: "Kísérleti elektronikus zene, amely a Millennium Gensokyo témája alapján\
    \ készült. Hangsúlyozza a bevezető és a refrén közötti kontrasztot, tükrözve a\
    \ játék kettős természetét, ami egyszerre könnyed és akciódús.\nValamint a \"\
    tizenkilencedik formát\" illetően, ez a tizenkilencedik Millennium Gensokyo feldolgozás,\
    \ ami a mi tollunkból ered, és továbbra is vizsgáljuk ebben a zeneműben rejlő\
    \ különféle lehetőségeket."
  Original: Gensokyo Millenium ~ History of the Moon
Stage1:
  Name: '1. Szín: Az elveszettek bambuszerdeje'
  TrackName: Éjszakai hajsza
  Original: Büntetés az örök éjszakáért ~ Imperishable Night
  Comment: "Az Elveszettek bambuszerdejének főcímdala, az első szín első háttérzenéje.\n\
    Az egész darabról leró a csata izgalma, ami felkészíti a játékost a harcra.\n\
    Ugyanakkor madárdalszerű motívumokkal fokozza az éjszakai hangulatot a zenében."
Stage2:
  Name: '2. Szín: Genbu szurdok'
  TrackName: Felfedezés és a felfedező
  Original: Fall of Fall ~ Őszi vízesés
  Comment: "A Ganbu szurdok főcímdala, a második szín háttérzenéje.\nEz egy kalandos\
    \ darab, amely a rejtélyt és az ismeretlent dolgozza fel. Az ütemét főképp a sámándob,\
    \ és az ütőgardon adja így a játékos egy ismeretlen környezetben érezheti magát."
Stage3:
  Name: '3. Szín: A szélisten tava'
  TrackName: Szellő hátán, halhatatlanok nyomában
  Original: Japán ősi tájképe, amit a lány hajdan látott
  Comment: "A Szélisten tavának főcímdala, a harmadik szín háttérzenéje.\nA zene olyan,\
    \ mint a szélben táncoló falevél, és azt az érzést kelti, mintha az ellenfeled\
    \ valóban előtted lenne. Hadd csatázzunk a levegőben erre a zenére!"
Shop:
  Original: Szélhámos Technológia
  Name: Takane boltja
  TrackName: Erdei pihenő
  Comment: "Ez egy olyan mű, ami megragadja a hétvégi hangulatot.\nNe veszekedjetek!\
    \ Lazítsunk együtt!"
Gap:
  Name: Résen belül
  TrackName: Noktürn
  Original: Nekrofantázia
  Comment: "Ez egy európai stílusú zene.\nElegáns csembalóval és békés harangjátékkal\
    \ egy mélyen nyugtató légkört ad át, mely megoldja, hogy egy kiérdemelt pihenés\
    \ után sóvárogj."
Adventure1:
  Name: Első esemény
  TrackName: Útra Fel
  Original: Gensokyo Millennium ~ History of the Moon
  Comment: "Ez egy vidám, narratív darab.\nÍr sípokkal, marimbával és különféle ütőhangszerekkel\
    \ egyidejűleg játszva, az összefonódó dallamvonalak kalandvágyat keltenek, átfogva\
    \ egy utazó csodaérzetét, aki a hegyekből készül leereszkedni és felfedezni a\
    \ világot."
Adventure2:
  Name: Második esemény
  TrackName: Játék az Erdőben
  Original: Az Istenek Szerette Gensokyo
  Comment: "Ez egy olyan zenemű, amely ellazult és pozitív érzéseket fejez ki.\nA\
    \ bevezetőben a zongora a nyugalom érzetét kelti az erdőben, míg a hegedű vidám\
    \ hangokat játszik fő dallamként, gondtalan játék látszatát teremtve az erdőben."
Adventure3:
  Name: Harmadik esemény
  TrackName: Hátrahagyva
  Original: Lányok Titkos Pecsételő Klubja
  Comment: "Ezt a zenét a szerző emós korszakából emeltük ki.\nTalán pontosabb leírása\
    \ lenne az \"OTZ\" emotikon?"
Elite1:
  Name: Első Elit
  TrackName: Ne Becsüld Alá
  Original: Örök Átmeneti Uralom
  Comment: "Ez egy olyan zene, ami egy elit ellenfél ellen játszódik.\nAz erőteljes\
    \ ritmus emlékeztet hogy egy nagyszerű csata kezdődik. Biztos vagy a győzelemben?"
Elite2:
  Name: Második Elit
  TrackName: Párbaj
  Original: Avīci harangja ~ Infinite Nightmare
  Comment: "Ez egy olyan zene, ami egy elit ellenfél ellen játszódik.\nAz erőteljes\
    \ ritmus átveszi a csata izgalmát––ha a játékos nem ad bele mindent, seperc alatt\
    \ legyőzik őt!"
Sanyue:
  Name: Három Fénytündér
  TrackName: Kiváncsi – Éber – Csintalan
  Original: Refrén a Bájos Nagyszerű Háborúból / Nagyszerű Tündérháború ~ Fairy Wars
  Comment: "Ez a Három fénytündér karakterspecifikus csatatémája.\nA párbajok már\
    \ rég időtmúltak, a barátság valódi definíciója a három az egy ellen! Halkan osonj\
    \ oda, alig hagyva nyomot. Türelmetlen vagy? Biztos hát! Had kezdődjön a büszke\
    \ teljháború!"
Aya:
  Name: Shameimaru Aya
  TrackName: Egy elhamarkodott történet
  Original: Youkai hegység ~ Mysterious Mountain
  Comment: "Ez Shameimaru Aya karakterspecifikus csatatémája.\nAkármerre fúj a szél,\
    \ azt a fényképezőgép kattogása követi. Igazság és hamisság, helyes és helytelen,\
    \ valóság és kitaláció mind utat talál az újságok lapjaira, elzavarva a délutánok\
    \ unalmát. De ha közelebbről megnézed, nem találsz mást csak bebizonyítatlan pletykákat\
    \ és sóhajtozol, \"Tipikus újságírói színvonal\"."
Rin:
  Name: Kaenbyou Rin
  TrackName: Lélek közvetítő
  Original: Hullautazás ~ Be of good cheer!
  Comment: "Ez Kaenbyou Rin karakterspecifikus csatatémája.\nNem szívesen látott youkai,\
    \ árnyak közé bújva, várja az alkalmat. Szóval, ha téged célzott be, jobb ha vigyázol.\
    \ Mikor bosszús lelkek szorítanak sarokba, nincs más választásod, szembe kell\
    \ állni velük. Viszont, lehet, hogy a \"Pokoli Karambol\" hírneve csak egy üres\
    \ cím?"
Nitori:
  TrackName: in the blue
  Original: Akutagawa Ryuunosuke "Kappája" ~ Candid Friend
  Comment: "Ez Kawashiro Nitori karakterspecifikus csatatémája.\nTalán megúszod egyszer,\
    \ kétszer, de a szerencséd véget ér harmadjára. Legközelebb összefutsz vele, jobb\
    \ ha figyelsz. Buborékfújással kezdődik az egész, majd mire észbe kapsz már a\
    \ világod a feje tetejére állt!"
  Name: Kawashiro Nitori
Youmu:
  Comment: "Ez Konpaku Youmu karakterspecifikus csatatémája.\nMinden hangjegy egy\
    \ éles penge, ami átszel mennyen, földön és minden máson. Amint a kard formája\
    \ megjelenik, nincs menekvés. Talán, egy kardhúzó szimfónia lehetne ez (hahaha)."
  Name: Konpaku Youmu
  TrackName: Lendítsd a pengét
  Original: Keleti szellemes álom ~Ancient Temple / Hiroari lőtt egy fura madarat
    ~ Till When?
Kokoro:
  Comment: "Ez Hata no Kokoro karakterspecifikus csatatémája.\nEgy mosolygó, vagy\
    \ egy síró arc lepül meg a maszk mögött? Ezer érzelem ezer kifejezéshez vezet—néhány\
    \ bíztat, néhány veszélyt rejteget. Láss a látszat mögé és talán megtalálhatod\
    \ a valódi érzelmeit, esetleg egy kulcsot, hogy segítségével fölé kerekedj."
  Name: Hata no Kokoro
  TrackName: Ǝmotioɲ
  Original: Az elveszett érzelem
Doremy:
  Comment: "Ez Doremy Sweet karakterspecifikus csatatémája.\nCsukd be a szemed, merülj\
    \ el az álomban és vessz el benne, az éberedéstől menekülbve. Az álomban a szenny\
    \ megtisztul, a rend feláll és az élet elillan."
  Name: Doremy
  TrackName: Close eyes
  Original: Örökkévaló tavaszi álom
Reimu:
  Comment: "Ez Hakurei Reimu karakterspecifikus csatatémája.\nA kaland kezdetén, ott\
    \ áll mint mindig, várva a kihívóot. Lélekpecsét örök alakja, az időtlen szabályaival\
    \ és rendjével egy áthatolhatatlan gátat alakítanak. Csak azzal nyerheted el beleegyezését\
    \ és a kegyet, hogy tovább mehetsz, hogy túljutsz ezen a megpróbáltatáson."
  Name: Hakurei Reimu
  TrackName: Lélekpecsét alakja
  Original: Leány Capricciója ~ Dream Battle
Marisa:
  TrackName: Mágia alakja
  Name: Kirisame Marisa
  Original: Szerelem Színű Master Spark
  Comment: "Ez Kirisame Marisa karakterspecifikus csatatémája.\nA hírhedt mágus épp\
    \ megérkezni látszik, színpompás belépőt ígérve. Az ég csillagfénnyel fog megtelni,\
    \ szikrávalfelgyújtva az eget, amint a mágikus ágyú elsül. A hang és fény ütközetére\
    \ a lélegzeted el fog állni!"
Clownpiece:
  Name: Clownpiece
  TrackName: Chaotic paradise
  Original: A csillagos-sávos lobogó bohóca
  Comment: "Ez Clownpiece karakterspecifikus csatatémája.\nA pokolból szakajtott káosz\
    \ az emberiségnek adott ajándéka, és a Holdfőváros kaotikus paradicsommá alakítása\
    \ egyben a legsürgetőbb feladata is. Még van időd elmenekülni, mielőtt rád talál\
    \ a probléma. 3, 2, 1... Itt a vége!"
Siji:
  Name: Shiki Eiki
  TrackName: THe last judgment
  Original: Keleti ítélet a hatvanadik évben ~ Fate of Sixty Years
  Comment: "Ez Shiki Eiki karakterspecifikus csatatémája.\nA utolsó ítélet hamarosan\
    \ elkezdődik. Valld be a bűneid a bíró előtt. Ezután adj mindenkinek esélyt hogy\
    \ ellenálljon: harcolj a szabadságukért, vagy vezekelj a bűneidért."
Sakuya:
  Name: Izayoi Sakuya
  TrackName: A megállt idő alakja
  Original: Flowering Night
  Comment: "Ez Izayoi Sakuya karakterspecifikus csatatémája.\nPillanat megáll! Ebben\
    \ az időn túli világban, minden mozzanat a tér mesterének keze alatt van. A kések\
    \ tökéletes sorrendben, szúrós véggel az ellenfél felé mutatva, majd csettintésre\
    \ megindulnak! Siettesd az elforgatott téridőt, fordíts mindent a feje tetejére."
Cirno:
  Name: Cirno
  TrackName: A fagyó jég formája
  Original: A szerelmes fiús lány
  Comment: "Ez Cirno karakterspecifikus csatatémája.\nIdőszaktól, napszaktól függően\
    \ hideg és időtlen téma. Ne becsüld alá mert egy gyerek. A gyermeki csíny résen\
    \ tart majd. Ha nem vigyázol és eljegelnek, a jövőd fog kicsúszni a kezed közül,\
    \ majd a veszély fog követni utána."
Koishi:
  Name: Komeiji Koishi
  TrackName: Szívbéli késztetések
  Original: Last Remote
  Comment: "Ez Komeiji Koishi karakterspecifikus csatatémája.\nSzívből jövő, de nem\
    \ meggondolatlan késztetések, csak a valós érzelmeket osztják meg ismeretlen álmokkal\
    \ melyek az érzelmekkel együtt özönlenek be. Csak a legerősebbek tudják megállni\
    \ hogy a gyengeségeiket kihasználhassa a legbelsőbb érzéseiken keresztül!"
Alice:
  Name: Alice
  TrackName: Bábok formája
  Original: Bábítélet ~ A lány, aki emberutánzatokkal játszott
  Comment: "Ez Alice Margatroid karakterspecifikus csatatémája.\nSzámára, a pillanat,\
    \ mikor a mágikus fonalakkal lógatott bábok leereszkednek az égből és körbeveszik\
    \ az ellenfelet, a győzelem már a sarkon van. Az ellenfele csakis azért ellenállhatott,\
    \ mert nem használta a telj erejét. Az egyetlen módszer, amivel legyőzheted, az\
    \ hogy kibogozod ezt a káoszi, összekuszált fonalhálót. Találd meg a helyes nyomokat,\
    \ és vadászd le a bábok mögötti mágust."
Long:
  Name: Iizunamaru Megumu
  TrackName: A hulló csillag formája
  Original: Tenma csillagos hegye
  Comment: "Ez Iizunamaru Megumu karakterspecifikus csatatémája.\nEgy szikra kigyújthatja\
    \ az egész mezőt, de egy halálos fegyver is lehet, ha az ellenfelet célzod meg\
    \ vele. Ha elveszted az irányt eme fantasztikus Hullócsillag formájában, a veszély\
    \ követni fog, mint az árnyékod. A csillagfény halványodik, tehát ez az utolsó\
    \ esélyed, hogy a veszélyt menedékké alakítsd. Találd meg az egyetlen kiutat ebből\
    \ a színkaleidoszkópból!"
Tianzi:
  Name: Hinanawi Tenshi
  TrackName: Ragyogó kard formája
  Original: Bhavaagra egy gyermek szemén keresztül
  Comment: "Ez Hinanawi Tenshi karakterspecifikus csatatémája.\nTenshi leereszkedik,\
    \ és a kardjának aurája követi. Lendulete a menny és pokol kettécsapására is képes,\
    \ olyan visszhangal ami megrezgetné a világot. Abban a pillanatban, mikor a Ragyogó\
    \ kard formája megáll, az ellenség gyengeségei kitárulnak. Ahogy a föld remeg,\
    \ ez a kisasszony elseper mindenkit aki tiszteletlen felé."
Yuyuko:
  TrackName: Pillangótánc formája
  Name: Saigyouji Yuyuko
  Original: Virágozz büszkén, tintaszín cseresznye ~ Border of Life
  Comment: "Ez Saigyouji Yuyuko karakterspecifikus csatatémája.\nEgy elegáns, klasszikus\
    \ dallam tölti meg a levegőt, megtáncoltatja a pillangókat és a szellemeket. Ha\
    \ benézel az alvilág kapuin, a holtak földjére be ne tedd a lábad. A Pillangótánc\
    \ formája halkan megáll, a felfordulás hirtelen abbamarad, csak cseresznyevirágokat\
    \ hagyja kibontakozva és a holtakat elhunyva."
Remilia:
  Name: Remilia
  TrackName: Bíborvörös formája
  Original: Szeptett egy halott királylánynak
  Comment: "Ez Remilia Scarlet karakterspecifikus csatatémája.\nEgy meghívó a Bíbor\
    \ Örök Kastély úrnőjétől, Kérem üljön le és igyon egy kis teát.\nTermészetesen\
    \ csak egy erőteljes, pulzáló ritmus tudja követni a levegőben kavargó bíbort,\
    \ de légy óvatos, lehet bekebelez a Bíborvörös formája mielőtt észbekapnál."
Sanae:
  Name: Kochiya Sanae
  TrackName: Szélpapnő formája
  Original: A halandó embereké a hit
  Comment: "Ez Kochiya Sanae karakterspecifikus csatatémája.\nIdézd meg a szelet!\
    \ Majd harcolj! Táncolj az elektronikus zene ritmusára, és mielőtt felismernéd\
    \ a Szélpapnő formája alakot öntött. Gensokyo lakosai, ragaszkodjatok a hitetekhez\
    \ és várjátok a Szél Isten által hozott csodát."
Junko:
  Name: Junko
  TrackName: Gyilkos szándék formája
  Original: Pure Furies ~ A szív holléte
  Comment: "Ez Junko karakterspecifikus csatatémája.\nA bosszúvágy átalakul vak hitté,\
    \ megfogadva, hogy minden ellenséget felfal könyörület nélkül. A Gyilkos szándék\
    \ formájába zárva az őrült dallam a csatát a káosz határáig tolja. Győzelem és\
    \ vereség ül a mérlegen."
Stage4:
  Name: 'Végső Szín: A Szélisten tava fölötti egekben'
  TrackName: Az út a központhoz
  Original: A bolhából elefánttá vált öregtorony
  Comment: "Ez a végső szín témája.\nA legerősebb ellenfél áll a világ közepén. Minden\
    \ út a világ közepébe vezet, egyszer egy hely amit nem lehetett megrendíteni,\
    \ de most…"
Seija:
  Name: Kijin Seija
  TrackName: Társadalmi felfordulás és végső patthelyzet
  Original: Drámai kiruccanás
  Comment: "Ez Kijin Seija karakterspecifikus csatatémája.\nA végső csatára vezető\
    \ útra indultál, egy világban ahol minden a feje tetején vár. Adj bele mindent,\
    \ és adj egy esélyt hogy felfordítsd a társadalmi rendet a káoszban, tégy mindent\
    \ helyre."
Fail:
  Original: A fenséges ódon csatamező ~ Suwa Foughten Field
  Name: Vereség
  TrackName: Vereség
Victory:
  Name: Győzelem
  TrackName: Győzelem
  Original: Az ezeréves Gensokyo ~ History of the Moon
VictoryLong:
  Name: Győzelem (hosszabbított)
  Original: Az ezeréves Gensokyo ~ History of the Moon
  TrackName: Győzelem (hosszabbított)
